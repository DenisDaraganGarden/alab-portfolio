<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпросмотр кейса — A.LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background: #e9e9ec; color: #1d1d1f; }

        .pv-bar {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem;
            background: rgba(255,255,255,0.86);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .pv-title { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em; }
        .pv-status { font-size: 0.72rem; color: #6e6e73; }
        .pv-status b { color: #1d1d1f; }
        .pv-spacer { flex: 1; }
        .pv-seg { display: inline-flex; background: #e4e4e7; border-radius: 8px; padding: 2px; }
        .pv-seg button {
            border: none; background: transparent; cursor: pointer;
            font: inherit; font-size: 0.78rem; font-weight: 600; color: #6e6e73;
            padding: 0.3rem 0.7rem; border-radius: 6px;
        }
        .pv-seg button.on { background: #fff; color: #1d1d1f; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
        .pv-live { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: #6e6e73; }
        .pv-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
        .pv-dot.flash { animation: pvpulse 0.6s ease; }
        @keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6);} 100% { box-shadow: 0 0 0 8px rgba(46,204,113,0);} }

        .pv-stage { display: flex; justify-content: center; padding: 1.25rem; }
        .pv-frame-wrap { width: 100%; max-width: 1280px; }
        .pv-frame-wrap.mobile { max-width: 402px; }
        .pv-frame-wrap.mobile .pv-shell {
            border: 10px solid #1d1d1f; border-radius: 34px; overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.35);
        }
        .pv-shell {
            background: #f5f5f7; border-radius: 14px; overflow: hidden;
            box-shadow: 0 20px 50px -24px rgba(0,0,0,0.28);
        }
        iframe#pvFrame { display: block; width: 100%; height: 82vh; border: none; background: #f5f5f7; }
        .pv-frame-wrap.mobile iframe#pvFrame { height: 78vh; }

        .pv-empty {
            padding: 4rem 1.5rem; text-align: center; color: #6e6e73;
            font-size: 0.95rem; line-height: 1.6;
        }
        .pv-empty code { background: #dcdce0; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="pv-bar">
        <span class="pv-title" id="pvTitle">Предпросмотр кейса</span>
        <span class="pv-status" id="pvStatus"></span>
        <span class="pv-spacer"></span>
        <span class="pv-live"><span class="pv-dot" id="pvDot"></span>живой — меняется при редактировании</span>
        <span class="pv-seg" id="pvSeg">
            <button data-mode="desktop" class="on">🖥 Десктоп</button>
            <button data-mode="mobile">📱 Мобильный</button>
        </span>
    </div>
    <div class="pv-stage">
        <div class="pv-frame-wrap" id="pvWrap">
            <div class="pv-shell">
                <iframe id="pvFrame" title="Предпросмотр кейса"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { renderCaseBlocks } from '/site-js/sections/case-blocks.js';

        const STORAGE_KEY = 'alab_preview_case';
        const frame = document.getElementById('pvFrame');
        const titleEl = document.getElementById('pvTitle');
        const statusEl = document.getElementById('pvStatus');
        const wrap = document.getElementById('pvWrap');
        const dot = document.getElementById('pvDot');
        let mode = 'desktop';

        // Тот же оживляющий скрипт, что и в панели редактора: reveal-блоки и
        // ленивое видео (иначе opacity:0 без src осталось бы невидимым).
        const HYDRATE = [
            "var nodes=document.querySelectorAll('.case-block-reveal');",
            "var show=function(el){el.classList.add('is-visible')};",
            "if(window.IntersectionObserver){",
            "var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)show(e.target)})},{threshold:0.12});",
            "nodes.forEach(function(el){io.observe(el)});",
            "setTimeout(function(){nodes.forEach(show)},1400);",
            "}else{nodes.forEach(show)}",
            "document.querySelectorAll('.case-video[data-src]').forEach(function(v){",
            "v.src=v.dataset.src;var w=v.closest('.case-block-video');",
            "v.addEventListener('playing',function(){if(w)w.classList.add('is-playing')});",
            "v.addEventListener('loadeddata',function(){if(w)w.classList.add('is-playing')});",
            "v.play().catch(function(){if(w)w.classList.add('is-playing')});});"
        ].join('');
        // Карусели оживляет боевой hydrateCaseSliders — тот же модуль, что на сайте
        const SLIDER_SCRIPT = `<script type="module">import{hydrateCaseSliders}from'/site-js/sections/case-blocks.js';hydrateCaseSliders(document);<\/script>`;

        const emptyDoc = (msg) => `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:'Roboto',sans-serif;background:#f5f5f7}</style></head><body><div style="padding:4rem 1.5rem;text-align:center;color:#6e6e73;font-size:0.95rem;line-height:1.6">${msg}</div></body></html>`;

        function buildDoc(proj) {
            const blocks = Array.isArray(proj?.blocks) ? proj.blocks : [];
            const html = renderCaseBlocks(blocks);
            if (!html.trim()) {
                return emptyDoc('В этом кейсе пока нет включённых блоков.<br>Добавьте блоки в редакторе — предпросмотр обновится сам.');
            }
            const pad = 'clamp(1.5rem,5vw,5rem) 0';
            const accent = /^#[0-9a-fA-F]{3,8}$/.test(proj?.accentColor || '') ? `--case-accent-color:${proj.accentColor};` : '';
            return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">`
                + `<base href="${location.origin}/"/>`
                + `<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">`
                + `<link href="/site-css/sections/case-blocks.css" rel="stylesheet">`
                + `<style>*{box-sizing:border-box;margin:0;padding:0}body{${accent}background:var(--case-bg,#f5f5f7);color:var(--case-text,#1d1d1f);font-family:'Roboto',sans-serif;padding:${pad}}</style>`
                + `</head><body>${html}<script>${HYDRATE}<\/script>${SLIDER_SCRIPT}</body></html>`;
        }

        function readProj() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        }

        function render(flash) {
            const proj = readProj();
            if (!proj) {
                titleEl.textContent = 'Предпросмотр кейса';
                statusEl.textContent = '';
                frame.srcdoc = emptyDoc('Откройте предпросмотр из редактора кнопкой «Превью».<br>Данные кейса передаются из открытой вкладки редактора.');
                return;
            }
            titleEl.textContent = proj.title || 'Кейс без названия';
            const enabled = (proj.blocks || []).filter(b => b && b.enabled !== false).length;
            const draft = proj.status === 'draft';
            statusEl.innerHTML = `<b>${enabled}</b> блок(ов) · ${draft ? 'черновик' : 'опубликован'}`;
            frame.srcdoc = buildDoc(proj);
            if (flash) { dot.classList.remove('flash'); void dot.offsetWidth; dot.classList.add('flash'); }
        }

        // Переключатель десктоп/мобильный
        document.getElementById('pvSeg').addEventListener('click', (e) => {
            const btn = e.target.closest('button'); if (!btn) return;
            mode = btn.dataset.mode;
            [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === btn));
            wrap.classList.toggle('mobile', mode === 'mobile');
        });

        // Живое обновление: редактор пишет свежий кейс в localStorage на каждом
        // изменении — здесь ловим событие storage и перерисовываем.
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) render(true);
        });

        render(false);
    </script>
</body>
</html>
