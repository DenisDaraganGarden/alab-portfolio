<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>A.LAB — Редактор</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

        /* Login */
        .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
        .login-box{width:340px;padding:2.5rem;background:#111;border:1px solid #1a1a1a;border-radius:12px}
        .login-logo{font-size:1.4rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.3rem}
        .login-sub{font-size:0.8rem;color:#555;margin-bottom:2rem}
        .login-field{margin-bottom:1rem}
        .login-field label{display:block;font-size:0.72rem;color:#666;margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.06em}
        .login-btn{width:100%;padding:0.7rem;background:#fff;color:#000;border:none;border-radius:6px;font-weight:700;font-size:0.9rem;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s}
        .login-btn:hover{opacity:0.85}
        .login-btn:disabled{opacity:0.4;cursor:default}
        .login-err{color:#e74c3c;font-size:0.78rem;margin-top:0.75rem;text-align:center}

        /* Layout */
        .cms-wrap{max-width:1400px;margin:0 auto;padding:2rem 1.5rem 4rem}
        .cms-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;border-bottom:1px solid #222;padding-bottom:1.5rem}
        .cms-title{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em}
        .cms-user{font-size:0.75rem;color:#555;display:flex;align-items:center;gap:0.75rem}

        /* Buttons */
        .btn{padding:0.5rem 1rem;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:0.85rem;transition:opacity 0.2s}
        .btn:hover{opacity:0.85}
        .btn-white{background:#fff;color:#000}
        .btn-dark{background:#1a1a1a;color:#ccc;border:1px solid #333}
        .btn-red{background:#c0392b;color:#fff}
        .btn-blue{background:#2980b9;color:#fff}
        .btn-sm{padding:0.35rem 0.7rem;font-size:0.78rem}
        .btn-ghost{background:none;border:none;color:#666;cursor:pointer;font-size:0.78rem;padding:0.3rem 0.5rem}
        .btn-ghost:hover{color:#eee}

        /* Inputs */
        .input{background:#151515;border:1px solid #2a2a2a;padding:0.55rem 0.75rem;color:#eee;width:100%;border-radius:6px;font-size:0.9rem}
        .input:focus{outline:none;border-color:#555}
        select.input{appearance:auto}
        textarea.input{resize:vertical;font-family:monospace;font-size:0.82rem;min-height:80px}

        /* Cards */
        .cat-section{margin-bottom:2rem}
        .cat-label{font-size:0.8rem;color:#666;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem}
        .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem}
        .proj-card{background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;cursor:pointer;transition:border-color 0.2s}
        .proj-card:hover{border-color:#444}
        .proj-card-id{font-size:0.7rem;color:#555;margin-bottom:0.3rem}
        .proj-card-title{font-weight:600;font-size:0.95rem}

        /* Editor */
        .editor-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;gap:0.5rem}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .field-label{font-size:0.75rem;color:#777;margin-bottom:0.3rem;display:block}

        /* Blocks */
        .block-item{background:#111;border:1px solid #222;border-radius:8px;padding:1rem;margin-bottom:0.75rem}
        .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
        .block-type{font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#5dade2}
        .block-actions{display:flex;gap:0.3rem}
        .block-actions button{background:none;border:none;color:#666;cursor:pointer;font-size:0.85rem;padding:2px 6px;border-radius:4px}
        .block-actions button:hover{background:#222;color:#eee}

        .add-bar{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;padding-top:1rem;border-top:1px solid #1a1a1a}

        /* Preview */
        .preview-wrap{margin-top:1rem}
        .preview-label{font-size:0.75rem;color:#e67e22;font-weight:600;margin-bottom:0.5rem}
        .preview-container{position:relative;width:100%;background:#0a0a0a;border:1px solid #333;border-radius:6px;overflow:hidden}
        .preview-container iframe{width:1440px;height:900px;transform-origin:top left;border:none;display:block;pointer-events:none}


        /* Split layout */
        .editor-split{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
        .editor-panel{min-width:0}
        .live-preview{background:#111;border:1px solid #222;border-radius:8px;overflow:hidden}
        .live-preview-header{padding:0.5rem 0.75rem;font-size:0.75rem;font-weight:600;color:#e67e22;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
        .live-preview-frame{position:relative;width:100%;overflow:hidden}
        .live-preview-frame iframe{width:1440px;transform-origin:top left;border:none;display:block;pointer-events:none}
        @media(max-width:900px){.editor-split{grid-template-columns:1fr}.live-preview{position:static}}


        /* Style toolbar */
        .style-bar{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem;align-items:center}
        .style-bar .sb-group{display:flex;gap:2px;align-items:center;padding-right:0.5rem;border-right:1px solid #222}
        .style-bar .sb-group:last-child{border:none}
        .style-bar button{background:#1a1a1a;border:1px solid #333;color:#999;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center}
        .style-bar button.active{background:#2980b9;color:#fff;border-color:#2980b9}
        .style-bar button:hover{border-color:#555;color:#eee}
        .style-bar select{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:0.2rem;border-radius:4px;font-size:0.72rem;height:28px}
        .style-bar input[type=color]{width:28px;height:28px;padding:0;border:1px solid #333;border-radius:4px;background:none;cursor:pointer}
        .style-bar input[type=number]{width:50px;background:#1a1a1a;border:1px solid #333;color:#ccc;padding:0.2rem 0.3rem;border-radius:4px;font-size:0.72rem;height:28px}
        .style-bar .sb-label{font-size:0.65rem;color:#555;margin-right:0.2rem}


        /* Rich Editor */
        .rich-editor{background:#151515;border:1px solid #2a2a2a;padding:0.75rem;color:#eee;width:100%;border-radius:6px;font-size:0.95rem;line-height:1.6;outline:none;margin-top:0.5rem;overflow-y:auto;max-height:300px;white-space:pre-wrap;word-break:break-word}
        .rich-editor:focus{border-color:#555}
        .rich-editor:empty:before{content:attr(data-placeholder);color:#555}
        .rich-editor b,.rich-editor strong{font-weight:700}
        .rich-editor i,.rich-editor em{font-style:italic}


        .proj-card{display:flex;align-items:center;gap:0.75rem;background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;cursor:pointer;transition:background 0.3s}
        .proj-card-logo{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#222;padding:6px;flex-shrink:0}
        .proj-card-nologo{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#2980b9,#8e44ad);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:1.2rem;font-weight:700;color:#fff;flex-shrink:0}


        /* Drag & Drop */
        .block-item{transition:transform 0.2s,opacity 0.2s}
        .block-item.dragging{opacity:0.4;transform:scale(0.97)}
        .block-item.drag-over{border-color:#2980b9;box-shadow:0 0 0 2px rgba(41,128,185,0.3)}
        .drag-handle{cursor:grab;color:#555;font-size:1rem;padding:0 4px;user-select:none}
        .drag-handle:active{cursor:grabbing}

        /* Status badge */
        .status-badge{font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:99px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
        .status-published{background:#27ae60;color:#fff}
        .status-draft{background:#555;color:#ccc}

        /* Autosave indicator */
        .save-indicator{font-size:0.72rem;display:flex;align-items:center;gap:0.3rem}
        .save-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
        .save-dot.saved{background:#27ae60}
        .save-dot.unsaved{background:#e67e22}
        .save-dot.saving{background:#2980b9;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

        /* Mobile preview toggle */
        .preview-mode-btn{padding:0.2rem 0.5rem;font-size:0.7rem;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#999;cursor:pointer}
        .preview-mode-btn.active{background:#2980b9;color:#fff;border-color:#2980b9}

        /* Template modal */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9998}
        .modal-box{background:#111;border:1px solid #333;border-radius:12px;padding:2rem;max-width:500px;width:90%}
        .modal-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
        .template-card{padding:1rem;background:#1a1a1a;border:1px solid #222;border-radius:8px;cursor:pointer;transition:border-color 0.2s;margin-bottom:0.5rem}
        .template-card:hover{border-color:#2980b9}
        .template-name{font-weight:600;margin-bottom:0.2rem}
        .template-desc{font-size:0.8rem;color:#666}

        /* SEO section */
        .seo-section{background:#0d1117;border:1px solid #1a2332;border-radius:8px;padding:1rem;margin-top:1rem}
        .seo-label{font-size:0.7rem;color:#58a6ff;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.7rem}

        /* Toast */
        .toast{position:fixed;bottom:1rem;right:1rem;padding:0.6rem 1.2rem;border-radius:6px;font-size:0.85rem;font-weight:600;z-index:9999;animation:fadeIn .3s ease}
        .toast-ok{background:#27ae60;color:#fff}
        .toast-err{background:#c0392b;color:#fff}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .empty-state{text-align:center;padding:4rem 2rem;color:#444}
        .empty-state p{margin-top:0.5rem;font-size:0.9rem}

        /* Tabs */
        .tabs{display:flex;gap:0;border-bottom:1px solid #222;margin-bottom:2rem}
        .tab{padding:0.6rem 1.2rem;font-size:0.85rem;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
        .tab:hover{color:#ccc}
        .tab.active{color:#fff;border-bottom-color:#fff}

        /* Settings */
        .settings-section{margin-bottom:2rem;padding:1.5rem;background:#111;border:1px solid #222;border-radius:8px}
        .settings-title{font-size:1rem;font-weight:700;margin-bottom:1rem}
        .audio-letter{display:flex;align-items:center;gap:1rem;padding:0.75rem 0;border-bottom:1px solid #1a1a1a}
        .audio-letter:last-child{border:none}
        .audio-letter-char{font-size:1.8rem;font-weight:800;width:50px;text-align:center;color:#fff;font-family:'Unbounded',sans-serif}
        .audio-letter-info{flex:1}
        .audio-letter-label{font-size:0.75rem;color:#666;margin-bottom:0.3rem}
        .audio-letter-file{font-size:0.82rem;color:#5dade2}
        .audio-letter-actions{display:flex;gap:0.5rem;align-items:center}
        .volume-slider{width:80px;accent-color:#5dade2}

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Undo/Redo Hook ───
        function useHistory(initial) {
            const [states, setStates] = useState([JSON.parse(JSON.stringify(initial))]);
            const [idx, setIdx] = useState(0);
            const current = states[idx];
            const set = useCallback((val) => {
                const v = typeof val === 'function' ? val(states[idx]) : val;
                setStates(prev => [...prev.slice(0, idx + 1), JSON.parse(JSON.stringify(v))].slice(-30));
                setIdx(i => Math.min(i + 1, 29));
            }, [idx, states]);
            const undo = useCallback(() => setIdx(i => Math.max(0, i - 1)), []);
            const redo = useCallback(() => setIdx(i => Math.min(states.length - 1, i + 1)), [states.length]);
            const canUndo = idx > 0;
            const canRedo = idx < states.length - 1;
            return [current, set, { undo, redo, canUndo, canRedo }];
        }

        // ─── Templates ───
        const CASE_TEMPLATES = [
            { name: 'Стандартный кейс', desc: 'Заголовок → Текст → Изображение → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'image',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Минимальный', desc: 'Заголовок → Изображение → Текст',
              blocks: [{type:'heading',level:'h2',content:''},{type:'image',content:''},{type:'text',content:''}] },
            { name: 'Видео-кейс', desc: 'Заголовок → Видео → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'video',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Лендинг', desc: 'Hero-изображение → Заголовок → Текст → Отступ → Галерея → Текст',
              blocks: [{type:'image',content:''},{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'spacer',height:60},{type:'gallery',images:[]},{type:'text',content:''}] },
        ];
        const API = 'http://localhost:3001/api';


        const FONT_OPTIONS = [
            { id: 'Unbounded', label: 'Unbounded' },
            { id: 'Roboto', label: 'Roboto' },
            { id: 'Inter', label: 'Inter' },
            { id: 'Outfit', label: 'Outfit' },
        ];

        const ANIM_OPTIONS = [
            { id: 'none', label: 'Без анимации' },
            { id: 'fade-up', label: 'Появление снизу' },
            { id: 'fade-in', label: 'Плавное появление' },
            { id: 'split-lines', label: 'По строкам' },
            { id: 'split-words', label: 'По словам' },
            { id: 'scale-up', label: 'Увеличение' },
        ];

        const MASK_PRESETS = [
            { id: 'none', label: 'Без маски', clip: 'none' },
            { id: 'circle', label: 'Круг', clip: 'circle(45% at 50% 50%)' },
            { id: 'blob-1', label: 'Blob 1', clip: 'polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)' },
            { id: 'blob-2', label: 'Blob 2', clip: 'ellipse(45% 40% at 50% 50%)' },
            { id: 'arch', label: 'Арка', clip: 'polygon(0% 100%, 0% 30%, 10% 10%, 30% 2%, 50% 0%, 70% 2%, 90% 10%, 100% 30%, 100% 100%)' },
            { id: 'diamond', label: 'Ромб', clip: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' },
            { id: 'wave', label: 'Волна', clip: 'polygon(0% 15%, 15% 0%, 50% 10%, 85% 0%, 100% 15%, 100% 100%, 0% 100%)' },
        ];
        const BLOCK_TYPES = [
            { type: 'heading', label: 'Заголовок', icon: 'H' },
            { type: 'text', label: 'Текст', icon: '¶' },
            { type: 'image', label: 'Изображение', icon: '🖼' },
            { type: 'video', label: 'Видео', icon: '▶' },
            { type: 'gallery', label: 'Галерея', icon: '⊞' },
            { type: 'spacer', label: 'Отступ', icon: '↕' },
            { type: 'raw_html', label: 'HTML', icon: '</>' },
            { type: 'columns', label: 'Колонки', icon: '▥' },
            { type: 'compare', label: 'До/После', icon: '⇔' },
            { type: 'quote', label: 'Цитата', icon: '❝' },
            { type: 'metrics', label: 'Метрики', icon: '📊' },
        ];

        function apiFetch(url, opts = {}) {
            const token = sessionStorage.getItem('cms_token');
            return fetch(url, { ...opts, headers: { ...opts.headers, 'Content-Type': 'application/json', 'X-CMS-Token': token || '' } });
        }

        // ─── Login Screen ───
        function LoginScreen({ onLogin }) {
            const [login, setLogin] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    const res = await fetch(`${API}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login, password })
                    });
                    const json = await res.json();
                    if (json.success && json.token) {
                        sessionStorage.setItem('cms_token', json.token);
                        onLogin();
                    } else {
                        setError(json.error || 'Ошибка входа');
                    }
                } catch (err) {
                    setError('Сервер недоступен');
                }
                setLoading(false);
            };

            return (
                <div className="login-page">
                    <form className="login-box" onSubmit={submit}>
                        <div className="login-logo">a.lab</div>
                        <div className="login-sub">Внутренний редактор портфолио</div>
                        <div className="login-field">
                            <label>Логин</label>
                            <input className="input" value={login} onChange={e => setLogin(e.target.value)} autoFocus />
                        </div>
                        <div className="login-field">
                            <label>Пароль</label>
                            <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button className="login-btn" type="submit" disabled={loading}>{loading ? 'Вход...' : 'Войти'}</button>
                        {error && <div className="login-err">{error}</div>}
                    </form>
                </div>
            );
        }

        // ─── App ───
        function App() {
            const [authed, setAuthed] = useState(!!sessionStorage.getItem('cms_token'));
            const [data, setData] = useState({ categories: {}, projects: [] });
            const [loading, setLoading] = useState(true);
            const [editing, setEditing] = useState(null);
            const [toast, setToast] = useState(null);
            const [tab, setTab] = useState('projects');
            const [settings, setSettings] = useState(null);

            const showToast = (msg, ok = true) => { setToast({ msg, ok }); setTimeout(() => setToast(null), 2000); };

            const loadData = () => {
                apiFetch(`${API}/cases`).then(r => {
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    return r.json();
                }).then(d => { if (d) { setData(d); setLoading(false); } }).catch(() => setLoading(false));
            };

            const loadSettings = () => {
                apiFetch(`${API}/settings`).then(r => r.json()).then(s => setSettings(s)).catch(() => {});
            };

            const saveSettings = async (s) => {
                try {
                    await apiFetch(`${API}/settings`, { method: 'POST', body: JSON.stringify(s) });
                    setSettings(s);
                    showToast('Настройки сохранены');
                } catch { showToast('Ошибка', false); }
            };

            useEffect(() => { if (authed) { loadData(); loadSettings(); } }, [authed]);

            const save = async (newData) => {
                try {
                    const r = await apiFetch(`${API}/cases`, { method: 'POST', body: JSON.stringify(newData) });
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    setData(newData);
                    showToast('Сохранено');
                } catch { showToast('Ошибка', false); }
            };

            const [showTemplates, setShowTemplates] = useState(false);

            const addProject = (template) => {
                const id = 'case-' + Date.now();
                const blocks = template ? JSON.parse(JSON.stringify(template.blocks)) : [];
                const proj = { id, title: 'Новый проект', categoryId: Object.keys(data.categories)[0] || 'development', logo: '', isExternal: false, status: 'draft', blocks };
                const nd = { ...data, projects: [...data.projects, proj] };
                save(nd);
                setEditing(id);
                setShowTemplates(false);
            };

            const duplicateProject = (p) => {
                const id = p.id + '-copy-' + Date.now();
                const copy = { ...JSON.parse(JSON.stringify(p)), id, title: p.title + ' (копия)' };
                const nd = { ...data, projects: [...data.projects, copy] };
                save(nd);
                showToast('Проект скопирован');
            };

            const deleteProject = async (id) => {
                if (!confirm('Удалить проект?')) return;
                const nd = { ...data, projects: data.projects.filter(p => p.id !== id) };
                await save(nd);
                if (editing === id) setEditing(null);
            };

            const logout = () => { sessionStorage.removeItem('cms_token'); setAuthed(false); };

            if (!authed) return <LoginScreen onLogin={() => setAuthed(true)} />;
            if (loading) return <div className="cms-wrap"><p>Загрузка...</p></div>;

            if (editing) {
                const proj = data.projects.find(p => p.id === editing);
                if (!proj) { setEditing(null); return null; }
                return <Editor project={proj} categories={data.categories} onSave={u => { save({ ...data, projects: data.projects.map(p => p.id === editing ? u : p) }); }} onDelete={() => deleteProject(editing)} onClose={() => setEditing(null)} />;
            }

            return (
                <div className="cms-wrap">
                    <div className="cms-header">
                        <div className="cms-title">A.LAB CMS</div>
                        <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                            {tab === 'projects' && <button className="btn btn-white" onClick={()=>setShowTemplates(true)}>+ Новый кейс</button>}
                            <button className="btn-ghost" onClick={logout}>Выйти</button>
                        </div>
                    </div>
                    <div className="tabs">
                        <div className={`tab ${tab==='projects'?'active':''}`} onClick={()=>setTab('projects')}>Проекты</div>
                        <div className={`tab ${tab==='settings'?'active':''}`} onClick={()=>setTab('settings')}>Настройки сайта</div>
                    </div>
                    {tab === 'settings' && settings && <SettingsTab settings={settings} onSave={saveSettings} />}
                    {tab === 'projects' && <>
                        {!data.projects.length && <div className="empty-state"><h2>Нет проектов</h2><p>Нажмите «+ Новый кейс»</p></div>}
                        {Object.keys(data.categories).map(cid => {
                            const projs = data.projects.filter(p => p.categoryId === cid);
                            if (!projs.length) return null;
                            return (
                                <div key={cid} className="cat-section">
                                    <div className="cat-label">{data.categories[cid]}</div>
                                    <div className="proj-grid">
                                        {projs.map(p => (
                                            <div key={p.id} className="proj-card" onClick={() => setEditing(p.id)}>
                                                {p.logo ? <img src={p.logo} alt="" className="proj-card-logo"/> : <div className="proj-card-nologo">{p.title.charAt(0)}</div>}
                                                <div style={{flex:1,minWidth:0}}>
                                                    <div className="proj-card-id" style={{display:'flex',gap:'0.4rem',alignItems:'center'}}>{(p.blocks||[]).length} блоков <span className={`status-badge ${p.status==='draft'?'status-draft':'status-published'}`}>{p.status==='draft'?'Черновик':'Опубликован'}</span></div>
                                                    <div className="proj-card-title">{p.title}</div>
                                                </div>
                                                <button className="btn-ghost" title="Дублировать" onClick={e=>{e.stopPropagation();duplicateProject(p)}} style={{fontSize:'1rem'}}>⧉</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </>}
                    {showTemplates && <div className="modal-overlay" onClick={()=>setShowTemplates(false)}><div className="modal-box" onClick={e=>e.stopPropagation()}>
                        <div className="modal-title">Новый кейс</div>
                        <div className="template-card" onClick={()=>addProject(null)}><div className="template-name">Пустой проект</div><div className="template-desc">Начать с чистого листа</div></div>
                        {CASE_TEMPLATES.map((t,i)=><div key={i} className="template-card" onClick={()=>addProject(t)}><div className="template-name">{t.name}</div><div className="template-desc">{t.desc}</div></div>)}
                    </div></div>}
                    {toast && <div className={`toast ${toast.ok ? 'toast-ok' : 'toast-err'}`}>{toast.msg}</div>}
                </div>
            );
        }


        // ─── CardPreview ───
        function CardPreview({ cards }) {
            const r = cards.borderRadius ?? 12;
            const sz = cards.shadowSize ?? 10;
            const op = cards.shadowOpacity ?? 15;
            const sc = (cards.hoverScale ?? 103) / 100;
            const shadow = `0 ${Math.round(sz/2)}px ${sz}px rgba(0,0,0,${(op/100).toFixed(2)})`;
            const shadowHover = `0 ${sz}px ${sz*2}px rgba(0,0,0,${(Math.min(op*1.5,100)/100).toFixed(2)})`;
            const demos = [
                {title:'Проект 1', cat:'Брендинг', img:'https://images.unsplash.com/photo-1545239351-ef35f43d514b?w=400&h=300&fit=crop'},
                {title:'Проект 2', cat:'Интерьер', img:'https://images.unsplash.com/photo-1497366216548-37526070297c?w=400&h=300&fit=crop'},
                {title:'Проект 3', cat:'Архитектура', img:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&h=300&fit=crop'}
            ];
            const [hov, setHov] = useState(-1);
            return (
                <div style={{background:'#f5f5f7',borderRadius:12,padding:'2rem',display:'flex',gap:'1.2rem',justifyContent:'center',flexWrap:'wrap'}}>
                    {demos.map((d,i) => (
                        <div key={i}
                            onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(-1)}
                            style={{
                                width:180, cursor:'pointer',
                                transition:'transform 0.3s ease, box-shadow 0.3s ease',
                                borderRadius: r, overflow:'hidden',
                                boxShadow: hov===i ? shadowHover : shadow,
                                transform: hov===i ? `scale(${sc})` : 'scale(1)',
                                background:'#fff'
                            }}>
                            <img src={d.img} alt="" style={{width:'100%',height:120,objectFit:'cover',display:'block'}}/>
                            <div style={{padding:'0.6rem 0.75rem'}}>
                                <div style={{fontSize:'0.8rem',fontWeight:600,color:'#1d1d1f'}}>{d.title}</div>
                                <div style={{fontSize:'0.65rem',color:'#999',marginTop:'0.2rem'}}>{d.cat}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ─── Settings Tab ───
        function SettingsTab({ settings, onSave }) {
            const [s, setS] = useState(JSON.parse(JSON.stringify(settings)));
            const [uploading, setUploading] = useState(null);
            const audioRefs = useRef({});

            const LETTERS = [
                { id: 'a-dot', char: 'a.', desc: 'Вибрация / Deep Bass', fallback: 'vibration' },
                { id: 'l', char: 'l', desc: 'Глитч / Scramble', fallback: 'glitch' },
                { id: 'a', char: 'a', desc: 'Стекло / Bell', fallback: 'glass' },
                { id: 'b', char: 'b', desc: 'Прожектор / Pad', fallback: 'spotlight' }
            ];

            const ensure = () => {
                if (!s.audio) s.audio = {};
                if (!s.audio.letters) s.audio.letters = LETTERS.map((l,i) => ({ id: l.id, label: l.char, index: i, audioFile: null, fallback: l.fallback }));
                if (s.audio.masterVolume === undefined) s.audio.masterVolume = 0.35;
                return s;
            };

            const getLetter = (id) => {
                ensure();
                return s.audio.letters.find(l => l.id === id) || { audioFile: null };
            };

            const setLetterAudio = (id, audioFile) => {
                ensure();
                const letters = s.audio.letters.map(l => l.id === id ? { ...l, audioFile } : l);
                setS({ ...s, audio: { ...s.audio, letters } });
            };

            const handleUpload = async (e, letterId) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(letterId);
                const fd = new FormData();
                fd.append('audio', file);
                try {
                    const r = await fetch(`${API}/upload-audio`, { method: 'POST', body: fd, headers: { 'X-CMS-Token': sessionStorage.getItem('cms_token') || '' } });
                    const j = await r.json();
                    if (j.path) setLetterAudio(letterId, j.path);
                } catch(e) { console.error(e); }
                setUploading(null);
            };

            const playPreview = (audioFile) => {
                // Stop any playing
                Object.values(audioRefs.current).forEach(a => { a.pause(); a.currentTime = 0; });
                if (audioFile) {
                    const audio = new Audio(audioFile);
                    audio.volume = s.audio?.masterVolume || 0.35;
                    audioRefs.current[audioFile] = audio;
                    audio.play().catch(() => {});
                }
            };

            return (
                <div>
                    <div className="settings-section">
                        <div className="settings-title">🔊 Аудио для букв логотипа</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Назначьте аудиофайл для каждой буквы. Если файл не задан — используется процедурный синтез.</p>
                        <div style={{marginBottom:'1rem',display:'flex',alignItems:'center',gap:'1rem'}}>
                            <span style={{fontSize:'0.8rem',color:'#888'}}>Общая громкость:</span>
                            <input type="range" className="volume-slider" min="0" max="1" step="0.05" value={s.audio?.masterVolume||0.35} onChange={e => setS({...s, audio:{...s.audio, masterVolume: parseFloat(e.target.value)}})} style={{width:120}} />
                            <span style={{fontSize:'0.75rem',color:'#555'}}>{Math.round((s.audio?.masterVolume||0.35)*100)}%</span>
                        </div>
                        {LETTERS.map(letter => {
                            const data = getLetter(letter.id);
                            const hasFile = !!data.audioFile;
                            return (
                                <div key={letter.id} className="audio-letter">
                                    <div className="audio-letter-char">{letter.char}</div>
                                    <div className="audio-letter-info">
                                        <div className="audio-letter-label">{letter.desc}</div>
                                        {hasFile ? (
                                            <div className="audio-letter-file">{data.audioFile.split('/').pop()}</div>
                                        ) : (
                                            <div style={{fontSize:'0.78rem',color:'#555',fontStyle:'italic'}}>Процедурный синтез ({letter.fallback})</div>
                                        )}
                                    </div>
                                    <div className="audio-letter-actions">
                                        {hasFile && <button className="btn btn-dark btn-sm" onClick={() => playPreview(data.audioFile)}>▶</button>}
                                        {hasFile && <button className="btn btn-dark btn-sm" style={{color:'#e74c3c'}} onClick={() => setLetterAudio(letter.id, null)}>✕</button>}
                                        <label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}>
                                            <input type="file" accept="audio/*" style={{display:'none'}} onChange={e => handleUpload(e, letter.id)} />
                                            {uploading === letter.id ? '...' : (hasFile ? 'Заменить' : 'Загрузить')}
                                        </label>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="settings-section">
                        <div className="settings-title">🎨 Figma интеграция</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'0.7rem'}}>Вставляйте URL из Figma — изображения импортируются автоматически. Работает с приватными файлами.</p>
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <span style={{fontSize:'0.75rem',color:'#888',whiteSpace:'nowrap'}}>Personal Access Token:</span>
                            <input className="input" type="password" style={{flex:1}} value={s.figmaToken||''} onChange={e=>setS({...s, figmaToken: e.target.value})} placeholder="figd_..."/>
                        </div>
                        <p style={{fontSize:'0.7rem',color:'#555',marginTop:'0.4rem'}}>Создайте токен: Figma → Settings → Personal Access Tokens. Нужен доступ к файлам, из которых импортируете.</p>
                    </div>

                    <div className="settings-section">
                        <div className="settings-title">🃏 Внешний вид карточек</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Скругление углов и тени для карточек проектов на главной странице.</p>
                        <div style={{display:'flex',gap:'2rem',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Скругление (px)</label>
                                <input className="input" type="number" style={{width:100}} min="0" max="60" value={s.cards?.borderRadius ?? 12} onChange={e=>setS({...s, cards:{...s.cards, borderRadius: parseInt(e.target.value)||0}})}/>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Размер тени</label>
                                <input type="range" min="0" max="50" value={s.cards?.shadowSize ?? 10} onChange={e=>setS({...s, cards:{...s.cards, shadowSize: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowSize ?? 10}px</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Прозрачность тени</label>
                                <input type="range" min="0" max="100" value={s.cards?.shadowOpacity ?? 15} onChange={e=>setS({...s, cards:{...s.cards, shadowOpacity: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowOpacity ?? 15}%</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Масштаб при наведении</label>
                                <input type="range" min="100" max="110" step="1" value={s.cards?.hoverScale ?? 103} onChange={e=>setS({...s, cards:{...s.cards, hoverScale: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{(s.cards?.hoverScale ?? 103)/100}x</span>
                            </div>
                        </div>
                        <div style={{fontSize:'0.75rem',color:'#e67e22',fontWeight:600,marginBottom:'0.5rem'}}>Предпросмотр</div>
                        <CardPreview cards={s.cards || {}}/>
                    </div>

                    <button className="btn btn-white" onClick={() => onSave(s)}>Сохранить настройки</button>
                </div>
            );
        }

        // ─── Editor ───
        function Editor({ project, categories, onSave, onDelete, onClose }) {
            const [proj, setProj, history] = useHistory({ ...project });
            const [uploading, setUploading] = useState(false);
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [previewMode, setPreviewMode] = useState('desktop');
            const dragItem = useRef(null);
            const dragOver = useRef(null);
            const autoSaveTimer = useRef(null);

            const update = (k, v) => { setProj(p => ({ ...p, [k]: v })); setDirty(true); };
            const updateBlock = (i, k, v) => { const b = [...proj.blocks]; b[i] = { ...b[i], [k]: v }; update('blocks', b); };
            const addBlock = (type) => {
                const defs = { heading:{level:'h2',content:''}, text:{content:''}, image:{content:'',caption:''}, video:{content:''}, gallery:{images:[]}, spacer:{height:80}, raw_html:{content:''}, columns:{cols:[{text:'',image:''},{text:'',image:''}]}, compare:{before:'',after:''}, quote:{text:'',author:'',role:'',photo:''}, metrics:{items:[{value:'',label:''},{value:'',label:''},{value:'',label:''}]} };
                update('blocks', [...(proj.blocks||[]), { type, ...defs[type] }]);
            };
            const removeBlock = (i) => { const b = [...proj.blocks]; b.splice(i,1); update('blocks', b); };
            const moveBlock = (i, d) => { const b = [...proj.blocks]; const t = i+d; if(t<0||t>=b.length) return; [b[i],b[t]]=[b[t],b[i]]; update('blocks', b); };

            // Drag & Drop
            const onDragStart = (i) => { dragItem.current = i; };
            const onDragEnter = (i) => { dragOver.current = i; };
            const onDragEnd = () => {
                if (dragItem.current !== null && dragOver.current !== null && dragItem.current !== dragOver.current) {
                    const b = [...proj.blocks];
                    const item = b.splice(dragItem.current, 1)[0];
                    b.splice(dragOver.current, 0, item);
                    update('blocks', b);
                }
                dragItem.current = null; dragOver.current = null;
            };

            // Autosave (30 sec)
            useEffect(() => {
                if (dirty) {
                    clearTimeout(autoSaveTimer.current);
                    autoSaveTimer.current = setTimeout(() => {
                        setSaving(true);
                        onSave(proj);
                        setDirty(false);
                        setSaving(false);
                    }, 30000);
                }
                return () => clearTimeout(autoSaveTimer.current);
            }, [proj, dirty]);

            // Hotkeys
            useEffect(() => {
                const handler = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); onSave(proj); setDirty(false); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); history.undo(); }
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); history.redo(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [proj, history]);
            const handleUpload = async (e, cb) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(true);
                const fd = new FormData(); fd.append('media', file); fd.append('caseId', proj.id);
                try { const r = await fetch(`${API}/upload`, { method:'POST', body:fd, headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''} }); const j = await r.json(); if(j.path) cb(j.path); } catch(e) { console.error(e); }
                setUploading(false);
            };

            return (
                <div className="cms-wrap">
                    <div className="editor-top">
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <button className="btn btn-dark btn-sm" onClick={onClose}>← Назад</button>
                            <span style={{fontSize:'1.1rem',fontWeight:700}}>{proj.title||'—'}</span>
                            <span className={`status-badge ${proj.status==='draft'?'status-draft':'status-published'}`} style={{cursor:'pointer'}} onClick={()=>update('status',proj.status==='draft'?'published':'draft')}>{proj.status==='draft'?'Черновик':'Опубликован'}</span>
                            <div className="save-indicator"><span className={`save-dot ${saving?'saving':dirty?'unsaved':'saved'}`}/>{saving?'Сохраняю...':dirty?'Есть изменения':'Сохранено'}</div>
                        </div>
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <button className="btn btn-dark btn-sm" disabled={!history.canUndo} onClick={history.undo} title="Ctrl+Z">↶</button>
                            <button className="btn btn-dark btn-sm" disabled={!history.canRedo} onClick={history.redo} title="Ctrl+Y">↷</button>
                            <button className="btn btn-red btn-sm" onClick={onDelete}>Удалить</button>
                            <button className="btn btn-white btn-sm" onClick={() => {onSave(proj);setDirty(false)}}>Сохранить</button>
                        </div>
                    </div>
                    <div className="field-row">
                        <div><label className="field-label">Идентификатор</label><input className="input" value={proj.id} onChange={e=>update('id',e.target.value)}/></div>
                        <div><label className="field-label">Категория</label><select className="input" value={proj.categoryId} onChange={e=>update('categoryId',e.target.value)}>{Object.entries(categories).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
                    </div>
                    <div className="field-row">
                        <div><label className="field-label">Название</label><input className="input" value={proj.title} onChange={e=>update('title',e.target.value)}/></div>
                        <div><label className="field-label">Логотип</label><div style={{display:'flex',gap:'0.5rem'}}><input className="input" value={proj.logo||''} onChange={e=>update('logo',e.target.value)} placeholder="Путь к логотипу"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>update('logo',p))}/>Файл</label></div></div>
                    </div>
                    <div style={{marginBottom:'1rem'}}><label style={{display:'flex',alignItems:'center',gap:'0.5rem',fontSize:'0.85rem',color:'#999'}}><input type="checkbox" checked={proj.isExternal||false} onChange={e=>update('isExternal',e.target.checked)}/>Внешняя ссылка</label>
                    {proj.isExternal && <input className="input" style={{marginTop:'0.5rem'}} value={proj.externalUrl||''} onChange={e=>update('externalUrl',e.target.value)} placeholder="https://behance.net/..."/>}</div>
                    <div className="seo-section">
                        <div className="seo-label">🔍 SEO</div>
                        <div className="field-row">
                            <div><label className="field-label">Title (для поиска)</label><input className="input" value={proj.seoTitle||''} onChange={e=>update('seoTitle',e.target.value)} placeholder={proj.title}/></div>
                            <div><label className="field-label">OG Image</label><input className="input" value={proj.ogImage||''} onChange={e=>update('ogImage',e.target.value)} placeholder="URL обложки для шеринга"/></div>
                        </div>
                        <div><label className="field-label">Description (для поиска)</label><textarea className="input" style={{minHeight:50}} value={proj.seoDesc||''} onChange={e=>update('seoDesc',e.target.value)} placeholder="Краткое описание проекта для Google и соцсетей"/></div>
                    </div>

                    {!proj.isExternal && (
                        <div className="editor-split">
                        <div className="editor-panel">
                            <h3 style={{fontSize:'1rem',fontWeight:700,marginBottom:'0.5rem',marginTop:'0.5rem'}}>Блоки ({(proj.blocks||[]).length})</h3>
                            {(proj.blocks||[]).map((block,i)=>(
                                <div key={i} className="block-item" style={block.enabled===false?{opacity:0.4}:{}}
                                    draggable onDragStart={()=>onDragStart(i)} onDragEnter={()=>onDragEnter(i)} onDragEnd={onDragEnd} onDragOver={e=>e.preventDefault()}>
                                    <div className="block-head">
                                        <div style={{display:'flex',alignItems:'center',gap:'0.4rem'}}>
                                            <span className="drag-handle" title="Перетащить">⠿</span>
                                            <label style={{display:'flex',alignItems:'center',gap:'0.4rem',cursor:'pointer'}}><input type="checkbox" checked={block.enabled!==false} onChange={e=>updateBlock(i,'enabled',e.target.checked)} style={{accentColor:'#5dade2'}}/><span className="block-type">{BLOCK_TYPES.find(b=>b.type===block.type)?.icon} {BLOCK_TYPES.find(b=>b.type===block.type)?.label || block.type}</span></label>
                                        </div>
                                        <div className="block-actions"><button onClick={()=>moveBlock(i,-1)}>↑</button><button onClick={()=>moveBlock(i,1)}>↓</button><button style={{color:'#c0392b'}} onClick={()=>removeBlock(i)}>✕</button></div>
                                    </div>
                                    <BlockEditor block={block} index={i} projId={proj.id} updateBlock={updateBlock} handleUpload={handleUpload}/>
                                </div>
                            ))}
                            <div className="add-bar">{BLOCK_TYPES.map(bt=><button key={bt.type} className="btn btn-dark btn-sm" onClick={()=>addBlock(bt.type)}>{bt.icon} {bt.label}</button>)}
                                <label className="btn btn-blue btn-sm" style={{cursor:'pointer'}}><input type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>{
                                    const files = Array.from(e.target.files); if(!files.length) return;
                                    const gallery = {type:'gallery',images:[]};
                                    let loaded = 0;
                                    files.forEach(file=>{const fd=new FormData();fd.append('media',file);fd.append('caseId',proj.id);
                                    fetch(`${API}/upload`,{method:'POST',body:fd,headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''}}).then(r=>r.json()).then(j=>{
                                        if(j.path){gallery.images.push(j.path);loaded++;if(loaded===files.length)update('blocks',[...(proj.blocks||[]),gallery])}
                                    })})
                                }}/>📁 Массовая загрузка → Галерея</label>
                            </div>
                        </div>
                        <div className="live-preview">
                            <div className="live-preview-header">
                                <span>Предпросмотр</span>
                                <div style={{display:'flex',gap:'0.3rem',alignItems:'center'}}>
                                    <button className={`preview-mode-btn ${previewMode==='desktop'?'active':''}`} onClick={()=>setPreviewMode('desktop')}>🖥</button>
                                    <button className={`preview-mode-btn ${previewMode==='mobile'?'active':''}`} onClick={()=>setPreviewMode('mobile')}>📱</button>
                                    <span style={{color:'#555',fontSize:'0.7rem',marginLeft:'0.3rem'}}>{(proj.blocks||[]).filter(b=>b.enabled!==false).length} вкл.</span>
                                </div>
                            </div>
                            <LivePreview blocks={proj.blocks||[]} title={proj.title} mode={previewMode}/>
                        </div>
                        </div>
                    )}
                    {uploading && <div className="toast toast-ok">Загрузка...</div>}
                </div>
            );
        }


        // ─── RichToolbar — works with selected text via execCommand ───
        function RichToolbar({ editorRef, block, index, updateBlock }) {
            const exec = (cmd, val) => {
                if (editorRef.current) editorRef.current.focus();
                document.execCommand(cmd, false, val || null);
            };
            const s = block.style || {};
            const upS = (k, v) => updateBlock(index, 'style', { ...s, [k]: v });

            return (
                <div className="style-bar">
                    <div className="sb-group">
                        <button onMouseDown={e=>{e.preventDefault();exec('bold')}} title="Жирный"><b>Ж</b></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('italic')}} title="Курсив"><i>К</i></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('underline')}} title="Подчёркнутый"><u>П</u></button>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Цвет</span>
                        <input type="color" value="#1d1d1f" onChange={e=>{exec('foreColor',e.target.value)}}/>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Размер</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{
                            if(!e.target.value) return;
                            exec('fontSize', 7);
                            setTimeout(()=>{
                                const el = editorRef.current;
                                if(el) el.querySelectorAll('font[size="7"]').forEach(n=>{n.removeAttribute('size');n.style.fontSize=e.target.value;});
                            },0);
                        }}>
                            <option value="">—</option>
                            <option value="0.8rem">Мелкий</option>
                            <option value="1rem">Обычный</option>
                            <option value="1.3rem">Средний</option>
                            <option value="1.6rem">Крупный</option>
                            <option value="2rem">Большой</option>
                            <option value="3rem">Огромный</option>
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Шрифт</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{if(e.target.value)exec('fontName',e.target.value)}}>
                            <option value="">—</option>
                            {FONT_OPTIONS.map(fo=><option key={fo.id} value={fo.id}>{fo.label}</option>)}
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Анимация</span>
                        <select value={s.animation||'none'} onChange={e=>upS('animation',e.target.value)}>
                            {ANIM_OPTIONS.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        // ─── RichEditor — contentEditable with toolbar ───
        function RichEditor({ block, index, updateBlock, placeholder }) {
            const ref = useRef(null);
            const lastHtml = useRef(block.content || '');

            useEffect(() => {
                if (ref.current && ref.current.innerHTML !== (block.content||'')) {
                    ref.current.innerHTML = block.content || '';
                }
            }, []);

            const onInput = () => {
                if (ref.current) {
                    lastHtml.current = ref.current.innerHTML;
                    updateBlock(index, 'content', ref.current.innerHTML);
                }
            };

            return (
                <div>
                    <RichToolbar editorRef={ref} block={block} index={index} updateBlock={updateBlock}/>
                    <div ref={ref} contentEditable className="rich-editor" onInput={onInput}
                         data-placeholder={placeholder || 'Введите текст...'}
                         style={{minHeight: 80}}/>
                </div>
            );
        }

        // ─── LivePreview ───
        function LivePreview({ blocks, title, mode = 'desktop' }) {
            const isMobile = mode === 'mobile';
            const ref = useRef(null);
            const iframeRef = useRef(null);
            const [scale, setScale] = useState(0.3);
            const [iframeH, setIframeH] = useState(900);

            useEffect(() => {
                if (!ref.current) return;
                const w = ref.current.parentElement.clientWidth;
                setScale(w / 1440);
            }, []);

            // Auto-resize iframe to fit content
            useEffect(() => {
                const iframe = iframeRef.current;
                if (!iframe) return;
                const onLoad = () => {
                    try {
                        const h = iframe.contentDocument.body.scrollHeight;
                        if (h > 100) setIframeH(h);
                    } catch(e) {}
                };
                iframe.addEventListener('load', onLoad);
                return () => iframe.removeEventListener('load', onLoad);
            }, [blocks]);

            const html = (blocks||[]).filter(b => b.enabled !== false).map(b => {
                switch(b.type) {
                    case 'heading': return `<${b.level||'h2'} style="font-family:'Unbounded',sans-serif;font-weight:700;margin:1rem 5%">${b.content||''}</${b.level||'h2'}>`;
                    case 'text': return `<p style="font-family:'Roboto',sans-serif;margin:1rem 5%;line-height:1.6;font-size:1.1rem">${(b.content||'').replace(/\n/g,'<br>')}</p>`;
                    case 'image': return b.content ? `<div style="margin:1rem 5%"><img src="${b.content}" style="max-width:100%;border-radius:8px;${b.clipPath&&b.clipPath!=='none'?'clip-path:'+b.clipPath:''}" /></div>` : '';
                    case 'video': return b.content ? `<div style="margin:1rem 5%"><video src="${b.content}" autoplay muted loop playsinline style="width:100%;border-radius:8px"></video></div>` : '';
                    case 'gallery': return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0.5rem;margin:1rem 5%">${(b.images||[]).map(s=>`<img src="${s}" style="width:100%;border-radius:4px"/>`).join('')}</div>`;
                    case 'spacer': return `<div style="height:${b.height||80}px"></div>`;
                    case 'raw_html': return b.content || '';
                    case 'masked_image': return b.content ? `<div style="margin:1rem 5%;text-align:center"><img src="${b.content}" style="max-width:100%;${b.clipPath&&b.clipPath!=='none'?'clip-path:'+b.clipPath:''}" /></div>` : '';
                    case 'columns': {const cols=b.cols||[];return `<div style="display:grid;grid-template-columns:repeat(${cols.length},1fr);gap:1.5rem;margin:1.5rem 5%">${cols.map(col=>`<div>${col.image?`<img src="${col.image}" style="width:100%;border-radius:8px;margin-bottom:0.5rem"/>`:''}${col.text?`<p style="font-family:'Roboto',sans-serif;line-height:1.6;font-size:1rem">${col.text.replace(/\n/g,'<br>')}</p>`:''}</div>`).join('')}</div>`;}
                    case 'compare': return (b.before&&b.after)?`<div style="position:relative;margin:1.5rem 5%;overflow:hidden;border-radius:8px"><img src="${b.after}" style="width:100%;display:block"/><div style="position:absolute;inset:0;width:50%;overflow:hidden"><img src="${b.before}" style="width:200%;max-width:none;display:block"/></div><div style="position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff"></div><span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:0.7rem">ДО</span><span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:0.7rem">ПОСЛЕ</span></div>`:'';
                    case 'quote': return `<blockquote style="margin:2rem 5%;padding:1.5rem 2rem;border-left:4px solid #2980b9;background:#f0f4f8;border-radius:0 8px 8px 0"><p style="font-family:'Roboto',sans-serif;font-size:1.1rem;font-style:italic;line-height:1.6;margin-bottom:0.75rem">${b.text||''}</p><div style="display:flex;align-items:center;gap:0.75rem">${b.photo?`<img src="${b.photo}" style="width:40px;height:40px;border-radius:50%;object-fit:cover"/>`:''}<div><strong>${b.author||''}</strong>${b.role?`<br><span style="font-size:0.85rem;color:#666">${b.role}</span>`:''}</div></div></blockquote>`;
                    case 'metrics': return `<div style="display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;margin:2rem 5%;padding:2rem;background:#f8f9fa;border-radius:12px">${(b.items||[]).map(m=>`<div style="text-align:center;min-width:100px"><div style="font-family:'Unbounded',sans-serif;font-size:2rem;font-weight:700;color:#2980b9">${m.value||''}</div><div style="font-size:0.85rem;color:#666;margin-top:0.3rem">${m.label||''}</div></div>`).join('')}</div>`;
                    default: return '';
                }
            }).join('\n');

            const srcDoc = `<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f5f5f5;color:#1a1a1a;font-family:'Roboto',sans-serif;padding:2rem 0}img{max-width:100%;height:auto}</style></head><body>${html||`<div style="padding:8rem 5%;text-align:center;color:#999"><p>Добавьте блоки</p></div>`}</body></html>`;

            return (
                <div className="live-preview-frame" ref={ref} style={{height: iframeH * scale}}>
                    <iframe ref={iframeRef} srcDoc={srcDoc} style={{transform:`scale(${scale})`, width: isMobile ? 375 : 1440, height:iframeH}} />
                </div>
            );
        }

        // ─── BlockEditor ───
        function BlockEditor({ block, index, projId, updateBlock, handleUpload }) {
            if (block.type === 'heading') return (<><div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>{['h1','h2','h3','h4'].map(l=><button key={l} className={`btn btn-sm ${block.level===l?'btn-blue':'btn-dark'}`} onClick={()=>updateBlock(index,'level',l)}>{l.toUpperCase()}</button>)}</div><RichEditor block={block} index={index} updateBlock={updateBlock} placeholder="Введите заголовок"/></>);
            if (block.type === 'text') return <RichEditor block={block} index={index} updateBlock={updateBlock} placeholder="Введите текст..."/>;
            if (block.type === 'image') return (<><div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}><input className="input" style={{flex:1,minWidth:200}} value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка или Figma URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Загрузить</label></div>{block.content && <img src={block.content} alt="" style={{maxWidth:'100%',maxHeight:200,marginTop:'0.5rem',borderRadius:6,objectFit:'contain',background:'#000'}}/>}</>);
            if (block.type === 'video') return (<div style={{display:'flex',gap:'0.5rem'}}><input className="input" value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка на видео"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} accept="video/*" onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Загрузить</label></div>);
            if (block.type === 'gallery') { const imgs=block.images||[]; return (<><div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem',marginBottom:'0.5rem'}}>{imgs.map((img,gi)=><div key={gi} style={{position:'relative',width:80,height:80}}><img src={img} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:4}}/><button onClick={()=>{const n=[...imgs];n.splice(gi,1);updateBlock(index,'images',n);}} style={{position:'absolute',top:-4,right:-4,background:'#c0392b',color:'#fff',border:'none',borderRadius:'50%',width:18,height:18,fontSize:'0.6rem',cursor:'pointer',lineHeight:'18px'}}>✕</button></div>)}</div><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} multiple onChange={e=>{Array.from(e.target.files).forEach(file=>{const fd=new FormData();fd.append('media',file);fd.append('caseId',projId);fetch(`${API}/upload`,{method:'POST',body:fd,headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''}}).then(r=>r.json()).then(j=>{if(j.path)updateBlock(index,'images',[...(block.images||[]),j.path]);});});}}/>+ Изображения</label></>); }
            if (block.type === 'spacer') return (<div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}><span style={{fontSize:'0.8rem',color:'#666'}}>Высота:</span><input className="input" type="number" style={{width:100}} value={block.height||80} onChange={e=>updateBlock(index,'height',parseInt(e.target.value)||40)}/><span style={{fontSize:'0.75rem',color:'#555'}}>px</span></div>);
            if (block.type === 'raw_html') return <textarea className="input" style={{fontFamily:'monospace',fontSize:'0.78rem',minHeight:120}} value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="HTML-код..."/>;
            if (block.type === 'masked_image') {
                const cp = block.clipPath || 'none';
                const activeClass = (preset) => preset.clip === cp ? 'btn-blue' : 'btn-dark';
                return (
                    <div>
                        <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>
                            <input className="input" value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка на изображение"/>
                            <label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}>
                                <input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Файл
                            </label>
                        </div>
                        <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap',marginBottom:'0.5rem'}}>
                            {MASK_PRESETS.map(m => (
                                <button key={m.id} className={'btn btn-sm ' + activeClass(m)} onClick={()=>updateBlock(index,'clipPath',m.clip)}>{m.label}</button>
                            ))}
                        </div>
                        {block.content ? <div style={{background:'#1a1a1a',borderRadius:8,padding:'1rem',textAlign:'center'}}><img src={block.content} alt="" style={{maxWidth:'100%',maxHeight:300,objectFit:'contain',clipPath:cp,transition:'clip-path 0.3s'}}/></div> : null}
                    </div>
                );
            }
            if (block.type === 'columns') {
                const cols = block.cols || [{text:'',image:''},{text:'',image:''}];
                const colCount = cols.length;
                return (<div>
                    <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>{[2,3].map(n=><button key={n} className={`btn btn-sm ${colCount===n?'btn-blue':'btn-dark'}`} onClick={()=>{const nc=[...cols];while(nc.length<n)nc.push({text:'',image:''});updateBlock(index,'cols',nc.slice(0,n))}}>{n} колонки</button>)}</div>
                    <div style={{display:'grid',gridTemplateColumns:`repeat(${colCount},1fr)`,gap:'0.5rem'}}>{cols.map((col,ci)=><div key={ci} style={{background:'#1a1a1a',borderRadius:6,padding:'0.5rem'}}>
                        <div style={{display:'flex',gap:'0.3rem',marginBottom:'0.3rem'}}><input className="input" style={{flex:1}} value={col.image||''} onChange={e=>{const nc=[...cols];nc[ci]={...nc[ci],image:e.target.value};updateBlock(index,'cols',nc)}} placeholder="URL изображения"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>{const nc=[...cols];nc[ci]={...nc[ci],image:p};updateBlock(index,'cols',nc)})}/>📷</label></div>
                        {col.image && <img src={col.image} alt="" style={{width:'100%',height:60,objectFit:'cover',borderRadius:4,marginBottom:'0.3rem'}}/>}
                        <textarea className="input" style={{minHeight:50,fontSize:'0.8rem'}} value={col.text||''} onChange={e=>{const nc=[...cols];nc[ci]={...nc[ci],text:e.target.value};updateBlock(index,'cols',nc)}} placeholder="Текст колонки"/>
                    </div>)}</div>
                </div>);
            }
            if (block.type === 'compare') return (<div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
                    <div><label className="field-label">До</label><div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.before||''} onChange={e=>updateBlock(index,'before',e.target.value)} placeholder="URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'before',p))}/>📷</label></div>{block.before&&<img src={block.before} alt="" style={{width:'100%',height:80,objectFit:'cover',borderRadius:4,marginTop:'0.3rem'}}/>}</div>
                    <div><label className="field-label">После</label><div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.after||''} onChange={e=>updateBlock(index,'after',e.target.value)} placeholder="URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'after',p))}/>📷</label></div>{block.after&&<img src={block.after} alt="" style={{width:'100%',height:80,objectFit:'cover',borderRadius:4,marginTop:'0.3rem'}}/>}</div>
                </div>
            </div>);
            if (block.type === 'quote') return (<div style={{display:'flex',flexDirection:'column',gap:'0.5rem'}}>
                <textarea className="input" value={block.text||''} onChange={e=>updateBlock(index,'text',e.target.value)} placeholder="Текст цитаты..." style={{minHeight:60,fontStyle:'italic'}}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
                    <input className="input" value={block.author||''} onChange={e=>updateBlock(index,'author',e.target.value)} placeholder="Имя автора"/>
                    <input className="input" value={block.role||''} onChange={e=>updateBlock(index,'role',e.target.value)} placeholder="Должность"/>
                    <div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.photo||''} onChange={e=>updateBlock(index,'photo',e.target.value)} placeholder="Фото URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'photo',p))}/>📷</label></div>
                </div>
            </div>);
            if (block.type === 'metrics') {
                const items = block.items || [{value:'',label:''},{value:'',label:''},{value:'',label:''}];
                return (<div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem'}}>{items.map((m,mi)=><div key={mi} style={{background:'#1a1a1a',borderRadius:6,padding:'0.5rem',minWidth:120,flex:1}}>
                        <input className="input" style={{fontWeight:700,fontSize:'1.1rem',textAlign:'center',marginBottom:'0.3rem'}} value={m.value||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],value:e.target.value};updateBlock(index,'items',ni)}} placeholder="240%"/>
                        <input className="input" style={{fontSize:'0.8rem',textAlign:'center'}} value={m.label||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],label:e.target.value};updateBlock(index,'items',ni)}} placeholder="конверсия"/>
                    </div>)}</div>
                    <div style={{marginTop:'0.5rem',display:'flex',gap:'0.3rem'}}><button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',[...items,{value:'',label:''}])}>+ Метрика</button>{items.length>1&&<button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',items.slice(0,-1))}>− Убрать</button>}</div>
                </div>);
            }
            return <p style={{color:'#666'}}>Неизвестный тип: {block.type}</p>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
