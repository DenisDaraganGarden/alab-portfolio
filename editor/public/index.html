	                    )}
	                    {uploading && <div className="toast toast-ok">Загрузка...</div>}
	                    {toast && <div className={`toast ${toast.ok ? 'toast-ok' : 'toast-err'}`}>{toast.msg}</div>}
	                </div>
	            );

        // ─── RichToolbar — works with selected text via execCommand ───
        function RichToolbar({ editorRef, block, index, updateBlock }) {
            const syncContent = () => {
                window.setTimeout(() => {
                    if (editorRef.current) updateBlock(index, 'content', editorRef.current.innerHTML);
                }, 0);
            };
            const exec = (cmd, val) => {
                if (editorRef.current) editorRef.current.focus();
                document.execCommand(cmd, false, val || null);
                syncContent();
            };
            const makeLink = () => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                const selection = window.getSelection();
                const savedRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
                const selectedText = selection ? selection.toString().trim() : '';
                const raw = window.prompt('Ссылка: Behance, Telegram, сайт, PDF...', selectedText && selectedText.includes('.') ? selectedText : '');
                const href = normalizeLinkUrl(raw);
                if (!href) return;
                if (savedRange && selection) {
                    selection.removeAllRanges();
                    selection.addRange(savedRange);
                }
                if (selectedText) {
                    document.execCommand('createLink', false, href);
                    window.setTimeout(() => {
                        if (!editorRef.current) return;
                        editorRef.current.querySelectorAll('a').forEach(a => {
                            a.setAttribute('target', '_blank');
                            a.setAttribute('rel', 'noopener noreferrer');
                        });
                        syncContent();
                    }, 0);
                } else {
                    document.execCommand('insertHTML', false, `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(displayLinkUrl(href))}</a>`);
                    syncContent();
                }
            };
            const removeLink = () => {
                exec('unlink');
            };
            const s = block.style || {};
            const upS = (k, v) => updateBlock(index, 'style', { ...s, [k]: v });

            return (
                <div className="style-bar">
                    <div className="sb-group">
                        <button onMouseDown={e=>{e.preventDefault();exec('bold')}} title="Жирный"><b>Ж</b></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('italic')}} title="Курсив"><i>К</i></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('underline')}} title="Подчёркнутый"><u>П</u></button>
                        <button onMouseDown={e=>{e.preventDefault();makeLink()}} title="Сделать ссылкой">↗</button>
                        <button onMouseDown={e=>{e.preventDefault();removeLink()}} title="Убрать ссылку">×</button>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Цвет</span>
                        <input type="color" value="#1d1d1f" onChange={e=>{exec('foreColor',e.target.value)}}/>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Размер</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{
                            if(!e.target.value) return;
                            exec('fontSize', 7);
                            setTimeout(()=>{
                                const el = editorRef.current;
                                if(el) el.querySelectorAll('font[size="7"]').forEach(n=>{n.removeAttribute('size');n.style.fontSize=e.target.value;});
                                syncContent();
                            },0);
                        }}>
                            <option value="">—</option>
                            <option value="0.8rem">Мелкий</option>
                            <option value="1rem">Обычный</option>
                            <option value="1.3rem">Средний</option>
                            <option value="1.6rem">Крупный</option>
                            <option value="2rem">Большой</option>
                            <option value="3rem">Огромный</option>
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Шрифт</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{if(e.target.value)exec('fontName',e.target.value)}}>
                            <option value="">—</option>
                            {FONT_OPTIONS.map(fo=><option key={fo.id} value={fo.id}>{fo.label}</option>)}
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Анимация</span>
                        <select value={s.animation||'none'} onChange={e=>upS('animation',e.target.value)}>
                            {ANIM_OPTIONS.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        // ─── RichEditor — contentEditable with toolbar ───
        function RichEditor({ block, index, updateBlock, placeholder }) {
            const ref = useRef(null);
            const lastHtml = useRef(block.content || '');

            useEffect(() => {
                if (ref.current && ref.current.innerHTML !== (block.content||'')) {
                    ref.current.innerHTML = block.content || '';
                }
            }, []);

            const onInput = () => {
                if (ref.current) {
                    lastHtml.current = ref.current.innerHTML;
                    updateBlock(index, 'content', ref.current.innerHTML);
                }
            };

            return (
                <div>
                    <RichToolbar editorRef={ref} block={block} index={index} updateBlock={updateBlock}/>
                    <div ref={ref} contentEditable className="rich-editor" onInput={onInput}
                         data-placeholder={placeholder || 'Введите текст...'}
                         style={{minHeight: 80}}/>
                </div>
            );
        }

        // ─── LivePreview ───
        function LivePreview({ blocks, title, mode = 'desktop', seed = 0, fullscreen = false, accent = '' }) {
            const isMobile = mode === 'mobile';
            const ref = useRef(null);
            const iframeRef = useRef(null);
            const [scale, setScale] = useState(0.3);
            // Модуль рендера подключается как ES-модуль и появляется чуть позже
            // первого рендера React — ждём его события готовности
            const [rendererReady, setRendererReady] = useState(typeof window.ALAB_renderCaseBlocks === 'function');
            useEffect(() => {
                if (rendererReady) return;
                const onReady = () => setRendererReady(true);
                window.addEventListener('alab:renderer-ready', onReady);
                return () => window.removeEventListener('alab:renderer-ready', onReady);
            }, [rendererReady]);
            const viewportW = isMobile ? 390 : 1440;

            useEffect(() => {
                const updateScale = () => {
                    if (!ref.current) return;
                    const parent = ref.current.parentElement;
                    const w = parent?.clientWidth || ref.current.clientWidth || viewportW;
                    const next = Math.min(w / viewportW, fullscreen ? 1 : 0.48);
                    setScale(next);
                };
                updateScale();
                window.addEventListener('resize', updateScale);
                return () => window.removeEventListener('resize', updateScale);
            }, [viewportW, fullscreen]);

            const viewportH = fullscreen
                ? Math.max(560, Math.round(((window.innerHeight || 900) - 112) / Math.max(scale, 0.1)))
                : (isMobile ? 812 : 900);
            const animationKey = (blocks||[])
                .map((block, index) => `${index}:${block?.type || ''}:${block?.style?.animation || 'none'}`)
                .join('|');

            // Разметка собирается тем же модулем, что и на сайте
            const html = rendererReady ? window.ALAB_renderCaseBlocks(blocks || []) : '';


            // Документ предпросмотра: боевые стили блоков (файл самодостаточен,
            // объявляет собственные --case-* переменные). Оживляет всё один
            // боевой hydratePreviewDocument: reveal, видео, карусели, металл.
            const HYDRATE_SCRIPT = `<script type="module">import{hydratePreviewDocument}from'/site-js/sections/case-blocks.js';hydratePreviewDocument(document);<\/script>`;

            const placeholder = rendererReady
                ? '<div style="padding:8rem 5%;text-align:center;color:#999;font-family:sans-serif"><p>Добавьте блоки</p></div>'
                : '<div style="padding:8rem 5%;text-align:center;color:#999;font-family:sans-serif"><p>Загружается модуль рендера…</p></div>';

            const accentVar = /^#[0-9a-fA-F]{3,8}$/.test(accent || '') ? `--case-accent-color:${accent};` : '';
            const srcDoc = `<!DOCTYPE html><html><head><base href="${window.location.origin}/"/><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"><link href="/site-css/sections/case-blocks.css" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{${accentVar}background:var(--case-bg,#f5f5f7);color:var(--case-text,#1d1d1f);font-family:'Roboto',sans-serif;padding:clamp(1.5rem,5vw,5rem) 0}</style></head><body>${html || placeholder}${HYDRATE_SCRIPT}</body></html>`;

            return (
                <div className="live-preview-frame" ref={ref} style={{height: viewportH * scale}}>
                    <iframe
                        key={`${mode}-${fullscreen ? 'full' : 'panel'}-${seed}-${animationKey}`}
                        ref={iframeRef}
                        srcDoc={srcDoc}
                        style={{transform:`scale(${scale})`, width: viewportW, height: viewportH, transformOrigin:'top left'}}
                    />
                </div>
            );
        }

        // ─── BlockEditor ───

            if (block.type === 'gallery') { const imgs=block.images||[]; return (<><div style={{display:'flex',gap:'0.35rem',marginBottom:'0.6rem',flexWrap:'wrap',alignItems:'center'}}>

                {block.layout==='slider' && <button className={`btn btn-sm ${block.background==='dark'?'btn-blue':'btn-dark'}`} onClick={()=>updateBlock(index,'background','dark')} title="Полноширинная чёрная полоса под лентой — как мудборд на чёрном">● Тёмная лента</button>}
            </div><div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem',marginBottom:'0.5rem'}}>{imgs.map((img,gi)=><div key={gi} style={{position:'relative',width:80,height:80}}><img src={img} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:4}}/><button onClick={()=>{const n=[...imgs];n.splice(gi,1);updateBlock(index,'images',n);}} style={{position:'absolute',top:-4,right:-4,background:'#c0392b',color:'#fff',border:'none',borderRadius:'50%',width:18,height:18,fontSize:'0.6rem',cursor:'pointer',lineHeight:'18px'}}>✕</button></div>)}</div><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} multiple onChange={e=>{const files=Array.from(e.target.files);if(!files.length)return;e.target.value='';const failed=[];Promise.all(files.map(file=>{const fd=new FormData();fd.append('caseId',projId);fd.append('media',file);return fetch(`${API}/upload`,{method:'POST',body:fd,headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''}}).then(r=>r.json().catch(()=>({})).then(j=>(r.ok&&j.path)?j.path:Promise.reject(new Error(j.error||'upload')))).catch(()=>{failed.push(file.name);return null;});})).then(paths=>{const ok=paths.filter(Boolean);if(ok.length)updateBlock(index,'images',[...(block.images||[]),...ok]);if(failed.length&&showToast)showToast(`Не загрузились: ${failed.join(', ')}`,false,5000);});}}/>+ Изображения</label></>); }
            if (block.type === 'links') {
                const items = block.items || [];

                return (<div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem'}}>{items.map((m,mi)=><div key={mi} style={{background:'var(--cms-surface-soft)',borderRadius:6,padding:'0.5rem',minWidth:120,flex:1}}>
                        <input className="input" style={{fontWeight:700,fontSize:'1.1rem',textAlign:'center',marginBottom:'0.3rem'}} value={m.value||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],value:e.target.value};updateBlock(index,'items',ni)}} placeholder="240%"/>
                        <input className="input" style={{fontSize:'0.8rem',textAlign:'center'}} value={m.label||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],label:e.target.value};updateBlock(index,'items',ni)}} placeholder="конверсия"/>
                    </div>)}</div>
                    <div style={{marginTop:'0.5rem',display:'flex',gap:'0.3rem'}}><button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',[...items,{value:'',label:''}])}>+ Метрика</button>{items.length>1&&<button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',items.slice(0,-1))}>− Убрать</button>}</div>
                </div>);
            }
            if (block.type === 'process') {
                const steps = block.steps || [];
                const upStep = (si, k, v) => { const ns = [...steps]; ns[si] = { ...ns[si], [k]: v }; updateBlock(index, 'steps', ns); };
                return (<div style={{display:'flex',flexDirection:'column',gap:'0.6rem'}}>
                    <div className="link-editor-note">Шаги показываются в ряд со стрелками (на мобиле — в столбик). Разметка текста: <b>### подзаголовок</b>, <b>**жирный**</b>, <b>==акцент цветом кейса==</b>, пустая строка — новый абзац.</div>
                    <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(Math.max(steps.length,1),4)},minmax(0,1fr))`,gap:'0.6rem'}}>
                        {steps.map((s,si)=>(
                            <div key={si} className="column-editor-card">
                                <div style={{display:'flex',gap:'0.35rem',alignItems:'center'}}>
                                    <input className="input" value={s.title||''} onChange={e=>upStep(si,'title',e.target.value)} placeholder={`Шаг ${si+1}`}/>
                                    <button className="btn btn-dark btn-sm" title="Убрать шаг" onClick={()=>updateBlock(index,'steps',steps.filter((_,i)=>i!==si))}>✕</button>
                                </div>
                                <textarea className="input" style={{minHeight:150,fontFamily:'monospace',fontSize:'0.76rem'}} value={s.text||''} onChange={e=>upStep(si,'text',e.target.value)} placeholder={'### подзаголовок\nтекст серым\n**важное тёмным**\n==акцент цветом=='}/>
                            </div>
                        ))}
                    </div>
                    {steps.length<6 && <button className="btn btn-dark btn-sm" style={{alignSelf:'flex-start'}} onClick={()=>updateBlock(index,'steps',[...steps,{title:'',text:''}])}>+ Добавить шаг</button>}
                </div>);
            }
            return <p style={{color:'#666'}}>Неизвестный тип: {block.type}</p>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
