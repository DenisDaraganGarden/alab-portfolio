        @media(max-width:460px){
            .proj-card{grid-template-columns:14px 52px minmax(0,1fr);padding:0.8rem}
            .proj-card-actions{grid-column:3;justify-self:start;margin-top:0.25rem}
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Undo/Redo Hook ───
        function useHistory(initial) {
            const [states, setStates] = useState([JSON.parse(JSON.stringify(initial))]);
            const [idx, setIdx] = useState(0);
            const current = states[idx];
            const set = useCallback((val) => {
                const v = typeof val === 'function' ? val(states[idx]) : val;
                setStates(prev => [...prev.slice(0, idx + 1), JSON.parse(JSON.stringify(v))].slice(-30));
                setIdx(i => Math.min(i + 1, 29));
            }, [idx, states]);
            const undo = useCallback(() => setIdx(i => Math.max(0, i - 1)), []);
            const redo = useCallback(() => setIdx(i => Math.min(states.length - 1, i + 1)), [states.length]);
            const canUndo = idx > 0;
            const canRedo = idx < states.length - 1;
            return [current, set, { undo, redo, canUndo, canRedo }];
        }

        // ─── Templates ───
        const CASE_TEMPLATES = [
            { name: 'Стандартный кейс', desc: 'Заголовок → Текст → Изображение → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'image',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Минимальный', desc: 'Заголовок → Изображение → Текст',
              blocks: [{type:'heading',level:'h2',content:''},{type:'image',content:''},{type:'text',content:''}] },
            { name: 'Видео-кейс', desc: 'Заголовок → Видео → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'video',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Лендинг', desc: 'Hero-изображение → Заголовок → Текст → Отступ → Галерея → Текст',
              blocks: [{type:'image',content:''},{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'spacer',height:60},{type:'gallery',images:[]},{type:'text',content:''}] },
        ];
        const CMS_BASE_PATH = (() => {
            const path = window.location.pathname.replace(/\/+$/, '');
            const match = path.match(/^\/cms-\d+/);
            return match ? match[0] : '';
        })();
        const API = `${CMS_BASE_PATH}/api`;

        const LINK_PLATFORMS = [
            { id: 'website', label: 'Сайт', mark: '↗' },
            { id: 'behance', label: 'Behance', mark: 'Be' },
            { id: 'telegram', label: 'Telegram', mark: 'Tg' },
            { id: 'whatsapp', label: 'WhatsApp', mark: 'Wa' },
            { id: 'instagram', label: 'Instagram', mark: 'Ig' },
            { id: 'youtube', label: 'YouTube', mark: 'Yt' },
            { id: 'pdf', label: 'PDF', mark: 'PDF' },
            { id: 'drive', label: 'Drive', mark: 'Dr' },
            { id: 'other', label: 'Другое', mark: '•' },
        ];

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function normalizeLinkUrl(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            if (/^(javascript|data|vbscript):/i.test(raw)) return '';
            if (/^(https?:|mailto:|tel:)/i.test(raw)) return raw;
            if (/^@[\w\d_]{3,}$/i.test(raw)) return `https://t.me/${raw.slice(1)}`;
            if (/^(www\.|[\w-]+(\.[\w-]+)+)([/?#].*)?$/i.test(raw)) return `https://${raw}`;
            if (/^(\/(?!\/)|#)/.test(raw)) return raw;
            return '';
        }

        function displayLinkUrl(value) {
            const normalized = normalizeLinkUrl(value);
            return normalized
                .replace(/^https?:\/\//i, '')
                .replace(/^www\./i, '')
                .replace(/\/$/, '');
        }

        function getLinkPlatform(id) {
            return LINK_PLATFORMS.find(p => p.id === id) || LINK_PLATFORMS[LINK_PLATFORMS.length - 1];
        }

        // Собственные рендереры предпросмотра удалены: разметку теперь даёт
        // боевой модуль js/sections/case-blocks.js, подключённый в <head>.
        // Их дубликат показывал не то, что окажется на сайте.


        const FONT_OPTIONS = [
            { id: 'Unbounded', label: 'Unbounded' },
            { id: 'Roboto', label: 'Roboto' },
            { id: 'Inter', label: 'Inter' },
            { id: 'Outfit', label: 'Outfit' },
        ];

        const ANIM_OPTIONS = [
            { id: 'none', label: 'Без анимации' },
            { id: 'fade-up', label: 'Появление снизу' },
            { id: 'fade-in', label: 'Плавное появление' },
            { id: 'split-lines', label: 'По строкам' },
            { id: 'split-words', label: 'По словам' },
            { id: 'scale-up', label: 'Увеличение' },
        ];

        const MASK_PRESETS = [
            { id: 'none', label: 'Без маски', clip: 'none' },
            { id: 'circle', label: 'Круг', clip: 'circle(45% at 50% 50%)' },
            { id: 'blob-1', label: 'Blob 1', clip: 'polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)' },
            { id: 'blob-2', label: 'Blob 2', clip: 'ellipse(45% 40% at 50% 50%)' },
            { id: 'arch', label: 'Арка', clip: 'polygon(0% 100%, 0% 30%, 10% 10%, 30% 2%, 50% 0%, 70% 2%, 90% 10%, 100% 30%, 100% 100%)' },
            { id: 'diamond', label: 'Ромб', clip: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' },
            { id: 'wave', label: 'Волна', clip: 'polygon(0% 15%, 15% 0%, 50% 10%, 85% 0%, 100% 15%, 100% 100%, 0% 100%)' },
        ];
        // Функциональные группы блоков: цвет — общий язык карточек, легенды и палитры
        const BLOCK_GROUPS = {
            content: { label: 'Текст' },
            media:   { label: 'Медиа' },
            layout:  { label: 'Структура' },
            data:    { label: 'Данные' },
        };
        const BLOCK_TYPES = [
            { type: 'heading', label: 'Заголовок', icon: 'H', group: 'content' },
            { type: 'text', label: 'Текст', icon: '¶', group: 'content' },
            { type: 'quote', label: 'Цитата', icon: '❝', group: 'content' },
            { type: 'process', label: 'Процесс', icon: '➤', group: 'content' },
            { type: 'image', label: 'Изображение', icon: '🖼', group: 'media' },
            { type: 'video', label: 'Видео', icon: '▶', group: 'media' },
            { type: 'gallery', label: 'Галерея', icon: '⊞', group: 'media' },
            { type: 'compare', label: 'До/После', icon: '⇔', group: 'media' },
            { type: 'columns', label: 'Колонки', icon: '▥', group: 'layout' },
            { type: 'spacer', label: 'Отступ', icon: '↕', group: 'layout' },
            { type: 'raw_html', label: 'HTML', icon: '</>', group: 'layout' },
            { type: 'metrics', label: 'Метрики', icon: '📊', group: 'data' },
            { type: 'links', label: 'Ссылки', icon: '↗', group: 'data' },
        ];
        // masked_image остался в старых кейсах, в палитре его нет
        const blockGroupOf = (type) => (BLOCK_TYPES.find(b => b.type === type) || {}).group || (type === 'masked_image' ? 'media' : 'layout');

        // ── Сводка содержимого для свёрнутой карточки блока ──
        // DOMParser: его документ неактивен, разметка из контента не загружает
        // ресурсы и не запускает обработчики (в отличие от innerHTML на div)
        const stripHtmlText = (html) => ((new DOMParser().parseFromString(String(html || ''), 'text/html').body.textContent) || '').replace(/\s+/g, ' ').trim();
        // Пользователь набирает путь по буквам: незавершённый %-код не должен ронять рендер
        const mediaFileName = (p) => { const s = String(p || '').split(/[?#]/)[0]; const seg = s.split('/').filter(Boolean).pop() || ''; try { return decodeURIComponent(seg); } catch { return seg; } };
        const pluralRu = (n, one, few, many) => { const m = Math.abs(n) % 100, d = m % 10; if (m > 10 && m < 20) return many; if (d === 1) return one; if (d >= 2 && d <= 4) return few; return many; };
        function blockSummary(block) {
            switch (block.type) {
                case 'heading': { const t = stripHtmlText(block.content); return `${(block.level || 'h2').toUpperCase()}${t ? ' · ' + t : ' · пусто'}`; }
                case 'text': return stripHtmlText(block.content) || 'пусто';
                case 'quote': { const a = block.author || ''; const t = (block.text || '').trim(); const kind = block.look === 'metal' ? ' · жидкий металл' : ''; return (a && t ? `${a} — ${t}` : (a || t || 'пусто')) + kind; }
                case 'image': return mediaFileName(block.content) || 'изображение не задано';
                case 'video': return mediaFileName(block.content) || String(block.content || '').trim() || 'видео не задано';
                case 'gallery': { const n = (block.images || []).length; const kind = block.layout === 'slider' ? (block.background === 'dark' ? ' · карусель на чёрном' : ' · карусель') : ''; return n ? `${n} ${pluralRu(n, 'изображение', 'изображения', 'изображений')}${kind}` : 'пустая галерея'; }
                case 'compare': return block.before && block.after ? 'до и после заданы' : (block.before || block.after) ? 'задана одна сторона' : 'изображения не заданы';
                case 'columns': { const n = (block.cols || []).length || 2; return `${n} ${pluralRu(n, 'колонка', 'колонки', 'колонок')}`; }
                case 'spacer': return `${block.height || 80} px`;
                case 'raw_html': { const t = String(block.content || '').replace(/\s+/g, ' ').trim(); return t || 'пустой код'; }
                case 'metrics': { const n = (block.items || []).length; return n ? `${n} ${pluralRu(n, 'показатель', 'показателя', 'показателей')}` : 'нет показателей'; }
                case 'links': { const n = (block.items || []).length; return `${block.title || 'Ссылки'} · ${n}`; }
                case 'masked_image': return mediaFileName(block.content) || 'изображение не задано';
                case 'process': { const s = (block.steps || []); const t = s.map(x => (x.title || '').trim()).filter(Boolean).join(' → '); return t || (s.length ? `${s.length} ${pluralRu(s.length, 'шаг', 'шага', 'шагов')}` : 'нет шагов'); }
                default: return '';
            }
        }
        function blockThumb(block) {
            switch (block.type) {
                case 'image': case 'masked_image': return block.content || '';
                case 'gallery': return (block.images || [])[0] || '';
                case 'compare': return block.before || block.after || '';
                case 'columns': return ((block.cols || []).find(c => c.image) || {}).image || '';
                case 'quote': return block.photo || '';
                default: return '';
            }
        }

        // Стабильные клиентские id блоков: держат состояние свёрнутости при
        // перестановках и служат React-ключами. Перед сохранением вычищаются.
        let __blockUid = 0;
        const nextBlockUid = () => `b${++__blockUid}`;
        // Кейс без поля blocks (внешняя ссылка) остаётся без него и после обработки
        const withBlockUids = (p) => p.blocks ? { ...p, blocks: p.blocks.map(b => b._uid ? b : { ...b, _uid: nextBlockUid() }) } : p;
        const stripBlockUids = (p) => p.blocks ? { ...p, blocks: p.blocks.map(({ _uid, ...b }) => b) } : p;

        function apiFetch(url, opts = {}) {
            const token = sessionStorage.getItem('cms_token');
            return fetch(url, { ...opts, headers: { ...opts.headers, 'Content-Type': 'application/json', 'X-CMS-Token': token || '' } });
        }

        // ─── Login Screen ───
        function LoginScreen({ onLogin }) {
            const [login, setLogin] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    const res = await fetch(`${API}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login, password })
                    });
                    const json = await res.json();
                    if (json.success && json.token) {
                        sessionStorage.setItem('cms_token', json.token);
                        onLogin();
                    } else {
                        setError(json.error || 'Ошибка входа');
                    }
                } catch (err) {
                    setError('Сервер недоступен');
                }
                setLoading(false);
            };

            return (
                <div className="login-page">
                    <form className="login-box" onSubmit={submit}>
                        <div className="login-logo">a.lab</div>
                        <div className="login-sub">Внутренний редактор портфолио</div>
                        <div className="login-field">
                            <label>Логин</label>
                            <input className="input" value={login} onChange={e => setLogin(e.target.value)} autoFocus />
                        </div>
                        <div className="login-field">
                            <label>Пароль</label>
                            <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button className="login-btn" type="submit" disabled={loading}>{loading ? 'Вход...' : 'Войти'}</button>
                        {error && <div className="login-err">{error}</div>}
                    </form>
                </div>
            );
        }

        // ─── App ───
        function App() {
            const [authed, setAuthed] = useState(!!sessionStorage.getItem('cms_token'));
            // null — режим входа ещё выясняется; true — сервер пускает без пароля (CMS_SKIP_AUTH=1)
            const [skipAuth, setSkipAuth] = useState(null);
            const [data, setData] = useState({ categories: {}, projects: [] });
            const [loading, setLoading] = useState(true);
            const [editing, setEditing] = useState(null);
            const [toast, setToast] = useState(null);
            const [tab, setTab] = useState('projects');
            const [settings, setSettings] = useState(null);
            const [analytics, setAnalytics] = useState(null);
            const [analyticsDays, setAnalyticsDays] = useState(30);
            const [search, setSearch] = useState('');
            const [catEdit, setCatEdit] = useState(false);
            const [publishing, setPublishing] = useState(false);
            const projDrag = useRef(null);
            const projDragOver = useRef(null);

            const showToast = (msg, ok = true, duration = 2000) => { setToast({ msg, ok }); setTimeout(() => setToast(null), duration); };

            const loadData = () => {
                apiFetch(`${API}/cases`).then(r => {
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    return r.json();
                }).then(d => { if (d) { setData(d); setLoading(false); } }).catch(() => setLoading(false));
            };

            const loadSettings = () => {
                apiFetch(`${API}/settings`).then(r => r.json()).then(s => setSettings(s)).catch(() => {});
            };

            const loadAnalytics = (days = analyticsDays) => {
                apiFetch(`${API}/analytics/summary?days=${days}`).then(r => {
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return null; }
                    return r.json();
                }).then(s => { if (s) setAnalytics(s); }).catch(() => {});
            };

            const saveSettings = async (s) => {
                try {
                    await apiFetch(`${API}/settings`, { method: 'POST', body: JSON.stringify(s) });
                    setSettings(s);
                    showToast('Настройки сохранены');
                } catch { showToast('Ошибка', false); }
            };

            const publishSite = async () => {
                if (!confirm('Опубликовать изменения на alabspace.com?')) return;
                setPublishing(true);
                try {
                    const r = await apiFetch(`${API}/publish`, { method: 'POST', body: JSON.stringify({}) });
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    const j = await r.json().catch(() => ({}));
                    if (!r.ok) showToast(j.error || j.message || `Ошибка публикации (${r.status})`, false, 6000);
                    else if (j.published === false) {
                        // «Нет изменений» — нормальный итог, не ошибка; красным только
                        // если на сервере остались неотправленные коммиты
                        const stranded = (j.unpushedCommits || 0) > 0;
                        showToast(j.message || j.error || 'Публикация не выполнена', !stranded, 6000);
                    }
                    else if (j.pushed === false) showToast(j.warning || j.message || 'Опубликовано локально, но push на GitHub не прошёл', false, 6000);
                    else {
                        const sha = String(j.commit || j.sha || '').slice(0, 7);
                        showToast(`Опубликовано${sha ? ` (коммит ${sha})` : ''}. Сайт обновится через 1–2 минуты.`, true, 6000);
                    }
                } catch { showToast('Сервер недоступен', false, 6000); }
                finally { setPublishing(false); }
            };

            useEffect(() => {
                fetch(`${API}/auth-mode`)
                    .then(r => r.json())
                    .then(m => { setSkipAuth(!!m.skipAuth); if (m.skipAuth) setAuthed(true); })
                    .catch(() => setSkipAuth(false));
            }, []);
            useEffect(() => { if (authed) { loadData(); loadSettings(); loadAnalytics(); } }, [authed]);
            useEffect(() => { if (authed && tab === 'analytics') loadAnalytics(analyticsDays); }, [authed, tab, analyticsDays]);

            const save = async (newData) => {
                try {
                    const r = await apiFetch(`${API}/cases`, { method: 'POST', body: JSON.stringify(newData) });
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    const result = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(result.error || 'Save error');
                    setData(newData);
                    showToast(result.publicProjects !== undefined ? `Сохранено · в публикации ${result.publicProjects}` : 'Сохранено');
                } catch { showToast('Ошибка', false); }
            };

            const [showTemplates, setShowTemplates] = useState(false);

            // Category CRUD
            const addCategory = () => { const id='cat-'+Date.now(); const nd={...data,categories:{...data.categories,[id]:'Новая категория'}}; save(nd); };
            const renameCategory = (id,name) => { const nd={...data,categories:{...data.categories,[id]:name}}; save(nd); };
            const deleteCategory = (id) => { if(!confirm('Удалить категорию и все её проекты?')) return; const cats={...data.categories}; delete cats[id]; const nd={...data,categories:cats,projects:data.projects.filter(p=>p.categoryId!==id)}; save(nd); };

            // Export/Import
            const exportProject = (p) => { const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=p.id+'.json'; a.click(); URL.revokeObjectURL(url); showToast('Экспортировано'); };
            const importProject = (e) => { const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=(ev)=>{try{const p=JSON.parse(ev.target.result); p.id=p.id+'-'+Date.now(); save({...data,projects:[...data.projects,p]}); showToast('Импортировано: '+p.title);}catch{showToast('Ошибка JSON',false);}}; r.readAsText(file); };

            // Project drag sort
            const onProjDragStart = (i) => { projDrag.current = i; };
            const onProjDragEnter = (i) => { projDragOver.current = i; };
            const onProjDragEnd = () => { if(projDrag.current!==null && projDragOver.current!==null && projDrag.current!==projDragOver.current){ const p=[...data.projects]; const item=p.splice(projDrag.current,1)[0]; p.splice(projDragOver.current,0,item); save({...data,projects:p}); } projDrag.current=null; projDragOver.current=null; };

            const addProject = (template) => {
                const id = 'case-' + Date.now();
                const blocks = template ? JSON.parse(JSON.stringify(template.blocks)) : [];
                const proj = { id, title: 'Новый проект', categoryId: Object.keys(data.categories)[0] || 'development', logo: '', isExternal: false, status: 'draft', blocks };
                const nd = { ...data, projects: [...data.projects, proj] };
                save(nd);
                setEditing(id);
                setShowTemplates(false);
            };

            const duplicateProject = (p) => {
                const id = p.id + '-copy-' + Date.now();
                const copy = { ...JSON.parse(JSON.stringify(p)), id, title: p.title + ' (копия)' };
                const nd = { ...data, projects: [...data.projects, copy] };
                save(nd);
                showToast('Проект скопирован');
            };

            const deleteProject = async (id) => {
                if (!confirm('Удалить проект?')) return;
                const nd = { ...data, projects: data.projects.filter(p => p.id !== id) };
                await save(nd);
                if (editing === id) setEditing(null);
            };

            const logout = () => { sessionStorage.removeItem('cms_token'); setAuthed(false); };

            // Пока не выяснили режим входа — ничего не рисуем, чтобы экран
            // логина не мигал перед автоматическим входом без пароля.
            if (!authed) {
                if (skipAuth === null) return null;
                return <LoginScreen onLogin={() => setAuthed(true)} />;
            }
            if (loading) return <div className="cms-wrap"><p>Загрузка...</p></div>;

            if (editing) {
                const proj = data.projects.find(p => p.id === editing);
                if (!proj) { setEditing(null); return null; }
                return <Editor project={proj} categories={data.categories} onSave={u => { save({ ...data, projects: data.projects.map(p => p.id === editing ? u : p) }); }} onDelete={() => deleteProject(editing)} onClose={() => setEditing(null)} />;
            }

            const projects = data.projects || [];
            const publishedProjects = projects.filter(p => p.status !== 'draft');
            const draftProjects = projects.filter(p => p.status === 'draft');
            const demoProjects = projects.filter(p => p.categoryId === 'demo' || /demo/i.test(p.id || ''));
            const publicCategoryIds = new Set(publishedProjects.map(p => p.categoryId).filter(Boolean));
            const publishWarnings = publishedProjects.flatMap(p => {
                const warnings = [];
                if (p.isExternal && !p.externalUrl) warnings.push(`${p.title}: нет внешней ссылки`);
                if (!p.isExternal && !(p.blocks || []).some(b => b.enabled !== false)) warnings.push(`${p.title}: нет включённых блоков`);
                return warnings;
            });

            return (
                <div className="cms-wrap">
                    <div className="cms-header">
                        <div className="cms-title">A.LAB CMS</div>
                        <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                            {tab === 'projects' && <><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" accept=".json" style={{display:'none'}} onChange={importProject}/>Импорт</label><button className="btn btn-white" onClick={()=>setShowTemplates(true)}>+ Новый кейс</button></>}
                            {tab === 'analytics' && <button className="btn btn-white btn-sm" onClick={()=>loadAnalytics(analyticsDays)}>Обновить</button>}
                            {!skipAuth && <button className="btn-ghost" onClick={logout}>Выйти</button>}
                        </div>
                    </div>
                    <div className="tabs">
                        <div className={`tab ${tab==='projects'?'active':''}`} onClick={()=>setTab('projects')}>Проекты</div>
                        <div className={`tab ${tab==='analytics'?'active':''}`} onClick={()=>setTab('analytics')}>Статистика</div>
                        <div className={`tab ${tab==='settings'?'active':''}`} onClick={()=>setTab('settings')}>Настройки сайта</div>
                    </div>
                    {tab === 'settings' && settings && <SettingsTab settings={settings} onSave={saveSettings} />}
                    {tab === 'analytics' && <AnalyticsTab analytics={analytics} days={analyticsDays} onDaysChange={setAnalyticsDays} onRefresh={()=>loadAnalytics(analyticsDays)} />}
                    {tab === 'projects' && <>
                        <div className="publish-panel">
                            <div className="publish-panel-head">
                                <div className="publish-copy">
                                    <div className="publish-title">Публикация</div>
                                    <div className="publish-note">На сайт попадают только опубликованные проекты.</div>
                                </div>
                                <div className="publish-stats">
                                    <div className="publish-stat"><span className="publish-stat-value">{publishedProjects.length}</span><span className="publish-stat-label">на сайте</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{draftProjects.length}</span><span className="publish-stat-label">черновик</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{publicCategoryIds.size}</span><span className="publish-stat-label">категории</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{demoProjects.length}</span><span className="publish-stat-label">demo</span></div>
                                </div>
                            </div>
                            <div style={{display:'flex',gap:'0.5rem',alignItems:'center',flexWrap:'wrap'}}>
                                <button className="btn btn-white btn-sm" style={{whiteSpace:'nowrap'}} disabled={publishing} onClick={publishSite}>{publishing ? 'Публикуем…' : 'Опубликовать'}</button>
                                <a href="https://alabspace.com/#portfolio" target="_blank" className="btn btn-dark btn-sm" style={{textDecoration:'none',whiteSpace:'nowrap'}}>Сайт</a>
                            </div>
                            {publishWarnings.length ? <div className="publish-warnings">{publishWarnings.slice(0,5).map((w,i)=><div className="publish-warning" key={i}>⚠ {w}</div>)}</div> : null}
                        </div>
                        <div style={{display:'flex',gap:'0.75rem',marginBottom:'1.5rem',alignItems:'center'}}>
                            <input className="input" style={{maxWidth:300}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Поиск по проектам..."/>
                            <button className={`btn btn-sm ${catEdit?'btn-blue':'btn-dark'}`} onClick={()=>setCatEdit(!catEdit)}>{catEdit?'Готово':'Категории'}</button>
                        </div>
                        {catEdit && <div className="settings-section" style={{marginBottom:'1.5rem'}}>
                            <div className="settings-title">Управление категориями</div>
                            {Object.entries(data.categories).map(([id,name])=><div key={id} style={{display:'flex',gap:'0.5rem',alignItems:'center',marginBottom:'0.5rem'}}>
                                <input className="input" style={{flex:1}} value={name} onChange={e=>renameCategory(id,e.target.value)}/>
                                <span style={{fontSize:'0.7rem',color:'#555'}}>{data.projects.filter(p=>p.categoryId===id).length} проектов</span>
                                <button className="btn btn-red btn-sm" onClick={()=>deleteCategory(id)}>✕</button>
                            </div>)}
                            <button className="btn btn-dark btn-sm" onClick={addCategory}>+ Добавить категорию</button>
                        </div>}
                        {!data.projects.length && <div className="empty-state"><h2>Нет проектов</h2><p>Нажмите «+ Новый кейс»</p></div>}
                        {Object.keys(data.categories).map(cid => {
                            const projs = data.projects.filter(p => p.categoryId === cid).filter(p => !search || p.title.toLowerCase().includes(search.toLowerCase()) || p.id.toLowerCase().includes(search.toLowerCase()));
                            if (!projs.length) return null;
                            return (
                                <div key={cid} className="cat-section" data-category={cid}>
                                    <div className="cat-label">{data.categories[cid]}</div>
                                    <div className="proj-grid">
                                        {projs.map(p => (
                                            <div key={p.id} className="proj-card" data-category={p.categoryId} onClick={() => setEditing(p.id)}
                                                draggable onDragStart={()=>onProjDragStart(data.projects.indexOf(p))} onDragEnter={()=>onProjDragEnter(data.projects.indexOf(p))} onDragEnd={onProjDragEnd} onDragOver={e=>e.preventDefault()}>
                                                <span className="drag-handle" title="Сортировать" style={{fontSize:'0.8rem'}}>⠿</span>
                                                {p.logo ? <img src={p.logo} alt="" className="proj-card-logo"/> : <div className="proj-card-nologo">{p.title.charAt(0)}</div>}
                                                <div className="proj-card-main">
                                                    <div className="proj-card-meta">
                                                        <span>{(p.blocks||[]).length} блоков</span>
                                                        <span className={`status-badge ${p.status==='draft'?'status-draft':'status-published'}`}>{p.status==='draft'?'Черновик':'На сайте'}</span>
                                                        {p.featured ? <span className="status-badge status-featured-on">★ Главная</span> : null}
                                                        {(p.categoryId === 'demo' || /demo/i.test(p.id || '')) && <span className="status-badge status-demo">Demo</span>}
                                                    </div>
                                                    <div className="proj-card-title">{p.title}</div>
                                                </div>
                                                <div className="proj-card-actions">
                                                    <button className="btn-ghost" title="Экспорт JSON" onClick={e=>{e.stopPropagation();exportProject(p)}}>JSON</button>
                                                    <button className="btn-ghost" title="Дублировать" onClick={e=>{e.stopPropagation();duplicateProject(p)}}>⧉</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </>}
                    {showTemplates && <div className="modal-overlay" onClick={()=>setShowTemplates(false)}><div className="modal-box" onClick={e=>e.stopPropagation()}>
                        <div className="modal-title">Новый кейс</div>
                        <div className="template-card" onClick={()=>addProject(null)}><div className="template-name">Пустой проект</div><div className="template-desc">Начать с чистого листа</div></div>
                        {CASE_TEMPLATES.map((t,i)=><div key={i} className="template-card" onClick={()=>addProject(t)}><div className="template-name">{t.name}</div><div className="template-desc">{t.desc}</div></div>)}
                    </div></div>}
                    {toast && <div className={`toast ${toast.ok ? 'toast-ok' : 'toast-err'}`}>{toast.msg}</div>}
                </div>
            );
        }


        // ─── CardPreview ───
        function CardPreview({ cards }) {
            const r = cards.borderRadius ?? 12;
            const sz = cards.shadowSize ?? 10;
            const op = cards.shadowOpacity ?? 15;
            const sc = (cards.hoverScale ?? 103) / 100;
            const shadow = `0 ${Math.round(sz/2)}px ${sz}px rgba(0,0,0,${(op/100).toFixed(2)})`;
            const shadowHover = `0 ${sz}px ${sz*2}px rgba(0,0,0,${(Math.min(op*1.5,100)/100).toFixed(2)})`;
            const demos = [
                {title:'Проект 1', cat:'Брендинг', img:'https://images.unsplash.com/photo-1545239351-ef35f43d514b?w=400&h=300&fit=crop'},
                {title:'Проект 2', cat:'Интерьер', img:'https://images.unsplash.com/photo-1497366216548-37526070297c?w=400&h=300&fit=crop'},
                {title:'Проект 3', cat:'Архитектура', img:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&h=300&fit=crop'}
            ];
            const [hov, setHov] = useState(-1);
            return (
                <div style={{background:'#f5f5f7',borderRadius:12,padding:'2rem',display:'flex',gap:'1.2rem',justifyContent:'center',flexWrap:'wrap'}}>
                    {demos.map((d,i) => (
                        <div key={i}
                            onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(-1)}
                            style={{
                                width:180, cursor:'pointer',
                                transition:'transform 0.3s ease, box-shadow 0.3s ease',
                                borderRadius: r, overflow:'hidden',
                                boxShadow: hov===i ? shadowHover : shadow,
                                transform: hov===i ? `scale(${sc})` : 'scale(1)',
                                background:'#fff'
                            }}>
                            <img src={d.img} alt="" style={{width:'100%',height:120,objectFit:'cover',display:'block'}}/>
                            <div style={{padding:'0.6rem 0.75rem'}}>
                                <div style={{fontSize:'0.8rem',fontWeight:600,color:'#1d1d1f'}}>{d.title}</div>
                                <div style={{fontSize:'0.65rem',color:'#999',marginTop:'0.2rem'}}>{d.cat}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ─── Analytics Tab ───
        function formatNumber(value) {
            return new Intl.NumberFormat('ru-RU').format(value || 0);
        }

        function metricLabel(seconds) {
            if (!seconds) return '0 сек';
            if (seconds < 60) return `${seconds} сек`;
            const minutes = Math.floor(seconds / 60);
            const rest = seconds % 60;
            return rest ? `${minutes} мин ${rest} сек` : `${minutes} мин`;
        }

        function MetricCard({ value, label }) {
            return (
                <div className="analytics-card">
                    <div className="analytics-card-value">{value}</div>
                    <div className="analytics-card-label">{label}</div>
                </div>
            );
        }

        function BarsChart({ data }) {
            const rows = data || [];
            const max = Math.max(1, ...rows.map(item => item.pageviews || 0));
            if (!rows.length) return <div className="analytics-empty">Данных пока нет</div>;
            return (
                <>
                    <div className="chart-bars">
                        {rows.map(item => (
                            <div key={item.date} className="chart-bar" style={{height:`${Math.max(4, Math.round((item.pageviews / max) * 100))}%`}} title={`${item.date}: ${item.pageviews}`}>
                                <span>{item.pageviews}</span>
                            </div>
                        ))}
                    </div>
                    <div className="chart-caption">
                        <span>{rows[0]?.date}</span>
                        <span>просмотры страниц</span>
                        <span>{rows[rows.length - 1]?.date}</span>
                    </div>
                </>
            );
        }

        function AnalyticsList({ title, items, empty = 'Нет данных' }) {
            return (
                <div className="analytics-panel">
                    <div className="analytics-panel-title">{title}</div>
                    <div className="analytics-list">
                        {(items || []).length ? items.map(item => (
                            <div className="analytics-row" key={item.label}>
                                <div className="analytics-row-label" title={item.label}>{item.label}</div>
                                <div className="analytics-row-value">{formatNumber(item.value)}</div>
                            </div>
                        )) : <div className="analytics-empty">{empty}</div>}
                    </div>
                </div>
            );
        }

        function SeoAudit({ seo }) {
            if (!seo) return null;
            return (
                <div className="analytics-panel">
                    <div className="seo-score">
                        <div className="seo-score-circle" style={{'--score': seo.score || 0}}>{seo.score || 0}%</div>
                        <div>
                            <div className="analytics-panel-title" style={{marginBottom:0}}>SEO базовая готовность</div>
                            <div className="analytics-note" style={{marginTop:'0.2rem'}}>Технический чек-лист главной страницы. Это не заменяет Search Console, но ловит базовые проблемы.</div>
                        </div>
                    </div>
                    {(seo.checks || []).map(check => (
                        <div className="seo-check" key={check.label}>
                            <div className={`seo-dot ${check.ok ? 'ok' : ''}`}></div>
                            <div>
                                <div className="seo-check-label">{check.label}</div>
                                <div className="seo-check-detail">{check.detail}</div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function AnalyticsTab({ analytics, days, onDaysChange, onRefresh }) {
            const totals = analytics?.totals || {};
            return (
                <div>
                    <div className="analytics-hero">
                        <div>
                            <div className="analytics-title">Статистика сайта</div>
                            <div className="analytics-note">
                                First-party аналитика: pageviews, визиты, источники, страны, устройства, секции и SEO. IP не хранится в открытом виде, только hash. VPN определяется как unknown без внешней IP-базы.
                            </div>
                        </div>
                        <div className="analytics-range">
                            {[7, 30, 90].map(value => (
                                <button key={value} className={`btn btn-sm ${days === value ? 'btn-blue' : 'btn-dark'}`} onClick={() => onDaysChange(value)}>{value} дней</button>
                            ))}
                            <button className="btn btn-white btn-sm" onClick={onRefresh}>Обновить</button>
                        </div>
                    </div>

                    {!analytics ? <div className="analytics-empty">Загрузка статистики...</div> : <>
                        <div className="analytics-grid">
                            <MetricCard value={formatNumber(totals.pageviews)} label="просмотры" />
                            <MetricCard value={formatNumber(totals.sessions)} label="визиты" />
                            <MetricCard value={formatNumber(totals.visitors)} label="посетители" />
                            <MetricCard value={`${totals.bounceRate || 0}%`} label="отказы" />
                            <MetricCard value={metricLabel(totals.avgEngagementSeconds)} label="среднее время" />
                            <MetricCard value={formatNumber(totals.sectionViews)} label="секции" />
                            <MetricCard value={formatNumber(totals.outboundClicks)} label="внешние клики" />
                            <MetricCard value={(analytics.vpn || [])[0]?.label || 'unknown'} label="VPN статус" />
                        </div>

                        <div className="analytics-layout">
                            <div className="analytics-panel">
                                <div className="analytics-panel-title">Динамика посещений</div>
                                <BarsChart data={analytics.timeSeries} />
                            </div>
                            <SeoAudit seo={analytics.seo} />
                        </div>

                        <div className="analytics-mini-grid">
                            <AnalyticsList title="Популярные страницы" items={analytics.topPages} />
                            <AnalyticsList title="Источники" items={analytics.referrers} />
                            <AnalyticsList title="Страны" items={analytics.countries} empty="Страны появятся на хостинге с geo-заголовками" />
                            <AnalyticsList title="Устройства" items={analytics.devices} />
                            <AnalyticsList title="Браузеры" items={analytics.browsers} />
                            <AnalyticsList title="Просмотры секций" items={analytics.sections} />
                        </div>
                    </>}
                </div>
            );
        }

        // ─── Settings Tab ───
        function SettingsTab({ settings, onSave }) {
            const [s, setS] = useState(JSON.parse(JSON.stringify(settings)));
            const [uploading, setUploading] = useState(null);
            const audioRefs = useRef({});

            const LETTERS = [
                { id: 'a-dot', char: 'a.', desc: 'Вибрация / Deep Bass', fallback: 'vibration' },
                { id: 'l', char: 'l', desc: 'Глитч / Scramble', fallback: 'glitch' },
                { id: 'a', char: 'a', desc: 'Стекло / Bell', fallback: 'glass' },
                { id: 'b', char: 'b', desc: 'Прожектор / Pad', fallback: 'spotlight' }
            ];

            const ensure = () => {
                if (!s.audio) s.audio = {};
                if (!s.audio.letters) s.audio.letters = LETTERS.map((l,i) => ({ id: l.id, label: l.char, index: i, audioFile: null, fallback: l.fallback }));
                if (s.audio.enabled === undefined) s.audio.enabled = false;
                if (s.audio.masterVolume === undefined) s.audio.masterVolume = 0.35;
                return s;
            };

            const getLetter = (id) => {
                ensure();
                return s.audio.letters.find(l => l.id === id) || { audioFile: null };
            };

            const setLetterAudio = (id, audioFile) => {
                ensure();
                const letters = s.audio.letters.map(l => l.id === id ? { ...l, audioFile } : l);
                setS({ ...s, audio: { ...s.audio, letters } });
            };

            const setAudioEnabled = (enabled) => {
                ensure();
                setS({ ...s, audio: { ...s.audio, enabled } });
            };

            const handleUpload = async (e, letterId) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(letterId);
                const fd = new FormData();
                fd.append('audio', file);
                try {
                    const r = await fetch(`${API}/upload-audio`, { method: 'POST', body: fd, headers: { 'X-CMS-Token': sessionStorage.getItem('cms_token') || '' } });
                    const j = await r.json();
                    if (j.path) setLetterAudio(letterId, j.path);
                } catch(e) { console.error(e); }
                setUploading(null);
            };

            const stopPreviews = () => {
                Object.values(audioRefs.current).forEach(a => { a.pause(); a.currentTime = 0; });
                audioRefs.current = {};
            };

            useEffect(() => {
                const stopOnHidden = () => { if (document.hidden) stopPreviews(); };
                document.addEventListener('visibilitychange', stopOnHidden);
                window.addEventListener('pagehide', stopPreviews);
                window.addEventListener('blur', stopPreviews);

                return () => {
                    document.removeEventListener('visibilitychange', stopOnHidden);
                    window.removeEventListener('pagehide', stopPreviews);
                    window.removeEventListener('blur', stopPreviews);
                    stopPreviews();
                };
            }, []);

            const playPreview = (audioFile) => {
                stopPreviews();
                if (audioFile) {
                    const audio = new Audio(audioFile);
                    audio.volume = s.audio?.masterVolume || 0.35;
                    audioRefs.current[audioFile] = audio;
                    audio.play().catch(() => {});
                }
            };

            return (
                <div>
                    <div className="settings-section">
                        <div className="settings-title">🔊 Аудио для букв логотипа</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Управляет звуками на публичном сайте. Можно выключить сейчас, а файлы подобрать и назначить позже.</p>
                        <label style={{display:'flex',alignItems:'center',gap:'0.65rem',fontSize:'0.9rem',fontWeight:700,marginBottom:'1rem',cursor:'pointer'}}>
                            <input type="checkbox" checked={s.audio?.enabled !== false} onChange={e => setAudioEnabled(e.target.checked)} style={{accentColor:'#1d1d1f',width:18,height:18}} />
                            Звук на сайте включён
                        </label>
                        <div style={{marginBottom:'1rem',display:'flex',alignItems:'center',gap:'1rem'}}>
                            <span style={{fontSize:'0.8rem',color:'#888'}}>Общая громкость:</span>
                            <input type="range" className="volume-slider" min="0" max="1" step="0.05" value={s.audio?.masterVolume||0.35} onChange={e => setS({...s, audio:{...s.audio, masterVolume: parseFloat(e.target.value)}})} style={{width:120}} />
                            <span style={{fontSize:'0.75rem',color:'#555'}}>{Math.round((s.audio?.masterVolume||0.35)*100)}%</span>
                        </div>
                        {LETTERS.map(letter => {
                            const data = getLetter(letter.id);
                            const hasFile = !!data.audioFile;
                            return (
                                <div key={letter.id} className="audio-letter">
                                    <div className="audio-letter-char">{letter.char}</div>
                                    <div className="audio-letter-info">
                                        <div className="audio-letter-label">{letter.desc}</div>
                                        {hasFile ? (
                                            <div className="audio-letter-file">{data.audioFile.split('/').pop()}</div>
                                        ) : (
                                            <div style={{fontSize:'0.78rem',color:'#555',fontStyle:'italic'}}>Процедурный синтез ({letter.fallback})</div>
                                        )}
                                    </div>
                                    <div className="audio-letter-actions">
                                        {hasFile && <button className="btn btn-dark btn-sm" onClick={() => playPreview(data.audioFile)}>▶</button>}
                                        {hasFile && <button className="btn btn-dark btn-sm" style={{color:'#e74c3c'}} onClick={() => setLetterAudio(letter.id, null)}>✕</button>}
                                        <label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}>
                                            <input type="file" accept="audio/*" style={{display:'none'}} onChange={e => handleUpload(e, letter.id)} />
                                            {uploading === letter.id ? '...' : (hasFile ? 'Заменить' : 'Загрузить')}
                                        </label>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="settings-section">
                        <div className="settings-title">🎨 Figma интеграция</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'0.7rem'}}>Вставляйте URL из Figma — изображения импортируются автоматически. Работает с приватными файлами.</p>
                        <p style={{fontSize:'0.75rem',color:'var(--cms-muted)'}}>Токен Figma задаётся в файле .env (FIGMA_TOKEN)</p>
                    </div>

                    <div className="settings-section">
                        <div className="settings-title">🃏 Внешний вид карточек</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Скругление углов и тени для карточек проектов на главной странице.</p>
                        <div style={{display:'flex',gap:'2rem',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Скругление (px)</label>
                                <input className="input" type="number" style={{width:100}} min="0" max="60" value={s.cards?.borderRadius ?? 12} onChange={e=>setS({...s, cards:{...s.cards, borderRadius: parseInt(e.target.value)||0}})}/>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Размер тени</label>
                                <input type="range" min="0" max="50" value={s.cards?.shadowSize ?? 10} onChange={e=>setS({...s, cards:{...s.cards, shadowSize: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowSize ?? 10}px</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Прозрачность тени</label>
                                <input type="range" min="0" max="100" value={s.cards?.shadowOpacity ?? 15} onChange={e=>setS({...s, cards:{...s.cards, shadowOpacity: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowOpacity ?? 15}%</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Масштаб при наведении</label>
                                <input type="range" min="100" max="110" step="1" value={s.cards?.hoverScale ?? 103} onChange={e=>setS({...s, cards:{...s.cards, hoverScale: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{(s.cards?.hoverScale ?? 103)/100}x</span>
                            </div>
                        </div>
                        <div style={{fontSize:'0.75rem',color:'var(--cms-muted)',fontWeight:600,marginBottom:'0.5rem'}}>Предпросмотр</div>
                        <CardPreview cards={s.cards || {}}/>
                    </div>

                    <button className="btn btn-white" onClick={() => onSave(s)}>Сохранить настройки</button>
                </div>
            );
        }

        // ─── Editor ───
        function Editor({ project, categories, onSave, onDelete, onClose }) {
            const [initialProj] = useState(() => withBlockUids({ ...project }));
            const [proj, setProj, history] = useHistory(initialProj);
            const [uploading, setUploading] = useState(false);
            const [toast, setToast] = useState(null);
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [previewMode, setPreviewMode] = useState('desktop');
            const [previewFullscreen, setPreviewFullscreen] = useState(false);
            const [previewSeed, setPreviewSeed] = useState(0);
            const [previewPip, setPreviewPip] = useState(false);
            // Кейс открывается со свёрнутыми блоками: видно всю структуру сразу
            const [collapsed, setCollapsed] = useState(() => new Set((initialProj.blocks || []).map(b => b._uid)));
            const dragItem = useRef(null);
            const dragOver = useRef(null);
            const autoSaveTimer = useRef(null);

            // _uid — служебное поле интерфейса, наружу не уходит
            const saveProj = (p) => onSave(stripBlockUids(p));
            const toggleCollapse = (uid) => setCollapsed(prev => { const n = new Set(prev); if (n.has(uid)) n.delete(uid); else n.add(uid); return n; });
            const collapseAll = () => setCollapsed(new Set((proj.blocks || []).map(b => b._uid)));
            const expandAll = () => setCollapsed(new Set());
            const togglePip = () => {
                setPreviewPip(v => !v);
                // Ширина панели меняется — просим LivePreview пересчитать масштаб
                setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
            };

            const update = (k, v) => { setProj(p => ({ ...p, [k]: v })); setDirty(true); };
            const updateBlock = (i, k, v) => { const b = [...proj.blocks]; b[i] = { ...b[i], [k]: v }; update('blocks', b); };
            const addBlock = (type) => {
                const defs = { heading:{level:'h2',content:''}, text:{content:''}, image:{content:'',caption:''}, video:{content:''}, gallery:{images:[]}, links:{title:'Материалы проекта',layout:'cards',items:[{platform:'website',label:'Сайт проекта',url:''}]}, spacer:{height:80}, raw_html:{content:''}, columns:{cols:[{text:'',image:''},{text:'',image:''}]}, compare:{before:'',after:''}, quote:{text:'',author:'',role:'',photo:''}, metrics:{items:[{value:'',label:''},{value:'',label:''},{value:'',label:''}]}, process:{steps:[{title:'диагностика',text:'### контекст\nОбычный текст — серым.\n**Жирное** — тёмным, ==акцент== — цветом кейса.'},{title:'проектирование',text:''}]} };
                // Новый блок не попадает в set свёрнутых — открывается сразу для заполнения
                update('blocks', [...(proj.blocks||[]), { type, _uid: nextBlockUid(), ...defs[type] }]);
            };
            const removeBlock = (i) => { const b = [...proj.blocks]; b.splice(i,1); update('blocks', b); };
            const moveBlock = (i, d) => { const b = [...proj.blocks]; const t = i+d; if(t<0||t>=b.length) return; [b[i],b[t]]=[b[t],b[i]]; update('blocks', b); };

            // Drag & Drop
            const onDragStart = (i) => { dragItem.current = i; };
            const onDragEnter = (i) => { dragOver.current = i; };
            const onDragEnd = () => {
                if (dragItem.current !== null && dragOver.current !== null && dragItem.current !== dragOver.current) {
                    const b = [...proj.blocks];
                    const item = b.splice(dragItem.current, 1)[0];
                    b.splice(dragOver.current, 0, item);
                    update('blocks', b);
                }
                dragItem.current = null; dragOver.current = null;
            };

            // Autosave (30 sec)
            useEffect(() => {
                if (dirty) {
                    clearTimeout(autoSaveTimer.current);
                    autoSaveTimer.current = setTimeout(() => {
                        setSaving(true);
                        saveProj(proj);
                        setDirty(false);
                        setSaving(false);
                    }, 30000);
                }
                return () => clearTimeout(autoSaveTimer.current);
            }, [proj, dirty]);

            // Hotkeys
            useEffect(() => {
                const handler = (e) => {
                    if (previewFullscreen && e.key === 'Escape') { e.preventDefault(); setPreviewFullscreen(false); return; }
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveProj(proj); setDirty(false); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); history.undo(); }
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); history.redo(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [proj, history, previewFullscreen]);

            useEffect(() => {
                document.body.classList.toggle('preview-fullscreen-open', previewFullscreen);
                return () => document.body.classList.remove('preview-fullscreen-open');
            }, [previewFullscreen]);

            // Живой предпросмотр в отдельной вкладке: на каждое изменение кейса
            // кладём его в localStorage. Открытая вкладка preview.html ловит
            // событие storage и перерисовывается — видно ещё до сохранения.
            useEffect(() => {
                try { localStorage.setItem('alab_preview_case', JSON.stringify(stripBlockUids(proj))); } catch {}
            }, [proj]);

            const openPreview = () => {
                try { localStorage.setItem('alab_preview_case', JSON.stringify(stripBlockUids(proj))); } catch {}
                // Именованная цель — повторный клик обновляет ту же вкладку, а не плодит новые
                window.open(`${CMS_BASE_PATH}/preview.html`, 'alab-preview');
            };

            const restartPreview = () => setPreviewSeed(Date.now());
            const showToast = (msg, ok = true, duration = 3000) => { setToast({ msg, ok }); setTimeout(() => setToast(null), duration); };
            const handleUpload = async (e, cb) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(true);
                const fd = new FormData(); fd.append('caseId', proj.id); fd.append('media', file);
                try {
                    const r = await fetch(`${API}/upload`, { method:'POST', body:fd, headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''} });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.path) cb(j.path);
                    else showToast(j.error || `Не загрузился файл: ${file.name}`, false);
                } catch(e) { console.error(e); showToast(`Не загрузился файл: ${file.name}`, false); }
                setUploading(false);
            };

            return (
                <div className="cms-wrap cms-wrap-editor">
                    <div className="editor-top">
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <button className="btn btn-dark btn-sm" onClick={onClose}>← Назад</button>
                            <a href="https://alabspace.com/#portfolio" target="_blank" className="btn btn-dark btn-sm" style={{textDecoration:'none'}}>↗ Сайт</a>
                            <button className="btn btn-white btn-sm" onClick={openPreview} title="Открыть кейс в отдельной вкладке — как он будет выглядеть на сайте (с учётом несохранённых правок)">👁 Превью</button>
                            <span style={{fontSize:'1.1rem',fontWeight:700}}>{proj.title||'—'}</span>
                            <span className={`status-badge ${proj.status==='draft'?'status-draft':'status-published'}`} style={{cursor:'pointer'}} onClick={()=>update('status',proj.status==='draft'?'published':'draft')}>{proj.status==='draft'?'Черновик':'Опубликован'}</span>
                            <span className={'status-badge ' + (proj.featured?'status-featured-on':'status-featured-off')} style={{cursor:'pointer'}} title="До трёх проектов с меткой показываются на главной первыми" onClick={()=>update('featured', !proj.featured)}>{proj.featured?'★ На главной':'☆ На главную'}</span>
                            <div className="save-indicator"><span className={`save-dot ${saving?'saving':dirty?'unsaved':'saved'}`}/>{saving?'Сохраняю...':dirty?'Есть изменения':'Сохранено'}</div>
                        </div>
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <button className="btn btn-dark btn-sm" disabled={!history.canUndo} onClick={history.undo} title="Ctrl+Z">↶</button>
                            <button className="btn btn-dark btn-sm" disabled={!history.canRedo} onClick={history.redo} title="Ctrl+Y">↷</button>
                            <button className="btn btn-red btn-sm" onClick={onDelete}>Удалить</button>
                            <button className="btn btn-white btn-sm" onClick={() => {
                                const warnings = [];
                                if (!proj.title || proj.title === 'Новый проект') warnings.push('Название не задано');
                                if (proj.status !== 'draft' && (!proj.blocks || !proj.blocks.length)) warnings.push('Нет блоков контента');
                                if (proj.status !== 'draft' && proj.blocks) {
                                    const emptyImgs = proj.blocks.filter(b => b.type === 'image' && !b.content).length;
                                    if (emptyImgs) warnings.push(emptyImgs + ' пустых изображений');
                                }
                                if (warnings.length && !confirm('⚠ Предупреждения:\n• ' + warnings.join('\n• ') + '\n\nСохранить всё равно?')) return;
                                saveProj(proj); setDirty(false);
                            }}>Сохранить</button>
                        </div>
                    </div>
                    <div className="field-row">
                        <div><label className="field-label">Идентификатор</label><input className="input" value={proj.id} onChange={e=>update('id',e.target.value)}/></div>
                        <div><label className="field-label">Категория</label><select className="input" value={proj.categoryId} onChange={e=>update('categoryId',e.target.value)}>{Object.entries(categories).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div>
                    </div>
                    <div className="field-row">
                        <div><label className="field-label">Название</label><input className="input" value={proj.title} onChange={e=>update('title',e.target.value)}/></div>
                        <div><label className="field-label">Логотип</label><div style={{display:'flex',gap:'0.5rem'}}><input className="input" value={proj.logo||''} onChange={e=>update('logo',e.target.value)} placeholder="Путь к логотипу"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>update('logo',p))}/>Файл</label></div></div>
                    </div>
                    <div style={{marginBottom:'1rem'}}><label className="field-label">Подпись под логотипом — видна на карточке проекта</label><input className="input" value={proj.tagline||''} onChange={e=>update('tagline',e.target.value)} placeholder="например: бюро недвижимости и девелопмента" maxLength={80}/></div>
                    <div style={{marginBottom:'1rem'}}><label className="field-label">Превью карточки — зацикленное видео при наведении (mp4/webm)</label><div style={{display:'flex',gap:'0.5rem'}}><input className="input" value={proj.hoverVideo||''} onChange={e=>update('hoverVideo',e.target.value)} placeholder="Путь к ролику-превью или пусто"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} accept="video/mp4,video/webm,video/quicktime" onChange={e=>handleUpload(e,p=>update('hoverVideo',p))}/>Файл</label>{proj.hoverVideo && <button className="btn btn-dark btn-sm" onClick={()=>update('hoverVideo','')} title="Убрать превью">✕</button>}</div><div style={{fontSize:'0.72rem',color:'#888',marginTop:'0.35rem'}}>Короткий немой ролик 2–6 с. На десктопе играет при наведении, на мобиле — когда карточка в кадре. Логотип остаётся поверх.</div>{proj.hoverVideo && <video src={proj.hoverVideo} muted loop autoPlay playsInline style={{marginTop:'0.5rem',width:180,borderRadius:8,display:'block',background:'#eee'}}/>}</div>
                    <div style={{marginBottom:'1rem'}}><label style={{display:'flex',alignItems:'center',gap:'0.5rem',fontSize:'0.85rem',color:'#999'}}><input type="checkbox" checked={proj.isExternal||false} onChange={e=>update('isExternal',e.target.checked)}/>Внешняя ссылка</label>
                    {proj.isExternal && <input className="input" style={{marginTop:'0.5rem'}} value={proj.externalUrl||''} onChange={e=>update('externalUrl',e.target.value)} placeholder="https://behance.net/..."/>}</div>
                    <div className={'case-setup-grid' + (proj.isExternal ? ' external' : '') + (previewPip ? ' pip-on' : '')}>
                        <div className="case-setup-col">
                            <div className="seo-section" style={{marginTop:0}}>
                                <div className="seo-label">🎨 Стиль кейса</div>
                                <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>{['light','dark'].map(t=><button key={t} className={`btn btn-sm ${(proj.theme||'light')===t?'btn-blue':'btn-dark'}`} onClick={()=>update('theme',t)}>{t==='light'?'☀ Светлый':'🌙 Тёмный'}</button>)}</div>
                                <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}><span className="field-label" style={{margin:0}}>Accent:</span><input type="color" value={proj.accentColor||'#6b6b6b'} onChange={e=>update('accentColor',e.target.value)} style={{width:32,height:32,border:'1px solid #333',borderRadius:4,background:'none',cursor:'pointer'}}/><span style={{fontSize:'0.75rem',color:'#555'}}>{proj.accentColor||'#6b6b6b'}</span></div>
                            </div>
                            <div className="seo-section" style={{marginTop:0}}>
                                <div className="seo-label">🔍 SEO</div>
                            <div className="field-row">
                                <div><label className="field-label">Title (для поиска)</label><input className="input" value={proj.seoTitle||''} onChange={e=>update('seoTitle',e.target.value)} placeholder={proj.title}/></div>
                                <div><label className="field-label">OG Image</label><input className="input" value={proj.ogImage||''} onChange={e=>update('ogImage',e.target.value)} placeholder="URL обложки для шеринга"/></div>
                            </div>
                            <div><label className="field-label">Description (для поиска)</label><textarea className="input" style={{minHeight:50}} value={proj.seoDesc||''} onChange={e=>update('seoDesc',e.target.value)} placeholder="Краткое описание проекта для Google и соцсетей"/></div>
                            </div>
                        </div>
                        {!proj.isExternal && (
                            <div className={'live-preview' + (previewPip ? ' live-preview-pip' : '')}>
                                <div className="live-preview-header">
                                    <span>Предпросмотр</span>
                                    <div style={{display:'flex',gap:'0.3rem',alignItems:'center',flexWrap:'wrap'}}>
                                        <button className={`preview-mode-btn ${previewMode==='desktop'?'active':''}`} onClick={()=>setPreviewMode('desktop')}>🖥</button>
                                        <button className={`preview-mode-btn ${previewMode==='mobile'?'active':''}`} onClick={()=>setPreviewMode('mobile')}>📱</button>
                                        <button className="preview-mode-btn" onClick={restartPreview} title="Перезапустить анимации">↻ Анимации</button>
                                        <button className="preview-mode-btn" onClick={()=>setPreviewFullscreen(true)} title="Открыть предпросмотр на весь экран">⛶ На весь экран</button>
                                        <button className={`preview-mode-btn pip-toggle-btn ${previewPip?'active':''}`} onClick={togglePip} title="Плавающее окно предпросмотра: остаётся на экране, пока листаете блоки">{previewPip?'✕ Открепить':'📌 Закрепить'}</button>
                                        <span className="live-preview-hint">{(proj.blocks||[]).filter(b=>b.enabled!==false).length} вкл.</span>
                                    </div>
                                </div>
                                <LivePreview blocks={proj.blocks||[]} title={proj.title} mode={previewMode} seed={previewSeed} accent={proj.accentColor||""}/>
                            </div>
                        )}
                    </div>

                    {!proj.isExternal && (
                        <div className="blocks-workspace">
                            <div className="blocks-toolbar">
                                <h3 className="blocks-title">Блоки ({(proj.blocks||[]).length})</h3>
                                <div className="blocks-legend">
                                    {Object.entries(BLOCK_GROUPS).map(([key,g]) => <span key={key} className="legend-item" data-group={key}><i/>{g.label}</span>)}
                                </div>
                                <div className="blocks-toolbar-actions">
                                    <button className="btn btn-ghost btn-sm" onClick={collapseAll} title="Свернуть все блоки — видна вся структура кейса">⌃ Свернуть всё</button>
                                    <button className="btn btn-ghost btn-sm" onClick={expandAll} title="Развернуть все блоки для редактирования">⌄ Развернуть всё</button>
                                </div>
                            </div>
                            <div className="blocks-canvas">
                            {(proj.blocks||[]).map((block,i)=>{
                                const blockMeta = BLOCK_TYPES.find(b=>b.type===block.type) || { icon:'•', label:block.type };
                                const grp = blockMeta.group || blockGroupOf(block.type);
                                const uid = block._uid || `i${i}`;
                                const isCollapsed = collapsed.has(uid);
                                const enabled = block.enabled !== false;
                                const thumb = blockThumb(block);
                                return (
                                <div key={uid} className={'block-item'+(isCollapsed?' is-collapsed':'')+(enabled?'':' is-off')} data-block-type={block.type} data-group={grp}
                                    draggable onDragStart={()=>onDragStart(i)} onDragEnter={()=>onDragEnter(i)} onDragEnd={onDragEnd} onDragOver={e=>e.preventDefault()}>
                                    <div className="block-head" onClick={()=>toggleCollapse(uid)}>
                                        <span className="drag-handle" title="Перетащить" onClick={e=>e.stopPropagation()}>⠿</span>
                                        <span className="blk-num">{String(i+1).padStart(2,'0')}</span>
                                        <span className="blk-icon">{blockMeta.icon}</span>
                                        <span className="blk-label">{blockMeta.label}</span>
                                        {thumb ? <img className="blk-thumb" src={thumb} alt="" loading="lazy"/> : null}
                                        <span className="blk-summary">{blockSummary(block)}</span>
                                        <label className="blk-switch-wrap" onClick={e=>e.stopPropagation()} title={enabled?'Блок показывается на сайте — щёлкните, чтобы скрыть':'Блок скрыт на сайте — щёлкните, чтобы показать'}>
                                            <span className={'blk-switch'+(enabled?' on':'')}><input type="checkbox" checked={enabled} onChange={e=>updateBlock(i,'enabled',e.target.checked)}/></span>
                                        </label>
                                        <div className="block-actions" onClick={e=>e.stopPropagation()}>
                                            <button onClick={()=>moveBlock(i,-1)} title="Переместить выше">↑</button>
                                            <button onClick={()=>moveBlock(i,1)} title="Переместить ниже">↓</button>
                                            <button style={{color:'#c0392b'}} onClick={()=>removeBlock(i)} title="Удалить блок">✕</button>
                                        </div>
                                        <button className={'blk-chevron'+(isCollapsed?'':' open')} onClick={e=>{e.stopPropagation();toggleCollapse(uid)}} title={isCollapsed?'Развернуть':'Свернуть'}>⌄</button>
                                    </div>
                                    {!isCollapsed && <div className="block-body">
                                        <BlockEditor block={block} index={i} projId={proj.id} updateBlock={updateBlock} handleUpload={handleUpload} showToast={showToast}/>
                                    </div>}
                                </div>
                                );
                            })}
                            </div>
                            <div className="add-palette">
                                <div className="add-palette-title">Добавить блок</div>
                                <div className="add-palette-groups">
                                    {Object.entries(BLOCK_GROUPS).map(([key,g]) => (
                                        <div className="palette-group" data-group={key} key={key}>
                                            <div className="palette-group-label"><i/>{g.label}</div>
                                            <div className="palette-group-btns">
                                                {BLOCK_TYPES.filter(bt=>bt.group===key).map(bt=>(
                                                    <button key={bt.type} className="palette-btn" onClick={()=>addBlock(bt.type)}><span className="blk-icon">{bt.icon}</span>{bt.label}</button>
                                                ))}
                                                {key==='media' && (
                                                    <label className="palette-btn" style={{cursor:'pointer'}}><input type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>{
                                                        const files = Array.from(e.target.files); if(!files.length) return;
                                                        e.target.value = '';
                                                        const failed = [];
                                                        Promise.all(files.map(file=>{
                                                            const fd=new FormData();fd.append('caseId',proj.id);fd.append('media',file);
                                                            return fetch(`${API}/upload`,{method:'POST',body:fd,headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''}})
                                                                .then(r=>r.json().catch(()=>({})).then(j=>(r.ok&&j.path)?j.path:Promise.reject(new Error(j.error||'upload'))))
                                                                .catch(()=>{failed.push(file.name);return null;});
                                                        })).then(paths=>{
                                                            const images = paths.filter(Boolean);
                                                            if(images.length) update('blocks',[...(proj.blocks||[]),{type:'gallery',_uid:nextBlockUid(),images}]);
                                                            if(failed.length) showToast(`Не загрузились: ${failed.join(', ')}`, false, 5000);
                                                        });
                                                    }}/><span className="blk-icon">📁</span>Массовая загрузка → Галерея</label>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
	                    {previewFullscreen && (
	                        <div className="preview-fullscreen-overlay">
	                            <div className="preview-fullscreen-bar">
	                                <div className="preview-fullscreen-title">{proj.title || 'Предпросмотр кейса'}</div>
	                                <div className="preview-fullscreen-actions">
	                                    <button className={`preview-mode-btn ${previewMode==='desktop'?'active':''}`} onClick={()=>setPreviewMode('desktop')}>Desktop</button>

	                                    <button className="btn btn-white btn-sm" onClick={()=>setPreviewFullscreen(false)}>✓ Закрыть</button>
	                                </div>
	                            </div>
	                            <div className="preview-fullscreen-body">
	                                <LivePreview blocks={proj.blocks||[]} title={proj.title} mode={previewMode} seed={previewSeed} accent={proj.accentColor||""} fullscreen />
