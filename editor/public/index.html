<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>A.LAB — Редактор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

        /* Login */
        .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center}
        .login-box{width:340px;padding:2.5rem;background:#111;border:1px solid #1a1a1a;border-radius:12px}
        .login-logo{font-size:1.4rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.3rem}
        .login-sub{font-size:0.8rem;color:#555;margin-bottom:2rem}
        .login-field{margin-bottom:1rem}
        .login-field label{display:block;font-size:0.72rem;color:#666;margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.06em}
        .login-btn{width:100%;padding:0.7rem;background:#fff;color:#000;border:none;border-radius:6px;font-weight:700;font-size:0.9rem;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s}
        .login-btn:hover{opacity:0.85}
        .login-btn:disabled{opacity:0.4;cursor:default}
        .login-err{color:#e74c3c;font-size:0.78rem;margin-top:0.75rem;text-align:center}

        /* Layout */
        .cms-wrap{max-width:1400px;margin:0 auto;padding:2rem 1.5rem 4rem}
        .cms-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;border-bottom:1px solid #222;padding-bottom:1.5rem}
        .cms-title{font-size:1.5rem;font-weight:700;letter-spacing:-0.02em}
        .cms-user{font-size:0.75rem;color:#555;display:flex;align-items:center;gap:0.75rem}

        /* Buttons */
        .btn{padding:0.5rem 1rem;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:0.85rem;transition:opacity 0.2s}
        .btn:hover{opacity:0.85}
        .btn-white{background:#fff;color:#000}
        .btn-dark{background:#1a1a1a;color:#ccc;border:1px solid #333}
        .btn-red{background:#c0392b;color:#fff}
        .btn-blue{background:#6b6b6b;color:#fff}
        .btn-sm{padding:0.35rem 0.7rem;font-size:0.78rem}
        .btn-ghost{background:none;border:none;color:#666;cursor:pointer;font-size:0.78rem;padding:0.3rem 0.5rem}
        .btn-ghost:hover{color:#eee}

        /* Inputs */
        .input{background:#151515;border:1px solid #2a2a2a;padding:0.55rem 0.75rem;color:#eee;width:100%;border-radius:6px;font-size:0.9rem}
        .input:focus{outline:none;border-color:#555}
        select.input{appearance:auto}
        textarea.input{resize:vertical;font-family:monospace;font-size:0.82rem;min-height:80px}

        /* Cards */
        .cat-section{margin-bottom:2rem}
        .cat-label{font-size:0.8rem;color:#666;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.75rem}
        .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem}
        .proj-card{background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;cursor:pointer;transition:border-color 0.2s}
        .proj-card:hover{border-color:#444}
        .proj-card-id{font-size:0.7rem;color:#555;margin-bottom:0.3rem}
        .proj-card-title{font-weight:600;font-size:0.95rem}

        /* Editor */
        .editor-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;gap:0.5rem}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .field-label{font-size:0.75rem;color:#777;margin-bottom:0.3rem;display:block}

        /* Blocks */
        .block-item{background:#111;border:1px solid #222;border-radius:8px;padding:1rem;margin-bottom:0.75rem}
        .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
        .block-type{
            display:inline-flex;
            align-items:center;
            gap:0.32rem;
            padding:0.28rem 0.62rem;
            border:1px solid var(--block-accent-line,rgba(29,29,31,0.12));
            border-radius:999px;
            background:var(--block-accent-bg,rgba(255,255,255,0.52));
            color:var(--block-accent-text,var(--cms-text,#1d1d1f));
            font-size:0.68rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:0.045em;
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.46);
        }
        .block-actions{display:flex;gap:0.3rem}
        .block-actions button{background:none;border:none;color:#666;cursor:pointer;font-size:0.85rem;padding:2px 6px;border-radius:4px}
        .block-actions button:hover{background:#222;color:#eee}

        .add-bar{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;padding-top:1rem;border-top:1px solid #1a1a1a}

        /* Preview */
        .preview-wrap{margin-top:1rem}
        .preview-label{font-size:0.75rem;color:#e67e22;font-weight:600;margin-bottom:0.5rem}
        .preview-container{position:relative;width:100%;background:#0a0a0a;border:1px solid #333;border-radius:6px;overflow:hidden}
        .preview-container iframe{width:1440px;height:900px;transform-origin:top left;border:none;display:block;pointer-events:none}


        /* Split layout */
        .editor-split{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
        .editor-panel{min-width:0}
        .live-preview{background:#111;border:1px solid #222;border-radius:8px;overflow:hidden}
        .live-preview-header{padding:0.5rem 0.75rem;font-size:0.75rem;font-weight:600;color:#e67e22;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
        .live-preview-frame{position:relative;width:100%;overflow:hidden}
        .live-preview-frame iframe{width:1440px;transform-origin:top left;border:none;display:block;pointer-events:none}
        @media(max-width:900px){.editor-split{grid-template-columns:1fr}.live-preview{position:static}}


        /* Style toolbar */
        .style-bar{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.5rem;align-items:center}
        .style-bar .sb-group{display:flex;gap:2px;align-items:center;padding-right:0.5rem;border-right:1px solid #222}
        .style-bar .sb-group:last-child{border:none}
        .style-bar button{background:#1a1a1a;border:1px solid #333;color:#999;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:0.75rem;display:flex;align-items:center;justify-content:center}
        .style-bar button.active{background:#6b6b6b;color:#fff;border-color:#6b6b6b}
        .style-bar button:hover{border-color:#555;color:#eee}
        .style-bar select{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:0.2rem;border-radius:4px;font-size:0.72rem;height:28px}
        .style-bar input[type=color]{width:28px;height:28px;padding:0;border:1px solid #333;border-radius:4px;background:none;cursor:pointer}
        .style-bar input[type=number]{width:50px;background:#1a1a1a;border:1px solid #333;color:#ccc;padding:0.2rem 0.3rem;border-radius:4px;font-size:0.72rem;height:28px}
        .style-bar .sb-label{font-size:0.65rem;color:#555;margin-right:0.2rem}


        /* Rich Editor */
        .rich-editor{background:#151515;border:1px solid #2a2a2a;padding:0.75rem;color:#eee;width:100%;border-radius:6px;font-size:0.95rem;line-height:1.6;outline:none;margin-top:0.5rem;overflow-y:auto;max-height:300px;white-space:pre-wrap;word-break:break-word}
        .rich-editor:focus{border-color:#555}
        .rich-editor:empty:before{content:attr(data-placeholder);color:#555}
        .rich-editor b,.rich-editor strong{font-weight:700}
        .rich-editor i,.rich-editor em{font-style:italic}
        .rich-editor a{
            color:var(--cms-text,#fff);
            text-decoration:underline;
            text-decoration-thickness:1px;
            text-underline-offset:0.18em;
        }
        .link-block-editor{display:flex;flex-direction:column;gap:0.7rem}
        .link-editor-head{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:0.6rem;align-items:center}
        .link-editor-row{
            display:grid;
            grid-template-columns:minmax(108px,0.78fr) minmax(0,1fr) minmax(0,1.3fr) minmax(74px,max-content);
            gap:0.45rem;
            align-items:center;
            padding:0.55rem;
            background:var(--cms-surface-soft,#1a1a1a);
            border:1px solid var(--cms-line,#222);
            border-radius:14px;
            max-width:100%;
            overflow:hidden;
        }
        .link-editor-row > *{min-width:0}
        .link-editor-row .btn{justify-self:stretch;white-space:nowrap;padding-left:0.65rem;padding-right:0.65rem}
        .link-editor-note{font-size:0.73rem;color:var(--cms-muted,#777);line-height:1.45}
        .columns-editor-toolbar{display:flex;gap:0.45rem;align-items:center;margin-bottom:0.8rem}
        .columns-editor-grid{display:grid;gap:0.75rem}
        .column-editor-card{
            display:flex;
            flex-direction:column;
            gap:0.55rem;
            min-width:0;
            padding:0.65rem;
            border:1px solid var(--cms-line,#222);
            border-radius:20px;
            background:linear-gradient(145deg,rgba(255,255,255,0.92),rgba(240,240,242,0.72));
            box-shadow:0 16px 38px rgba(29,29,31,0.05);
        }
        .column-editor-media-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0.4rem;align-items:center}
        .column-editor-preview{
            width:100%;
            height:112px;
            object-fit:cover;
            border-radius:15px;
            border:1px solid var(--cms-line,#222);
            background:#fff;
        }
        .column-editor-placeholder{
            display:grid;
            place-items:center;
            height:112px;
            border:1px dashed var(--cms-line-strong,#333);
            border-radius:15px;
            color:var(--cms-muted,#777);
            font-size:0.78rem;
            background:rgba(255,255,255,0.54);
        }
        .column-editor-card textarea.input{min-height:112px;border-radius:16px;line-height:1.45}
        @media(max-width:760px){
            .link-editor-head,.link-editor-row{grid-template-columns:1fr}
            .link-editor-row .btn{width:100%}
            .columns-editor-grid{grid-template-columns:1fr!important}
        }


        .proj-card{display:flex;align-items:center;gap:0.75rem;background:#141414;border:1px solid #222;border-radius:8px;padding:1rem;cursor:pointer;transition:background 0.3s}
        .proj-card-logo{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#222;padding:6px;flex-shrink:0}
        .proj-card-nologo{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#6b6b6b,#8e44ad);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:1.2rem;font-weight:700;color:#fff;flex-shrink:0}


        /* Drag & Drop */
        .block-item{transition:transform 0.2s,opacity 0.2s}
        .block-item.dragging{opacity:0.4;transform:scale(0.97)}
        .block-item.drag-over{border-color:#6b6b6b;box-shadow:0 0 0 2px rgba(41,128,185,0.3)}
        .drag-handle{cursor:grab;color:#555;font-size:1rem;padding:0 4px;user-select:none}
        .drag-handle:active{cursor:grabbing}

        /* Status badge */
        .status-badge{font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:99px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
        .status-published{background:#27ae60;color:#fff}
        .status-draft{background:#555;color:#ccc}
        .status-demo{background:#8e44ad;color:#fff}

        /* Publish health */
        .publish-panel{background:linear-gradient(135deg,#101820,#0d0d0d);border:1px solid #203040;border-radius:10px;padding:1rem;margin-bottom:1.25rem}
        .publish-panel-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:0.8rem}
        .publish-title{font-size:0.95rem;font-weight:700;color:#fff}
        .publish-note{font-size:0.75rem;color:#7c8794;line-height:1.5;margin-top:0.2rem}
        .publish-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.6rem}
        .publish-stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:0.75rem}
        .publish-stat-value{font-size:1.25rem;font-weight:800;color:#fff}
        .publish-stat-label{font-size:0.68rem;color:#66717d;text-transform:uppercase;letter-spacing:0.06em;margin-top:0.2rem}
        .publish-warnings{margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid rgba(255,255,255,0.06)}
        .publish-warning{font-size:0.78rem;color:#f1c40f;margin-top:0.25rem}

        /* Autosave indicator */
        .save-indicator{font-size:0.72rem;display:flex;align-items:center;gap:0.3rem}
        .save-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
        .save-dot.saved{background:#27ae60}
        .save-dot.unsaved{background:#e67e22}
        .save-dot.saving{background:#6b6b6b;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

        /* Mobile preview toggle */
        .preview-mode-btn{padding:0.2rem 0.5rem;font-size:0.7rem;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#999;cursor:pointer}
        .preview-mode-btn.active{background:#6b6b6b;color:#fff;border-color:#6b6b6b}

        /* Template modal */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9998}
        .modal-box{background:#111;border:1px solid #333;border-radius:12px;padding:2rem;max-width:500px;width:90%}
        .modal-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
        .template-card{padding:1rem;background:#1a1a1a;border:1px solid #222;border-radius:8px;cursor:pointer;transition:border-color 0.2s;margin-bottom:0.5rem}
        .template-card:hover{border-color:#6b6b6b}
        .template-name{font-weight:600;margin-bottom:0.2rem}
        .template-desc{font-size:0.8rem;color:#666}

        /* SEO section */
        .seo-section{background:#0d1117;border:1px solid #1a2332;border-radius:8px;padding:1rem;margin-top:1rem}
        .seo-label{font-size:0.7rem;color:#58a6ff;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.7rem}

        /* Toast */
        .toast{position:fixed;bottom:1rem;right:1rem;padding:0.6rem 1.2rem;border-radius:6px;font-size:0.85rem;font-weight:600;z-index:9999;animation:fadeIn .3s ease}
        .toast-ok{background:#27ae60;color:#fff}
        .toast-err{background:#c0392b;color:#fff}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .empty-state{text-align:center;padding:4rem 2rem;color:#444}
        .empty-state p{margin-top:0.5rem;font-size:0.9rem}

        /* Tabs */
        .tabs{display:flex;gap:0;border-bottom:1px solid #222;margin-bottom:2rem}
        .tab{padding:0.6rem 1.2rem;font-size:0.85rem;font-weight:600;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
        .tab:hover{color:#ccc}
        .tab.active{color:#fff;border-bottom-color:#fff}

        /* Settings */
        .settings-section{margin-bottom:2rem;padding:1.5rem;background:#111;border:1px solid #222;border-radius:8px}
        .settings-title{font-size:1rem;font-weight:700;margin-bottom:1rem}
        .analytics-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;margin-bottom:1rem;padding:1rem;border-radius:18px;background:linear-gradient(145deg,rgba(239,239,242,0.9),rgba(226,226,230,0.76));box-shadow:0 12px 36px rgba(29,29,31,0.05)}
        .analytics-title{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700;letter-spacing:-0.05em;color:var(--cms-text)}
        .analytics-note{font-size:0.75rem;color:var(--cms-muted);line-height:1.45;margin-top:0.25rem;max-width:760px}
        .analytics-range{display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
        .analytics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0.75rem;margin-bottom:1rem}
        .analytics-card{padding:1rem;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,0.9),rgba(237,237,240,0.78));box-shadow:0 12px 36px rgba(29,29,31,0.045)}
        .analytics-card-value{font-family:'Unbounded',sans-serif;font-size:1.55rem;font-weight:700;letter-spacing:-0.06em;color:var(--cms-text)}
        .analytics-card-label{font-size:0.68rem;color:var(--cms-muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:0.35rem}
        .analytics-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,0.75fr);gap:1rem;align-items:start}
        .analytics-panel{padding:1rem;border-radius:22px;background:linear-gradient(145deg,rgba(234,234,237,0.96),rgba(218,219,223,0.86));box-shadow:var(--cms-shadow);min-width:0}
        .analytics-panel-title{font-size:0.86rem;font-weight:800;margin-bottom:0.75rem;color:var(--cms-text)}
        .chart-bars{height:180px;display:flex;align-items:flex-end;gap:0.32rem;padding:0.75rem 0.25rem 0;border-bottom:1px solid var(--cms-line)}
        .chart-bar{flex:1;min-width:5px;border-radius:999px 999px 0 0;background:linear-gradient(180deg,#1d1d1f,rgba(29,29,31,0.18));position:relative}
        .chart-bar span{position:absolute;left:50%;bottom:calc(100% + 0.25rem);transform:translateX(-50%);font-size:0.62rem;color:var(--cms-muted);opacity:0}
        .chart-bar:hover span{opacity:1}
        .chart-caption{display:flex;justify-content:space-between;color:var(--cms-muted);font-size:0.68rem;margin-top:0.45rem}
        .analytics-list{display:flex;flex-direction:column;gap:0.45rem}
        .analytics-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0.75rem;align-items:center;padding:0.52rem 0;border-bottom:1px solid var(--cms-line)}
        .analytics-row:last-child{border-bottom:0}
        .analytics-row-label{font-size:0.8rem;color:var(--cms-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .analytics-row-value{font-size:0.78rem;font-weight:800;color:var(--cms-text)}
        .analytics-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
        .seo-score{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.8rem}
        .seo-score-circle{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#1d1d1f calc(var(--score)*1%),rgba(29,29,31,0.08) 0);font-family:'Unbounded',sans-serif;font-size:0.95rem;font-weight:700;color:var(--cms-text)}
        .seo-check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0.55rem;align-items:start;padding:0.45rem 0;border-bottom:1px solid var(--cms-line)}
        .seo-check:last-child{border-bottom:0}
        .seo-dot{width:10px;height:10px;border-radius:50%;margin-top:0.22rem;background:#a15c00}
        .seo-dot.ok{background:#1d1d1f}
        .seo-check-label{font-size:0.78rem;font-weight:800;color:var(--cms-text)}
        .seo-check-detail{font-size:0.7rem;color:var(--cms-muted);margin-top:0.12rem;line-height:1.35}
        .analytics-empty{padding:2rem;text-align:center;color:var(--cms-muted);font-size:0.86rem}
        .audio-letter{display:flex;align-items:center;gap:1rem;padding:0.75rem 0;border-bottom:1px solid #1a1a1a}
        .audio-letter:last-child{border:none}
        .audio-letter-char{font-size:1.8rem;font-weight:800;width:50px;text-align:center;color:#fff;font-family:'Unbounded',sans-serif}
        .audio-letter-info{flex:1}
        .audio-letter-label{font-size:0.75rem;color:#666;margin-bottom:0.3rem}
        .audio-letter-file{font-size:0.82rem;color:#5dade2}
        .audio-letter-actions{display:flex;gap:0.5rem;align-items:center}
        .volume-slider{width:80px;accent-color:#5dade2}

        /* A.LAB light theme */
        :root{
            --cms-bg:#ededee;
            --cms-surface:#e1e1e4;
            --cms-surface-soft:#d7d8dc;
            --cms-field:#f1f1f2;
            --cms-field-soft:#e8e8eb;
            --cms-control:#f4f4f5;
            --cms-text:#1d1d1f;
            --cms-muted:#6e6e73;
            --cms-faint:#9a9aa0;
            --cms-line:rgba(29,29,31,0.08);
            --cms-line-strong:rgba(29,29,31,0.16);
            --cms-shadow:0 18px 48px rgba(29,29,31,0.07), inset 0 1px 0 rgba(255,255,255,0.62);
            --cms-radius:18px;
        }
        body{
            background:
                radial-gradient(circle at 13% 8%, rgba(255,255,255,0.96) 0, rgba(255,255,255,0) 28rem),
                linear-gradient(180deg,#fbfbfc 0%,var(--cms-bg) 100%);
            color:var(--cms-text);
            font-family:'Roboto',sans-serif;
            -webkit-font-smoothing:antialiased;
        }
        .cms-wrap{max-width:1240px;padding:1.35rem 1.25rem 3rem}

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Undo/Redo Hook ───
        function useHistory(initial) {
            const [states, setStates] = useState([JSON.parse(JSON.stringify(initial))]);
            const [idx, setIdx] = useState(0);
            const current = states[idx];
            const set = useCallback((val) => {
                const v = typeof val === 'function' ? val(states[idx]) : val;
                setStates(prev => [...prev.slice(0, idx + 1), JSON.parse(JSON.stringify(v))].slice(-30));
                setIdx(i => Math.min(i + 1, 29));
            }, [idx, states]);
            const undo = useCallback(() => setIdx(i => Math.max(0, i - 1)), []);
            const redo = useCallback(() => setIdx(i => Math.min(states.length - 1, i + 1)), [states.length]);
            const canUndo = idx > 0;
            const canRedo = idx < states.length - 1;
            return [current, set, { undo, redo, canUndo, canRedo }];
        }

        // ─── Templates ───
        const CASE_TEMPLATES = [
            { name: 'Стандартный кейс', desc: 'Заголовок → Текст → Изображение → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'image',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Минимальный', desc: 'Заголовок → Изображение → Текст',
              blocks: [{type:'heading',level:'h2',content:''},{type:'image',content:''},{type:'text',content:''}] },
            { name: 'Видео-кейс', desc: 'Заголовок → Видео → Текст → Галерея',
              blocks: [{type:'heading',level:'h1',content:''},{type:'video',content:''},{type:'text',content:''},{type:'gallery',images:[]}] },
            { name: 'Лендинг', desc: 'Hero-изображение → Заголовок → Текст → Отступ → Галерея → Текст',
              blocks: [{type:'image',content:''},{type:'heading',level:'h1',content:''},{type:'text',content:''},{type:'spacer',height:60},{type:'gallery',images:[]},{type:'text',content:''}] },
        ];
        const CMS_BASE_PATH = (() => {
            const path = window.location.pathname.replace(/\/+$/, '');
            const match = path.match(/^\/cms-\d+/);
            return match ? match[0] : '';
        })();
        const API = `${CMS_BASE_PATH}/api`;

        const LINK_PLATFORMS = [
            { id: 'website', label: 'Сайт', mark: '↗' },
            { id: 'behance', label: 'Behance', mark: 'Be' },
            { id: 'telegram', label: 'Telegram', mark: 'Tg' },
            { id: 'whatsapp', label: 'WhatsApp', mark: 'Wa' },
            { id: 'instagram', label: 'Instagram', mark: 'Ig' },
            { id: 'youtube', label: 'YouTube', mark: 'Yt' },
            { id: 'pdf', label: 'PDF', mark: 'PDF' },
            { id: 'drive', label: 'Drive', mark: 'Dr' },
            { id: 'other', label: 'Другое', mark: '•' },

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function normalizeLinkUrl(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            if (/^(javascript|data|vbscript):/i.test(raw)) return '';
            if (/^(https?:|mailto:|tel:)/i.test(raw)) return raw;
            if (/^@[\w\d_]{3,}$/i.test(raw)) return `https://t.me/${raw.slice(1)}`;
            if (/^(www\.|[\w-]+(\.[\w-]+)+)([/?#].*)?$/i.test(raw)) return `https://${raw}`;
            if (/^(\/(?!\/)|#)/.test(raw)) return raw;
            return '';
        }

        function displayLinkUrl(value) {
            const normalized = normalizeLinkUrl(value);
            return normalized
                .replace(/^https?:\/\//i, '')
                .replace(/^www\./i, '')
                .replace(/\/$/, '');
        }

        function getLinkPlatform(id) {
            return LINK_PLATFORMS.find(p => p.id === id) || LINK_PLATFORMS[LINK_PLATFORMS.length - 1];
        }

        function renderPreviewLinks(block) {
            const items = (block.items || []).filter(item => normalizeLinkUrl(item.url));
            if (!items.length) return '';
            const title = block.title ? `<div style="font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:700;margin-bottom:0.8rem">${escapeHtml(block.title)}</div>` : '';
            const cards = items.map(item => {
                const platform = getLinkPlatform(item.platform);
                const href = normalizeLinkUrl(item.url);
                const label = item.label || platform.label;
                return `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border:1px solid #dedee3;border-radius:999px;background:#fff;color:#1d1d1f;text-decoration:none;min-width:210px"><span style="width:36px;height:36px;border-radius:50%;background:#1d1d1f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700">${escapeHtml(platform.mark)}</span><span><strong style="display:block;font-size:0.92rem">${escapeHtml(label)}</strong><small style="display:block;color:#6e6e73;margin-top:0.12rem">${escapeHtml(displayLinkUrl(href))}</small></span></a>`;
            }).join('');
            return `<div style="margin:2rem 5%;font-family:'Roboto',sans-serif">${title}<div style="display:flex;flex-wrap:wrap;gap:0.7rem">${cards}</div></div>`;
        }

        function renderPreviewColumns(block) {
            const cols = (block.cols || []).filter(col => String(col.image || '').trim() || String(col.text || '').trim());
            if (!cols.length) return '';
            const count = Math.min(Math.max(cols.length, 1), 3);
            const cards = cols.map((col, i) => {
                const lines = String(col.text || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
                const title = lines.length === 1 && lines[0].length > 64 ? '' : (lines[0] || '');
                const body = title ? lines.slice(1).join('<br>') : lines.join('<br>');
                return `<article style="position:relative;min-height:330px;padding:12px;border:1px solid rgba(29,29,31,.08);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(232,232,235,.76));box-shadow:0 22px 58px rgba(29,29,31,.075);overflow:hidden">
                    ${col.image ? `<div style="height:210px;overflow:hidden;border-radius:20px;background:#fff"><img src="${escapeAttr(col.image)}" style="width:100%;height:100%;object-fit:cover;display:block"/></div>` : ''}
                    <div style="padding:16px 6px 2px">
                        ${title ? `<h3 style="font-family:'Unbounded',sans-serif;font-size:1.1rem;letter-spacing:-.05em;line-height:1.12;margin:0 0 8px">${escapeHtml(title)}</h3>` : ''}
                        ${body ? `<p style="font-family:'Roboto',sans-serif;font-size:.95rem;line-height:1.55;margin:0;color:#1d1d1f">${escapeHtml(body).replace(/&lt;br&gt;/g, '<br>')}</p>` : ''}
                    </div>
                </article>`;
            }).join('');

            return `<div style="display:grid;grid-template-columns:repeat(${count},1fr);gap:24px;margin:2.2rem 5%">${cards}</div>`;
        }

        function previewAnimation(block) {
            return block?.style?.animation || 'none';
        }

        function stripPreviewHtml(value) {
            return String(value || '')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/(p|div|h[1-6])>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ')
                .trim();
        }

        function renderPreviewAnimatedText(value, animation) {
            if (animation === 'split-lines') {
                const lines = stripPreviewHtml(value).split(/\n+/).map(line => line.trim()).filter(Boolean);
                return lines.map((line, index) => `<span class="anim-line" style="--item-i:${index}">${escapeHtml(line)}</span>`).join('');
            }
            if (animation === 'split-words') {
                const words = stripPreviewHtml(value).split(/\s+/).filter(Boolean);
                return words.map((word, index) => `<span class="anim-word" style="--item-i:${index}">${escapeHtml(word)}</span>`).join(' ');
            }
            return String(value || '').replace(/\n/g, '<br>');
        }

        function wrapPreviewBlock(block, html, index) {
            if (!html) return '';
            const animation = previewAnimation(block);
            if (animation === 'none') return html;
            return `<div class="preview-block" data-anim="${escapeAttr(animation)}" style="--block-i:${index}">${html}</div>`;
        }

        const PREVIEW_ANIMATION_CSS = `
            html{scroll-behavior:smooth}
            body{background:#f5f5f5;color:#1a1a1a;font-family:'Roboto',sans-serif;padding:clamp(24px,4vw,56px) 0;min-height:100vh}
            img{max-width:100%;height:auto}
            .preview-block[data-anim]{opacity:0;will-change:transform,opacity,filter;transition:opacity 1.05s cubic-bezier(.16,1,.3,1),transform 1.05s cubic-bezier(.16,1,.3,1),filter 1.05s ease}
            .preview-block[data-anim="fade-up"]{transform:translateY(86px)}
            .preview-block[data-anim="fade-in"]{transform:none}
            .preview-block[data-anim="scale-up"]{transform:scale(.86);filter:blur(10px)}
            .preview-block[data-anim="split-lines"],.preview-block[data-anim="split-words"]{opacity:1;transform:none}
            .preview-block.is-visible[data-anim]{opacity:1;transform:none;filter:none}
            .anim-line{display:block;opacity:0;transform:translateY(34px);transition:opacity .86s cubic-bezier(.16,1,.3,1),transform .86s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--item-i,0) * 110ms)}
            .anim-word{display:inline-block;opacity:0;transform:translateY(1.2em) rotate(.8deg);transition:opacity .72s cubic-bezier(.16,1,.3,1),transform .72s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--item-i,0) * 58ms)}
            .preview-block.is-visible .anim-line,.preview-block.is-visible .anim-word{opacity:1;transform:none}
            @media (prefers-reduced-motion: reduce){.preview-block[data-anim],.anim-line,.anim-word{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}}
        `;

        const PREVIEW_ANIMATION_SCRIPT = `
            (() => {
                const revealables = Array.from(document.querySelectorAll('.preview-block[data-anim]'));
                const show = el => el.classList.add('is-visible');
                if (!('IntersectionObserver' in window)) {
                    revealables.forEach(show);
                    return;
                }
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        show(entry.target);
                        observer.unobserve(entry.target);
                    });
                }, { threshold: 0.18, rootMargin: '0px 0px -10% 0px' });
                revealables.forEach(el => observer.observe(el));
                window.addEventListener('message', event => {
                    if (event.data !== 'restart-preview-animations') return;
                    revealables.forEach(el => {
                        el.classList.remove('is-visible');
                        observer.observe(el);
                    });
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            })();
        `;

        function apiFetch(url, opts = {}) {
            const token = sessionStorage.getItem('cms_token');
            return fetch(url, { ...opts, headers: { ...opts.headers, 'Content-Type': 'application/json', 'X-CMS-Token': token || '' } });
        }

        // ─── Login Screen ───
        function LoginScreen({ onLogin }) {
            const [login, setLogin] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    const res = await fetch(`${API}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login, password })
                    });
                    const json = await res.json();
                    if (json.success && json.token) {
                        sessionStorage.setItem('cms_token', json.token);
                        onLogin();
                    } else {
                        setError(json.error || 'Ошибка входа');
                    }
                } catch (err) {
                    setError('Сервер недоступен');
                }
                setLoading(false);
            };

            return (
                <div className="login-page">
                    <form className="login-box" onSubmit={submit}>
                        <div className="login-logo">a.lab</div>
                        <div className="login-sub">Внутренний редактор портфолио</div>
                        <div className="login-field">
                            <label>Логин</label>
                            <input className="input" value={login} onChange={e => setLogin(e.target.value)} autoFocus />
                        </div>
                        <div className="login-field">
                            <label>Пароль</label>
                            <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)} />
                        </div>
                        <button className="login-btn" type="submit" disabled={loading}>{loading ? 'Вход...' : 'Войти'}</button>
                        {error && <div className="login-err">{error}</div>}
                    </form>
                </div>
            );
        }

        // ─── App ───
        function App() {
            const [authed, setAuthed] = useState(!!sessionStorage.getItem('cms_token'));
            const [data, setData] = useState({ categories: {}, projects: [] });
            const [loading, setLoading] = useState(true);
            const [editing, setEditing] = useState(null);
            const [toast, setToast] = useState(null);
            const [tab, setTab] = useState('projects');
            const [settings, setSettings] = useState(null);
            const [analytics, setAnalytics] = useState(null);
            const [analyticsDays, setAnalyticsDays] = useState(30);
            const [search, setSearch] = useState('');
            const [catEdit, setCatEdit] = useState(false);
            const projDrag = useRef(null);
            const projDragOver = useRef(null);

            const showToast = (msg, ok = true) => { setToast({ msg, ok }); setTimeout(() => setToast(null), 2000); };

            const loadData = () => {
                apiFetch(`${API}/cases`).then(r => {
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    return r.json();
                }).then(d => { if (d) { setData(d); setLoading(false); } }).catch(() => setLoading(false));
            };

            const loadSettings = () => {
                apiFetch(`${API}/settings`).then(r => r.json()).then(s => setSettings(s)).catch(() => {});
            };

            const loadAnalytics = (days = analyticsDays) => {
                apiFetch(`${API}/analytics/summary?days=${days}`).then(r => {
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return null; }
                    return r.json();
                }).then(s => { if (s) setAnalytics(s); }).catch(() => {});
            };

            const saveSettings = async (s) => {
                try {
                    await apiFetch(`${API}/settings`, { method: 'POST', body: JSON.stringify(s) });
                    setSettings(s);
                    showToast('Настройки сохранены');
                } catch { showToast('Ошибка', false); }
            };

            useEffect(() => { if (authed) { loadData(); loadSettings(); loadAnalytics(); } }, [authed]);
            useEffect(() => { if (authed && tab === 'analytics') loadAnalytics(analyticsDays); }, [authed, tab, analyticsDays]);

            const save = async (newData) => {
                try {
                    const r = await apiFetch(`${API}/cases`, { method: 'POST', body: JSON.stringify(newData) });
                    if (r.status === 401) { sessionStorage.removeItem('cms_token'); setAuthed(false); return; }
                    const result = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(result.error || 'Save error');
                    setData(newData);
                    showToast(result.publicProjects !== undefined ? `Сохранено · в публикации ${result.publicProjects}` : 'Сохранено');
                } catch { showToast('Ошибка', false); }
            };

            const [showTemplates, setShowTemplates] = useState(false);

            // Category CRUD
            const addCategory = () => { const id='cat-'+Date.now(); const nd={...data,categories:{...data.categories,[id]:'Новая категория'}}; save(nd); };
            const renameCategory = (id,name) => { const nd={...data,categories:{...data.categories,[id]:name}}; save(nd); };
            const deleteCategory = (id) => { if(!confirm('Удалить категорию и все её проекты?')) return; const cats={...data.categories}; delete cats[id]; const nd={...data,categories:cats,projects:data.projects.filter(p=>p.categoryId!==id)}; save(nd); };

            // Export/Import
            const exportProject = (p) => { const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=p.id+'.json'; a.click(); URL.revokeObjectURL(url); showToast('Экспортировано'); };
            const importProject = (e) => { const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=(ev)=>{try{const p=JSON.parse(ev.target.result); p.id=p.id+'-'+Date.now(); save({...data,projects:[...data.projects,p]}); showToast('Импортировано: '+p.title);}catch{showToast('Ошибка JSON',false);}}; r.readAsText(file); };

            // Project drag sort
            const onProjDragStart = (i) => { projDrag.current = i; };
            const onProjDragEnter = (i) => { projDragOver.current = i; };
            const onProjDragEnd = () => { if(projDrag.current!==null && projDragOver.current!==null && projDrag.current!==projDragOver.current){ const p=[...data.projects]; const item=p.splice(projDrag.current,1)[0]; p.splice(projDragOver.current,0,item); save({...data,projects:p}); } projDrag.current=null; projDragOver.current=null; };

            const addProject = (template) => {
                const id = 'case-' + Date.now();
                const blocks = template ? JSON.parse(JSON.stringify(template.blocks)) : [];
                const proj = { id, title: 'Новый проект', categoryId: Object.keys(data.categories)[0] || 'development', logo: '', isExternal: false, status: 'draft', blocks };
                const nd = { ...data, projects: [...data.projects, proj] };
                save(nd);
                setEditing(id);
                setShowTemplates(false);
            };

            const duplicateProject = (p) => {
                const id = p.id + '-copy-' + Date.now();
                const copy = { ...JSON.parse(JSON.stringify(p)), id, title: p.title + ' (копия)' };
                const nd = { ...data, projects: [...data.projects, copy] };
                save(nd);
                showToast('Проект скопирован');
            };

            const deleteProject = async (id) => {
                if (!confirm('Удалить проект?')) return;
                const nd = { ...data, projects: data.projects.filter(p => p.id !== id) };
                await save(nd);
                if (editing === id) setEditing(null);
            };

            const logout = () => { sessionStorage.removeItem('cms_token'); setAuthed(false); };

            if (!authed) return <LoginScreen onLogin={() => setAuthed(true)} />;
            if (loading) return <div className="cms-wrap"><p>Загрузка...</p></div>;

            if (editing) {
                const proj = data.projects.find(p => p.id === editing);
                if (!proj) { setEditing(null); return null; }
                return <Editor project={proj} categories={data.categories} onSave={u => { save({ ...data, projects: data.projects.map(p => p.id === editing ? u : p) }); }} onDelete={() => deleteProject(editing)} onClose={() => setEditing(null)} />;
            }

            const projects = data.projects || [];
            const publishedProjects = projects.filter(p => p.status !== 'draft');
            const draftProjects = projects.filter(p => p.status === 'draft');
            const demoProjects = projects.filter(p => p.categoryId === 'demo' || /demo/i.test(p.id || ''));
            const publicCategoryIds = new Set(publishedProjects.map(p => p.categoryId).filter(Boolean));
            const publishWarnings = publishedProjects.flatMap(p => {
                const warnings = [];
                if (p.isExternal && !p.externalUrl) warnings.push(`${p.title}: нет внешней ссылки`);
                if (!p.isExternal && !(p.blocks || []).some(b => b.enabled !== false)) warnings.push(`${p.title}: нет включённых блоков`);
                return warnings;
            });

            return (
                <div className="cms-wrap">
                    <div className="cms-header">
                        <div className="cms-title">A.LAB CMS</div>
                        <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                            {tab === 'projects' && <><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" accept=".json" style={{display:'none'}} onChange={importProject}/>Импорт</label><button className="btn btn-white" onClick={()=>setShowTemplates(true)}>+ Новый кейс</button></>}
                            {tab === 'analytics' && <button className="btn btn-white btn-sm" onClick={()=>loadAnalytics(analyticsDays)}>Обновить</button>}
                            <button className="btn-ghost" onClick={logout}>Выйти</button>
                        </div>
                    </div>
                    <div className="tabs">
                        <div className={`tab ${tab==='projects'?'active':''}`} onClick={()=>setTab('projects')}>Проекты</div>
                        <div className={`tab ${tab==='analytics'?'active':''}`} onClick={()=>setTab('analytics')}>Статистика</div>
                        <div className={`tab ${tab==='settings'?'active':''}`} onClick={()=>setTab('settings')}>Настройки сайта</div>
                    </div>
                    {tab === 'settings' && settings && <SettingsTab settings={settings} onSave={saveSettings} />}
                    {tab === 'analytics' && <AnalyticsTab analytics={analytics} days={analyticsDays} onDaysChange={setAnalyticsDays} onRefresh={()=>loadAnalytics(analyticsDays)} />}
                    {tab === 'projects' && <>
                        <div className="publish-panel">
                            <div className="publish-panel-head">
                                <div className="publish-copy">
                                    <div className="publish-title">Публикация</div>
                                    <div className="publish-note">На сайт попадают только опубликованные проекты.</div>
                                </div>
                                <div className="publish-stats">
                                    <div className="publish-stat"><span className="publish-stat-value">{publishedProjects.length}</span><span className="publish-stat-label">на сайте</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{draftProjects.length}</span><span className="publish-stat-label">черновик</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{publicCategoryIds.size}</span><span className="publish-stat-label">категории</span></div>
                                    <div className="publish-stat"><span className="publish-stat-value">{demoProjects.length}</span><span className="publish-stat-label">demo</span></div>
                                </div>
                            </div>
                            <a href="http://localhost:5173/#portfolio" target="_blank" className="btn btn-dark btn-sm" style={{textDecoration:'none',whiteSpace:'nowrap'}}>Открыть сайт</a>
                            {publishWarnings.length ? <div className="publish-warnings">{publishWarnings.slice(0,5).map((w,i)=><div className="publish-warning" key={i}>⚠ {w}</div>)}</div> : null}
                        </div>
                        <div style={{display:'flex',gap:'0.75rem',marginBottom:'1.5rem',alignItems:'center'}}>
                            <input className="input" style={{maxWidth:300}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Поиск по проектам..."/>
                            <button className={`btn btn-sm ${catEdit?'btn-blue':'btn-dark'}`} onClick={()=>setCatEdit(!catEdit)}>{catEdit?'Готово':'Категории'}</button>
                        </div>
                        {catEdit && <div className="settings-section" style={{marginBottom:'1.5rem'}}>
                            <div className="settings-title">Управление категориями</div>
                            {Object.entries(data.categories).map(([id,name])=><div key={id} style={{display:'flex',gap:'0.5rem',alignItems:'center',marginBottom:'0.5rem'}}>
                                <input className="input" style={{flex:1}} value={name} onChange={e=>renameCategory(id,e.target.value)}/>
                                <span style={{fontSize:'0.7rem',color:'#555'}}>{data.projects.filter(p=>p.categoryId===id).length} проектов</span>
                                <button className="btn btn-red btn-sm" onClick={()=>deleteCategory(id)}>✕</button>
                            </div>)}
                            <button className="btn btn-dark btn-sm" onClick={addCategory}>+ Добавить категорию</button>
                        </div>}
                        {!data.projects.length && <div className="empty-state"><h2>Нет проектов</h2><p>Нажмите «+ Новый кейс»</p></div>}
                        {Object.keys(data.categories).map(cid => {
                            const projs = data.projects.filter(p => p.categoryId === cid).filter(p => !search || p.title.toLowerCase().includes(search.toLowerCase()) || p.id.toLowerCase().includes(search.toLowerCase()));
                            if (!projs.length) return null;
                            return (
                                <div key={cid} className="cat-section" data-category={cid}>
                                    <div className="cat-label">{data.categories[cid]}</div>
                                    <div className="proj-grid">
                                        {projs.map(p => (
                                            <div key={p.id} className="proj-card" data-category={p.categoryId} onClick={() => setEditing(p.id)}
                                                draggable onDragStart={()=>onProjDragStart(data.projects.indexOf(p))} onDragEnter={()=>onProjDragEnter(data.projects.indexOf(p))} onDragEnd={onProjDragEnd} onDragOver={e=>e.preventDefault()}>

                            );

                    {showTemplates && <div className="modal-overlay" onClick={()=>setShowTemplates(false)}><div className="modal-box" onClick={e=>e.stopPropagation()}>

        // ─── CardPreview ───

            const shadowHover = `0 ${sz}px ${sz*2}px rgba(0,0,0,${(Math.min(op*1.5,100)/100).toFixed(2)})`;
            const demos = [
                {title:'Проект 1', cat:'Брендинг', img:'https://images.unsplash.com/photo-1545239351-ef35f43d514b?w=400&h=300&fit=crop'},

            if (!seconds) return '0 сек';
            if (seconds < 60) return `${seconds} сек`;
            const minutes = Math.floor(seconds / 60);
            const rest = seconds % 60;
            return rest ? `${minutes} мин ${rest} сек` : `${minutes} мин`;
        }

        // ─── Settings Tab ───
        function SettingsTab({ settings, onSave }) {
            const [s, setS] = useState(JSON.parse(JSON.stringify(settings)));
            const [uploading, setUploading] = useState(null);
            const audioRefs = useRef({});

            const LETTERS = [
                { id: 'a-dot', char: 'a.', desc: 'Вибрация / Deep Bass', fallback: 'vibration' },
                { id: 'l', char: 'l', desc: 'Глитч / Scramble', fallback: 'glitch' },
                { id: 'a', char: 'a', desc: 'Стекло / Bell', fallback: 'glass' },
                { id: 'b', char: 'b', desc: 'Прожектор / Pad', fallback: 'spotlight' }
            ];

            const ensure = () => {
                if (!s.audio) s.audio = {};
                if (!s.audio.letters) s.audio.letters = LETTERS.map((l,i) => ({ id: l.id, label: l.char, index: i, audioFile: null, fallback: l.fallback }));
                if (s.audio.enabled === undefined) s.audio.enabled = false;
                if (s.audio.masterVolume === undefined) s.audio.masterVolume = 0.35;
                return s;
            };

            const getLetter = (id) => {
                ensure();
                return s.audio.letters.find(l => l.id === id) || { audioFile: null };
            };

            const setLetterAudio = (id, audioFile) => {
                ensure();
                const letters = s.audio.letters.map(l => l.id === id ? { ...l, audioFile } : l);
                setS({ ...s, audio: { ...s.audio, letters } });
            };

            const setAudioEnabled = (enabled) => {
                ensure();
                setS({ ...s, audio: { ...s.audio, enabled } });
            };

            const handleUpload = async (e, letterId) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(letterId);
                const fd = new FormData();
                fd.append('audio', file);
                try {
                    const r = await fetch(`${API}/upload-audio`, { method: 'POST', body: fd, headers: { 'X-CMS-Token': sessionStorage.getItem('cms_token') || '' } });
                    const j = await r.json();
                    if (j.path) setLetterAudio(letterId, j.path);
                } catch(e) { console.error(e); }
                setUploading(null);
            };

            const stopPreviews = () => {
                Object.values(audioRefs.current).forEach(a => { a.pause(); a.currentTime = 0; });
                audioRefs.current = {};
            };

            useEffect(() => {
                const stopOnHidden = () => { if (document.hidden) stopPreviews(); };
                document.addEventListener('visibilitychange', stopOnHidden);
                window.addEventListener('pagehide', stopPreviews);
                window.addEventListener('blur', stopPreviews);

                return () => {
                    document.removeEventListener('visibilitychange', stopOnHidden);
                    window.removeEventListener('pagehide', stopPreviews);
                    window.removeEventListener('blur', stopPreviews);
                    stopPreviews();
                };
            }, []);

            const playPreview = (audioFile) => {
                stopPreviews();
                if (audioFile) {
                    const audio = new Audio(audioFile);
                    audio.volume = s.audio?.masterVolume || 0.35;
                    audioRefs.current[audioFile] = audio;
                    audio.play().catch(() => {});
                }
            };

            return (
                <div>
                    <div className="settings-section">
                        <div className="settings-title">🔊 Аудио для букв логотипа</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Управляет звуками на публичном сайте. Можно выключить сейчас, а файлы подобрать и назначить позже.</p>
                        <label style={{display:'flex',alignItems:'center',gap:'0.65rem',fontSize:'0.9rem',fontWeight:700,marginBottom:'1rem',cursor:'pointer'}}>
                            <input type="checkbox" checked={s.audio?.enabled !== false} onChange={e => setAudioEnabled(e.target.checked)} style={{accentColor:'#1d1d1f',width:18,height:18}} />
                            Звук на сайте включён
                        </label>
                        <div style={{marginBottom:'1rem',display:'flex',alignItems:'center',gap:'1rem'}}>
                            <span style={{fontSize:'0.8rem',color:'#888'}}>Общая громкость:</span>
                            <input type="range" className="volume-slider" min="0" max="1" step="0.05" value={s.audio?.masterVolume||0.35} onChange={e => setS({...s, audio:{...s.audio, masterVolume: parseFloat(e.target.value)}})} style={{width:120}} />
                            <span style={{fontSize:'0.75rem',color:'#555'}}>{Math.round((s.audio?.masterVolume||0.35)*100)}%</span>
                        </div>
                        {LETTERS.map(letter => {
                            const data = getLetter(letter.id);
                            const hasFile = !!data.audioFile;
                            return (
                                <div key={letter.id} className="audio-letter">
                                    <div className="audio-letter-char">{letter.char}</div>
                                    <div className="audio-letter-info">
                                        <div className="audio-letter-label">{letter.desc}</div>
                                        {hasFile ? (
                                            <div className="audio-letter-file">{data.audioFile.split('/').pop()}</div>
                                        ) : (
                                            <div style={{fontSize:'0.78rem',color:'#555',fontStyle:'italic'}}>Процедурный синтез ({letter.fallback})</div>
                                        )}
                                    </div>
                                    <div className="audio-letter-actions">
                                        {hasFile && <button className="btn btn-dark btn-sm" onClick={() => playPreview(data.audioFile)}>▶</button>}
                                        {hasFile && <button className="btn btn-dark btn-sm" style={{color:'#e74c3c'}} onClick={() => setLetterAudio(letter.id, null)}>✕</button>}
                                        <label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}>
                                            <input type="file" accept="audio/*" style={{display:'none'}} onChange={e => handleUpload(e, letter.id)} />
                                            {uploading === letter.id ? '...' : (hasFile ? 'Заменить' : 'Загрузить')}
                                        </label>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="settings-section">
                        <div className="settings-title">🎨 Figma интеграция</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'0.7rem'}}>Вставляйте URL из Figma — изображения импортируются автоматически. Работает с приватными файлами.</p>
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>
                            <span style={{fontSize:'0.75rem',color:'#888',whiteSpace:'nowrap'}}>Personal Access Token:</span>
                            <input className="input" type="password" style={{flex:1}} value={s.figmaToken||''} onChange={e=>setS({...s, figmaToken: e.target.value})} placeholder="figd_..."/>
                        </div>
                        <p style={{fontSize:'0.7rem',color:'#555',marginTop:'0.4rem'}}>Создайте токен: Figma → Settings → Personal Access Tokens. Нужен доступ к файлам, из которых импортируете.</p>
                    </div>

                    <div className="settings-section">
                        <div className="settings-title">🃏 Внешний вид карточек</div>
                        <p style={{fontSize:'0.8rem',color:'#666',marginBottom:'1rem'}}>Скругление углов и тени для карточек проектов на главной странице.</p>
                        <div style={{display:'flex',gap:'2rem',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Скругление (px)</label>
                                <input className="input" type="number" style={{width:100}} min="0" max="60" value={s.cards?.borderRadius ?? 12} onChange={e=>setS({...s, cards:{...s.cards, borderRadius: parseInt(e.target.value)||0}})}/>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Размер тени</label>
                                <input type="range" min="0" max="50" value={s.cards?.shadowSize ?? 10} onChange={e=>setS({...s, cards:{...s.cards, shadowSize: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowSize ?? 10}px</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Прозрачность тени</label>
                                <input type="range" min="0" max="100" value={s.cards?.shadowOpacity ?? 15} onChange={e=>setS({...s, cards:{...s.cards, shadowOpacity: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{s.cards?.shadowOpacity ?? 15}%</span>
                            </div>
                            <div>
                                <label style={{fontSize:'0.75rem',color:'#888',display:'block',marginBottom:'0.3rem'}}>Масштаб при наведении</label>
                                <input type="range" min="100" max="110" step="1" value={s.cards?.hoverScale ?? 103} onChange={e=>setS({...s, cards:{...s.cards, hoverScale: parseInt(e.target.value)}})} style={{width:150}}/>
                                <span style={{fontSize:'0.72rem',color:'#555',marginLeft:'0.5rem'}}>{(s.cards?.hoverScale ?? 103)/100}x</span>
                            </div>
                        </div>
                        <div style={{fontSize:'0.75rem',color:'var(--cms-muted)',fontWeight:600,marginBottom:'0.5rem'}}>Предпросмотр</div>
                        <CardPreview cards={s.cards || {}}/>
                    </div>

                    <button className="btn btn-white" onClick={() => onSave(s)}>Сохранить настройки</button>
                </div>
            );
        }

        // ─── Editor ───
        function Editor({ project, categories, onSave, onDelete, onClose }) {
            const [proj, setProj, history] = useHistory({ ...project });
            const [uploading, setUploading] = useState(false);
            const [dirty, setDirty] = useState(false);
            const [saving, setSaving] = useState(false);
            const [previewMode, setPreviewMode] = useState('desktop');
            const [previewFullscreen, setPreviewFullscreen] = useState(false);
            const [previewSeed, setPreviewSeed] = useState(0);
            const dragItem = useRef(null);
            const dragOver = useRef(null);
            const autoSaveTimer = useRef(null);

            const update = (k, v) => { setProj(p => ({ ...p, [k]: v })); setDirty(true); };
            const updateBlock = (i, k, v) => { const b = [...proj.blocks]; b[i] = { ...b[i], [k]: v }; update('blocks', b); };
            const addBlock = (type) => {
                const defs = { heading:{level:'h2',content:''}, text:{content:''}, image:{content:'',caption:''}, video:{content:''}, gallery:{images:[]}, links:{title:'Материалы проекта',layout:'cards',items:[{platform:'website',label:'Сайт проекта',url:''}]}, spacer:{height:80}, raw_html:{content:''}, columns:{cols:[{text:'',image:''},{text:'',image:''}]}, compare:{before:'',after:''}, quote:{text:'',author:'',role:'',photo:''}, metrics:{items:[{value:'',label:''},{value:'',label:''},{value:'',label:''}]} };
                update('blocks', [...(proj.blocks||[]), { type, ...defs[type] }]);
            };
            const removeBlock = (i) => { const b = [...proj.blocks]; b.splice(i,1); update('blocks', b); };
            const moveBlock = (i, d) => { const b = [...proj.blocks]; const t = i+d; if(t<0||t>=b.length) return; [b[i],b[t]]=[b[t],b[i]]; update('blocks', b); };

            // Drag & Drop
            const onDragStart = (i) => { dragItem.current = i; };
            const onDragEnter = (i) => { dragOver.current = i; };
            const onDragEnd = () => {
                if (dragItem.current !== null && dragOver.current !== null && dragItem.current !== dragOver.current) {
                    const b = [...proj.blocks];
                    const item = b.splice(dragItem.current, 1)[0];
                    b.splice(dragOver.current, 0, item);
                    update('blocks', b);
                }
                dragItem.current = null; dragOver.current = null;
            };

            // Autosave (30 sec)
            useEffect(() => {
                if (dirty) {
                    clearTimeout(autoSaveTimer.current);
                    autoSaveTimer.current = setTimeout(() => {
                        setSaving(true);
                        onSave(proj);
                        setDirty(false);
                        setSaving(false);
                    }, 30000);
                }
                return () => clearTimeout(autoSaveTimer.current);
            }, [proj, dirty]);

            // Hotkeys
            useEffect(() => {
                const handler = (e) => {
                    if (previewFullscreen && e.key === 'Escape') { e.preventDefault(); setPreviewFullscreen(false); return; }
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); onSave(proj); setDirty(false); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); history.undo(); }
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); history.redo(); }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [proj, history, previewFullscreen]);

            useEffect(() => {
                document.body.classList.toggle('preview-fullscreen-open', previewFullscreen);
                return () => document.body.classList.remove('preview-fullscreen-open');
            }, [previewFullscreen]);

            const restartPreview = () => setPreviewSeed(Date.now());
            const handleUpload = async (e, cb) => {
                const file = e.target.files[0]; if (!file) return;
                setUploading(true);
                const fd = new FormData(); fd.append('caseId', proj.id); fd.append('media', file);
                try { const r = await fetch(`${API}/upload`, { method:'POST', body:fd, headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''} }); const j = await r.json(); if(j.path) cb(j.path); } catch(e) { console.error(e); }
                setUploading(false);
            };

            return (
                <div className="cms-wrap">
                    <div className="editor-top">
                        <div style={{display:'flex',gap:'0.5rem',alignItems:'center'}}>

                        <div className="live-preview">
