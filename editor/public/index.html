	                </div>
	            );
        }


        // ─── RichToolbar — works with selected text via execCommand ───
        function RichToolbar({ editorRef, block, index, updateBlock }) {
            const syncContent = () => {
                window.setTimeout(() => {
                    if (editorRef.current) updateBlock(index, 'content', editorRef.current.innerHTML);
                }, 0);
            };
            const exec = (cmd, val) => {
                if (editorRef.current) editorRef.current.focus();
                document.execCommand(cmd, false, val || null);
                syncContent();
            };
            const makeLink = () => {
                if (!editorRef.current) return;
                editorRef.current.focus();
                const selection = window.getSelection();
                const savedRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
                const selectedText = selection ? selection.toString().trim() : '';
                const raw = window.prompt('Ссылка: Behance, Telegram, сайт, PDF...', selectedText && selectedText.includes('.') ? selectedText : '');
                const href = normalizeLinkUrl(raw);
                if (!href) return;
                if (savedRange && selection) {
                    selection.removeAllRanges();
                    selection.addRange(savedRange);
                }
                if (selectedText) {
                    document.execCommand('createLink', false, href);
                    window.setTimeout(() => {
                        if (!editorRef.current) return;
                        editorRef.current.querySelectorAll('a').forEach(a => {
                            a.setAttribute('target', '_blank');
                            a.setAttribute('rel', 'noopener noreferrer');
                        });
                        syncContent();
                    }, 0);
                } else {
                    document.execCommand('insertHTML', false, `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(displayLinkUrl(href))}</a>`);
                    syncContent();
                }
            };
            const removeLink = () => {
                exec('unlink');
            };
            const s = block.style || {};
            const upS = (k, v) => updateBlock(index, 'style', { ...s, [k]: v });

            return (
                <div className="style-bar">
                    <div className="sb-group">
                        <button onMouseDown={e=>{e.preventDefault();exec('bold')}} title="Жирный"><b>Ж</b></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('italic')}} title="Курсив"><i>К</i></button>
                        <button onMouseDown={e=>{e.preventDefault();exec('underline')}} title="Подчёркнутый"><u>П</u></button>
                        <button onMouseDown={e=>{e.preventDefault();makeLink()}} title="Сделать ссылкой">↗</button>
                        <button onMouseDown={e=>{e.preventDefault();removeLink()}} title="Убрать ссылку">×</button>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Цвет</span>
                        <input type="color" value="#1d1d1f" onChange={e=>{exec('foreColor',e.target.value)}}/>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Размер</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{
                            if(!e.target.value) return;
                            exec('fontSize', 7);
                            setTimeout(()=>{
                                const el = editorRef.current;
                                if(el) el.querySelectorAll('font[size="7"]').forEach(n=>{n.removeAttribute('size');n.style.fontSize=e.target.value;});
                                syncContent();
                            },0);
                        }}>
                            <option value="">—</option>
                            <option value="0.8rem">Мелкий</option>
                            <option value="1rem">Обычный</option>
                            <option value="1.3rem">Средний</option>
                            <option value="1.6rem">Крупный</option>
                            <option value="2rem">Большой</option>
                            <option value="3rem">Огромный</option>
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Шрифт</span>
                        <select defaultValue="" onMouseDown={e=>e.stopPropagation()} onChange={e=>{if(e.target.value)exec('fontName',e.target.value)}}>
                            <option value="">—</option>
                            {FONT_OPTIONS.map(fo=><option key={fo.id} value={fo.id}>{fo.label}</option>)}
                        </select>
                    </div>
                    <div className="sb-group">
                        <span className="sb-label">Анимация</span>
                        <select value={s.animation||'none'} onChange={e=>upS('animation',e.target.value)}>
                            {ANIM_OPTIONS.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        // ─── RichEditor — contentEditable with toolbar ───
        function RichEditor({ block, index, updateBlock, placeholder }) {
            const ref = useRef(null);
            const lastHtml = useRef(block.content || '');

            useEffect(() => {
                if (ref.current && ref.current.innerHTML !== (block.content||'')) {
                    ref.current.innerHTML = block.content || '';
                }
            }, []);

            const onInput = () => {
                if (ref.current) {
                    lastHtml.current = ref.current.innerHTML;
                    updateBlock(index, 'content', ref.current.innerHTML);
                }
            };

            return (
                <div>
                    <RichToolbar editorRef={ref} block={block} index={index} updateBlock={updateBlock}/>
                    <div ref={ref} contentEditable className="rich-editor" onInput={onInput}
                         data-placeholder={placeholder || 'Введите текст...'}
                         style={{minHeight: 80}}/>
                </div>
            );
        }

        // ─── LivePreview ───
        function LivePreview({ blocks, title, mode = 'desktop', seed = 0, fullscreen = false }) {
            const isMobile = mode === 'mobile';
            const ref = useRef(null);
            const iframeRef = useRef(null);
            const [scale, setScale] = useState(0.3);
            const viewportW = isMobile ? 390 : 1440;

            useEffect(() => {
                const updateScale = () => {
                    if (!ref.current) return;
                    const parent = ref.current.parentElement;
                    const w = parent?.clientWidth || ref.current.clientWidth || viewportW;
                    const next = Math.min(w / viewportW, fullscreen ? 1 : 0.48);
                    setScale(next);
                };
                updateScale();
                window.addEventListener('resize', updateScale);
                return () => window.removeEventListener('resize', updateScale);
            }, [viewportW, fullscreen]);

            const viewportH = fullscreen
                ? Math.max(560, Math.round(((window.innerHeight || 900) - 112) / Math.max(scale, 0.1)))
                : (isMobile ? 812 : 900);
            const animationKey = (blocks||[])
                .map((block, index) => `${index}:${block?.type || ''}:${block?.style?.animation || 'none'}`)
                .join('|');

            const html = (blocks||[]).filter(b => b.enabled !== false).map((b, index) => {
                const animation = previewAnimation(b);
                switch(b.type) {
                    case 'heading':
                        return wrapPreviewBlock(b, `<${b.level||'h2'} style="font-family:'Unbounded',sans-serif;font-weight:700;margin:1rem 5%;line-height:1.12;letter-spacing:-0.04em">${renderPreviewAnimatedText(b.content, animation)}</${b.level||'h2'}>`, index);
                    case 'text':
                        return wrapPreviewBlock(b, `<p style="font-family:'Roboto',sans-serif;margin:1rem 5%;line-height:1.6;font-size:1.1rem">${renderPreviewAnimatedText(b.content, animation)}</p>`, index);
                    case 'image': return b.content ? wrapPreviewBlock(b, `<div style="margin:1rem 5%"><img src="${escapeAttr(b.content)}" style="max-width:100%;border-radius:18px;${b.clipPath&&b.clipPath!=='none'?'clip-path:'+b.clipPath:''}" /></div>`, index) : '';
                    case 'video': return b.content ? wrapPreviewBlock(b, `<div style="margin:1rem 5%"><video src="${escapeAttr(b.content)}" autoplay muted loop playsinline style="width:100%;border-radius:18px"></video></div>`, index) : '';
                    case 'gallery': return wrapPreviewBlock(b, `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0.7rem;margin:1rem 5%">${(b.images||[]).map(s=>`<img src="${escapeAttr(s)}" style="width:100%;border-radius:12px"/>`).join('')}</div>`, index);
                    case 'links': return wrapPreviewBlock(b, renderPreviewLinks(b), index);
                    case 'spacer': return `<div style="height:${b.height||80}px"></div>`;
                    case 'raw_html': return b.content || '';
                    case 'masked_image': return b.content ? wrapPreviewBlock(b, `<div style="margin:1rem 5%;text-align:center"><img src="${escapeAttr(b.content)}" style="max-width:100%;${b.clipPath&&b.clipPath!=='none'?'clip-path:'+b.clipPath:''}" /></div>`, index) : '';
                    case 'columns': return wrapPreviewBlock(b, renderPreviewColumns(b), index);
                    case 'compare': return (b.before&&b.after)?wrapPreviewBlock(b, `<div style="position:relative;margin:1.5rem 5%;overflow:hidden;border-radius:18px"><img src="${escapeAttr(b.after)}" style="width:100%;display:block"/><div style="position:absolute;inset:0;width:50%;overflow:hidden"><img src="${escapeAttr(b.before)}" style="width:200%;max-width:none;display:block"/></div><div style="position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff"></div><span style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:0.7rem">ДО</span><span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;padding:2px 8px;border-radius:4px;font-size:0.7rem">ПОСЛЕ</span></div>`, index):'';
                    case 'quote': return wrapPreviewBlock(b, `<blockquote style="margin:2rem 5%;padding:1.5rem 2rem;border-left:4px solid #6b6b6b;background:#f0f0f2;border-radius:0 18px 18px 0"><p style="font-family:'Roboto',sans-serif;font-size:1.1rem;font-style:italic;line-height:1.6;margin-bottom:0.75rem">${escapeHtml(b.text||'')}</p><div style="display:flex;align-items:center;gap:0.75rem">${b.photo?`<img src="${escapeAttr(b.photo)}" style="width:40px;height:40px;border-radius:50%;object-fit:cover"/>`:''}<div><strong>${escapeHtml(b.author||'')}</strong>${b.role?`<br><span style="font-size:0.85rem;color:#666">${escapeHtml(b.role)}</span>`:''}</div></div></blockquote>`, index);
                    case 'metrics': return wrapPreviewBlock(b, `<div style="display:flex;gap:2rem;justify-content:center;flex-wrap:wrap;margin:2rem 5%;padding:2rem;background:#fff;border-radius:18px">${(b.items||[]).map(m=>`<div style="text-align:center;min-width:100px"><div style="font-family:'Unbounded',sans-serif;font-size:2rem;font-weight:700;color:#6b6b6b">${escapeHtml(m.value||'')}</div><div style="font-size:0.85rem;color:#666;margin-top:0.3rem">${escapeHtml(m.label||'')}</div></div>`).join('')}</div>`, index);
                    default: return '';
                }
            }).join('\n');

            const srcDoc = `<!DOCTYPE html><html><head><base href="${window.location.origin}/"/><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}${PREVIEW_ANIMATION_CSS}</style></head><body>${html||`<div style="padding:8rem 5%;text-align:center;color:#999"><p>Добавьте блоки</p></div>`}<script>${PREVIEW_ANIMATION_SCRIPT}<\/script></body></html>`;

            return (
                <div className="live-preview-frame" ref={ref} style={{height: viewportH * scale}}>
                    <iframe
                        key={`${mode}-${fullscreen ? 'full' : 'panel'}-${seed}-${animationKey}`}
                        ref={iframeRef}
                        srcDoc={srcDoc}
                        style={{transform:`scale(${scale})`, width: viewportW, height: viewportH, transformOrigin:'top left'}}
                    />
                </div>
            );
        }

        // ─── BlockEditor ───
        function BlockEditor({ block, index, projId, updateBlock, handleUpload }) {
            if (block.type === 'heading') return (<><div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>{['h1','h2','h3','h4'].map(l=><button key={l} className={`btn btn-sm ${block.level===l?'btn-blue':'btn-dark'}`} onClick={()=>updateBlock(index,'level',l)}>{l.toUpperCase()}</button>)}</div><RichEditor block={block} index={index} updateBlock={updateBlock} placeholder="Введите заголовок"/></>);
            if (block.type === 'text') return <RichEditor block={block} index={index} updateBlock={updateBlock} placeholder="Введите текст..."/>;
            if (block.type === 'image') return (<><div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}><input className="input" style={{flex:1,minWidth:200}} value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка или Figma URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Загрузить</label></div>{block.content && <img src={block.content} alt="" style={{maxWidth:'100%',maxHeight:200,marginTop:'0.5rem',borderRadius:6,objectFit:'contain',background:'#fff'}}/>}</>);
            if (block.type === 'video') return (<div style={{display:'flex',gap:'0.5rem'}}><input className="input" value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка на видео"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}><input type="file" style={{display:'none'}} accept="video/*" onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Загрузить</label></div>);
            if (block.type === 'gallery') { const imgs=block.images||[]; return (<><div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem',marginBottom:'0.5rem'}}>{imgs.map((img,gi)=><div key={gi} style={{position:'relative',width:80,height:80}}><img src={img} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:4}}/><button onClick={()=>{const n=[...imgs];n.splice(gi,1);updateBlock(index,'images',n);}} style={{position:'absolute',top:-4,right:-4,background:'#c0392b',color:'#fff',border:'none',borderRadius:'50%',width:18,height:18,fontSize:'0.6rem',cursor:'pointer',lineHeight:'18px'}}>✕</button></div>)}</div><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} multiple onChange={e=>{Array.from(e.target.files).forEach(file=>{const fd=new FormData();fd.append('caseId',projId);fd.append('media',file);fetch(`${API}/upload`,{method:'POST',body:fd,headers:{'X-CMS-Token':sessionStorage.getItem('cms_token')||''}}).then(r=>r.json()).then(j=>{if(j.path)updateBlock(index,'images',[...(block.images||[]),j.path]);});});}}/>+ Изображения</label></>); }
            if (block.type === 'links') {
                const items = block.items || [];
                const updateItem = (itemIndex, key, value) => {
                    const next = [...items];
                    next[itemIndex] = { ...next[itemIndex], [key]: value };
                    updateBlock(index, 'items', next);
                };
                const addLink = () => updateBlock(index, 'items', [...items, { platform:'website', label:'', url:'' }]);
                const removeLink = (itemIndex) => updateBlock(index, 'items', items.filter((_, i) => i !== itemIndex));
                return (
                    <div className="link-block-editor">
                        <div className="link-editor-head">
                            <input className="input" value={block.title||''} onChange={e=>updateBlock(index,'title',e.target.value)} placeholder="Заголовок блока: Материалы проекта"/>
                            <div style={{display:'flex',gap:'0.35rem'}}>
                                <button className={`btn btn-sm ${block.layout!=='inline'?'btn-white':'btn-dark'}`} onClick={()=>updateBlock(index,'layout','cards')}>Плашки</button>
                                <button className={`btn btn-sm ${block.layout==='inline'?'btn-white':'btn-dark'}`} onClick={()=>updateBlock(index,'layout','inline')}>Строка</button>
                            </div>
                        </div>
                        <div className="link-editor-note">Можно добавлять Behance, Telegram, WhatsApp, сайт, PDF или любой внешний материал. Если вставить адрес без https, редактор сам добавит его при показе.</div>
                        {items.map((item, li) => (
                            <div className="link-editor-row" key={li}>
                                <select className="input" value={item.platform||'website'} onChange={e=>updateItem(li,'platform',e.target.value)}>
                                    {LINK_PLATFORMS.map(platform => <option key={platform.id} value={platform.id}>{platform.label}</option>)}
                                </select>
                                <input className="input" value={item.label||''} onChange={e=>updateItem(li,'label',e.target.value)} placeholder={getLinkPlatform(item.platform).label}/>
                                <input className="input" value={item.url||''} onChange={e=>updateItem(li,'url',e.target.value)} placeholder="https://..."/>
                                <button className="btn btn-dark btn-sm" onClick={()=>removeLink(li)}>Удалить</button>
                            </div>
                        ))}
                        <button className="btn btn-dark btn-sm" onClick={addLink} style={{alignSelf:'flex-start'}}>+ Добавить ссылку</button>
                    </div>
                );
            }
            if (block.type === 'spacer') return (<div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}><span style={{fontSize:'0.8rem',color:'#666'}}>Высота:</span><input className="input" type="number" style={{width:100}} value={block.height||80} onChange={e=>updateBlock(index,'height',parseInt(e.target.value)||40)}/><span style={{fontSize:'0.75rem',color:'#555'}}>px</span></div>);
            if (block.type === 'raw_html') return <textarea className="input" style={{fontFamily:'monospace',fontSize:'0.78rem',minHeight:120}} value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="HTML-код..."/>;
            if (block.type === 'masked_image') {
                const cp = block.clipPath || 'none';
                const activeClass = (preset) => preset.clip === cp ? 'btn-blue' : 'btn-dark';
                return (
                    <div>
                        <div style={{display:'flex',gap:'0.5rem',marginBottom:'0.5rem'}}>
                            <input className="input" value={block.content||''} onChange={e=>updateBlock(index,'content',e.target.value)} placeholder="Ссылка на изображение"/>
                            <label className="btn btn-dark btn-sm" style={{cursor:'pointer',whiteSpace:'nowrap'}}>
                                <input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'content',p))}/>Файл
                            </label>
                        </div>
                        <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap',marginBottom:'0.5rem'}}>
                            {MASK_PRESETS.map(m => (
                                <button key={m.id} className={'btn btn-sm ' + activeClass(m)} onClick={()=>updateBlock(index,'clipPath',m.clip)}>{m.label}</button>
                            ))}
                        </div>
                        {block.content ? <div style={{background:'var(--cms-surface-soft)',borderRadius:8,padding:'1rem',textAlign:'center'}}><img src={block.content} alt="" style={{maxWidth:'100%',maxHeight:300,objectFit:'contain',clipPath:cp,transition:'clip-path 0.3s'}}/></div> : null}
                    </div>
                );
            }
            if (block.type === 'columns') {
                const cols = block.cols || [{text:'',image:''},{text:'',image:''}];
                const colCount = cols.length;
                return (<div>
                    <div className="columns-editor-toolbar">{[2,3].map(n=><button key={n} className={`btn btn-sm ${colCount===n?'btn-blue':'btn-dark'}`} onClick={()=>{const nc=[...cols];while(nc.length<n)nc.push({text:'',image:''});updateBlock(index,'cols',nc.slice(0,n))}}>{n} колонки</button>)}</div>
                    <div className="columns-editor-grid" style={{gridTemplateColumns:`repeat(${colCount},minmax(0,1fr))`}}>{cols.map((col,ci)=><div key={ci} className="column-editor-card">
                        <div className="column-editor-media-row"><input className="input" value={col.image||''} onChange={e=>{const nc=[...cols];nc[ci]={...nc[ci],image:e.target.value};updateBlock(index,'cols',nc)}} placeholder="URL изображения"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>{const nc=[...cols];nc[ci]={...nc[ci],image:p};updateBlock(index,'cols',nc)})}/>Файл</label></div>
                        {col.image ? <img className="column-editor-preview" src={col.image} alt=""/> : <div className="column-editor-placeholder">изображение карточки</div>}
                        <textarea className="input" value={col.text||''} onChange={e=>{const nc=[...cols];nc[ci]={...nc[ci],text:e.target.value};updateBlock(index,'cols',nc)}} placeholder={'Заголовок\\nОписание карточки'}/>
                    </div>)}</div>
                </div>);
            }
            if (block.type === 'compare') return (<div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.5rem'}}>
                    <div><label className="field-label">До</label><div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.before||''} onChange={e=>updateBlock(index,'before',e.target.value)} placeholder="URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'before',p))}/>📷</label></div>{block.before&&<img src={block.before} alt="" style={{width:'100%',height:80,objectFit:'cover',borderRadius:4,marginTop:'0.3rem'}}/>}</div>
                    <div><label className="field-label">После</label><div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.after||''} onChange={e=>updateBlock(index,'after',e.target.value)} placeholder="URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'after',p))}/>📷</label></div>{block.after&&<img src={block.after} alt="" style={{width:'100%',height:80,objectFit:'cover',borderRadius:4,marginTop:'0.3rem'}}/>}</div>
                </div>
            </div>);
            if (block.type === 'quote') return (<div style={{display:'flex',flexDirection:'column',gap:'0.5rem'}}>
                <textarea className="input" value={block.text||''} onChange={e=>updateBlock(index,'text',e.target.value)} placeholder="Текст цитаты..." style={{minHeight:60,fontStyle:'italic'}}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0.5rem'}}>
                    <input className="input" value={block.author||''} onChange={e=>updateBlock(index,'author',e.target.value)} placeholder="Имя автора"/>
                    <input className="input" value={block.role||''} onChange={e=>updateBlock(index,'role',e.target.value)} placeholder="Должность"/>
                    <div style={{display:'flex',gap:'0.3rem'}}><input className="input" value={block.photo||''} onChange={e=>updateBlock(index,'photo',e.target.value)} placeholder="Фото URL"/><label className="btn btn-dark btn-sm" style={{cursor:'pointer'}}><input type="file" style={{display:'none'}} onChange={e=>handleUpload(e,p=>updateBlock(index,'photo',p))}/>📷</label></div>
                </div>
            </div>);
            if (block.type === 'metrics') {
                const items = block.items || [{value:'',label:''},{value:'',label:''},{value:'',label:''}];
                return (<div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:'0.5rem'}}>{items.map((m,mi)=><div key={mi} style={{background:'var(--cms-surface-soft)',borderRadius:6,padding:'0.5rem',minWidth:120,flex:1}}>
                        <input className="input" style={{fontWeight:700,fontSize:'1.1rem',textAlign:'center',marginBottom:'0.3rem'}} value={m.value||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],value:e.target.value};updateBlock(index,'items',ni)}} placeholder="240%"/>
                        <input className="input" style={{fontSize:'0.8rem',textAlign:'center'}} value={m.label||''} onChange={e=>{const ni=[...items];ni[mi]={...ni[mi],label:e.target.value};updateBlock(index,'items',ni)}} placeholder="конверсия"/>
                    </div>)}</div>
                    <div style={{marginTop:'0.5rem',display:'flex',gap:'0.3rem'}}><button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',[...items,{value:'',label:''}])}>+ Метрика</button>{items.length>1&&<button className="btn btn-dark btn-sm" onClick={()=>updateBlock(index,'items',items.slice(0,-1))}>− Убрать</button>}</div>
                </div>);
            }
            return <p style={{color:'#666'}}>Неизвестный тип: {block.type}</p>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
