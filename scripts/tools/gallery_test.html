<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; background: #fff; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { border: 1px solid #ccc; padding: 10px; text-align: center; }
  .card img { max-width: 100%; height: auto; border: 1px solid #eee; }
</style>
</head>
<body>
  <h1>KUKIS 1 (13 pages)</h1>
  <div class="grid" id="grid1"></div>
  <h1>KUKIS 2 (17 pages)</h1>
  <div class="grid" id="grid2"></div>
  <script>
    const grid1 = document.getElementById('grid1');
    for (let i = 1; i <= 13; i++) {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<h3>kuk2_page_${i}</h3><img src="/images/KUKIS/web-assets/preview/kuk2_page_${i}.jpg" alt="k1_${i}">`;
        grid1.appendChild(div);
    }
    const grid2 = document.getElementById('grid2');
    for (let i = 1; i <= 17; i++) {
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<h3>kukis_brand_page_${i}</h3><img src="/images/KUKIS/web-assets/preview/kukis_brand_page_${i}.jpg" alt="k2_${i}">`;
        grid2.appendChild(div);
    }
  </script>
</body>
</html>
